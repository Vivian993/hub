<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老師的 AI 教具箱</title>

<!-- 📌 iPhone 桌面 App 圖示：它會去抓您上傳到 GitHub 的 custom-icon.png 照片 -->
  <link rel="apple-touch-icon" href="custom-icon.png">
  <link rel="icon" type="image/png" href="custom-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;500;700;900&family=Huninn:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F1;
    --header-bg1:#F4E5E0;
    --header-bg2:#EDDBDF;
    --title-color:#A9695C;
    --ink:#4A413A;
    --ink-soft:#8C8177;
    --panel:#FFFDFA;
    --line:#E6DCD0;
    --input-bg:#FBF8F3;
    --hover-bg:rgba(120,105,90,0.08);
  }
  html[data-theme="dark"]{
    --bg:#252220;
    --header-bg1:#463838;
    --header-bg2:#3A3038;
    --title-color:#E3AFA2;
    --ink:#EEE7DE;
    --ink-soft:#B6AB9E;
    --panel:#332D29;
    --line:#4C443C;
    --input-bg:#2B2622;
    --hover-bg:rgba(255,255,255,0.06);
  }
  *{box-sizing:border-box;}
  html{ background:var(--bg); }
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    font-size:17px;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:linear-gradient(135deg, var(--header-bg1), var(--header-bg2));
    color:var(--ink);
    padding:18px 20px 16px;
  }
  .header-top{
    display:flex; align-items:center; gap:12px;
    max-width:1200px; margin:0 auto;
  }
  .logo{ flex:none; }
  .header-text{ flex:1; min-width:0; }
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    color:var(--title-color);
    font-weight:700;
    margin-bottom:3px;
  }
  h1{
    font-family:'ZCOOL KuaiLe', 'Noto Sans TC', sans-serif;
    font-size:clamp(24px,4.2vw,36px);
    margin:0 0 4px;
    line-height:1.25;
    color:var(--title-color);
  }
  header p.sub{
    margin:0;
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:640px;
    line-height:1.5;
  }
  .header-actions{
    max-width:1200px; margin:12px auto 0;
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .btn-manage{
    background:var(--panel);
    color:var(--ink);
    border:none;
    border-radius:10px;
    padding:9px 15px;
    font-family:'Noto Sans TC', sans-serif;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
  }
  .btn-manage:hover{ background:var(--hover-bg); }

  .search-wrap{ max-width:1200px; margin:12px auto 0; }
  .search-box{
    display:flex; align-items:center; gap:9px;
    background:var(--panel);
    border-radius:12px;
    padding:11px 16px;
    box-shadow:0 4px 14px rgba(0,0,0,0.1);
  }
  .search-box svg{flex:none; opacity:.5;}
  .search-box input{
    border:none; outline:none; background:transparent;
    font-family:'Noto Sans TC', sans-serif;
    font-size:17.5px; width:100%; color:var(--ink);
  }
  .search-box input::placeholder{color:#b3a99c;}

  main{ padding:26px 0 60px; background:var(--bg); }

  /* ---- horizontal swipe of category columns ---- */
  .board{
    display:flex;
    gap:18px;
    overflow-x:auto;
    padding:4px 20px 20px;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    background:var(--bg);
  }
  .board::-webkit-scrollbar{ height:8px; }
  .board::-webkit-scrollbar-thumb{ background:#DCD0C1; border-radius:6px; }
  .board::-webkit-scrollbar-track{ background:transparent; }

  .column{
    flex:0 0 min(360px, 90vw);
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }
  .col-head{
    display:flex; align-items:center; gap:10px;
    padding:0 4px; margin-bottom:14px;
  }
  .col-dot{ width:14px; height:14px; border-radius:5px; flex:none; }
  .col-title{ font-size:23px; font-weight:900; line-height:1.3; }
  .col-count{ font-size:14px; color:var(--ink-soft); font-weight:700; margin-left:auto; }

  .col-list{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
  }

  .card{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    aspect-ratio:1/1;
    border-radius:18px;
    padding:12px;
    text-decoration:none;
    border:1px solid rgba(0,0,0,0.04);
    box-shadow:0 2px 7px rgba(74,65,58,0.08);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,0.14); }
  .card h3{
    margin:0; font-size:20px; line-height:1.3; font-weight:800;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card .desc{
    margin:6px 0 0; font-size:12.5px; line-height:1.5; opacity:.75; font-weight:500;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* ---- flat grid (search mode) ---- */
  #grid{
    display:none;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:14px;
    padding:0 20px;
  }
  #grid.active{ display:grid; }
  #grid .card .tag{
    font-size:12px; font-weight:700; opacity:.7;
    margin-bottom:4px; letter-spacing:.02em;
  }

  .empty{ display:none; text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:17px; }

  footer{ text-align:center; color:var(--ink-soft); font-size:14px; padding:16px 20px 30px; }

  /* ---- manage panel ---- */
  .overlay{
    display:none;
    position:fixed; inset:0; background:rgba(40,34,30,0.45);
    z-index:50; padding:24px;
    align-items:flex-start; justify-content:center;
    overflow-y:auto;
  }
  .overlay.active{ display:flex; }
  .panel{
    background:var(--panel);
    border-radius:18px;
    max-width:680px; width:100%;
    padding:28px 26px 26px;
    margin:20px 0;
  }
  .panel h2{
    font-size:24px; margin:0 0 4px; font-family:'ZCOOL KuaiLe','Noto Sans TC',sans-serif;
    color:var(--title-color);
  }
  .panel h3{ font-size:18px; margin:0 0 10px; }
  .panel .panel-sub{ font-size:15px; color:var(--ink-soft); margin:0 0 18px; line-height:1.6; }
  .panel label{
    display:block; font-size:15px; font-weight:700; margin:14px 0 6px;
  }
  .panel input[type=text], .panel input[type=url], .panel select, .panel textarea{
    width:100%; font-family:'Noto Sans TC', sans-serif; font-size:16px;
    padding:11px 13px; border:1px solid var(--line); border-radius:9px;
    background:var(--input-bg); color:var(--ink);
  }
  .panel textarea{ resize:vertical; min-height:56px; }
  .panel .row2{ display:flex; gap:10px; }
  .panel .row2 > div{ flex:1; }
  .btn-row{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .btn-primary, .btn-secondary, .btn-danger, .btn-ghost{
    font-family:'Noto Sans TC', sans-serif; font-size:15.5px; font-weight:700;
    border-radius:9px; border:none; cursor:pointer; padding:12px 18px;
  }
  .btn-primary{ background:#8B9A7C; color:#fff; }
  .btn-primary:hover{ background:#7A8A6C; }
  .btn-secondary{ background:#EFE8DC; color:var(--ink); }
  .btn-secondary:hover{ background:#E4DBCB; }
  .btn-danger{ background:#E3B8B0; color:#5A3128; }
  .btn-danger:hover{ background:#D9A69C; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .hr{ height:1px; background:var(--line); margin:22px 0; border:none; }
  .manage-list{ max-height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; }
  .manage-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border-bottom:1px solid var(--line); font-size:15px;
    cursor:pointer;
  }
  .manage-item:hover{ background:var(--hover-bg); }
  .manage-item:last-child{ border-bottom:none; }
  .manage-item .mi-name{ font-weight:700; }
  .manage-item .mi-cat{ font-size:13px; color:var(--ink-soft); }
  .mi-del{
    background:none; border:none; color:#B3736A; font-size:19px; cursor:pointer; line-height:1;
    padding:4px 6px;
  }
  .close-x{
    position:absolute; top:20px; right:20px; background:none; border:none;
    font-size:24px; cursor:pointer; color:var(--ink-soft);
  }
  .panel-wrap{ position:relative; }
  .status-msg{ font-size:14px; color:#7A8A6C; font-weight:700; margin-top:8px; min-height:18px; }
  input[type=file]{ font-size:14px; }

  .cat-chip-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .cat-chip{
    display:flex; align-items:center; gap:8px;
    padding:8px 12px; border-radius:99px; font-size:14px; font-weight:700;
  }
  .cat-chip button{
    background:none; border:none; cursor:pointer; font-size:15px; opacity:.6; line-height:1;
  }
  .add-cat-row{ display:flex; gap:8px; margin-top:12px; }
  .add-cat-row input{ flex:1; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">
      <svg width="42" height="42" viewBox="0 0 64 64" fill="none">
        <rect x="2" y="2" width="60" height="60" rx="18" fill="#F4E9E4" stroke="#C9AFA5" stroke-width="2"/>
        <path d="M17 24c5-5 25-5 30 0v18c-5-4-25-4-30 0V24z" fill="#B3766C" opacity="0.85"/>
        <path d="M32 24v18" stroke="#F4E9E4" stroke-width="1.6"/>
        <circle cx="45" cy="18" r="4" fill="#8E7A9E"/>
        <circle cx="20" cy="16" r="3" fill="#7C8E63"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="eyebrow">教學 GEM 收藏庫</div>
      <h1>老師們的 AI 教具箱</h1>
      <p class="sub">集合大家共同發想、貢獻的教學工具連結，依主題分類、左右滑動切換。點卡片直接開啟工具。</p>
    </div>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="搜尋名稱或內容，例如：國語、因果複句、消消樂…">
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-manage" id="openManage">🛠️ 管理收藏（新增／編輯／分類）</button>
    <select class="btn-manage" id="fontSelect" style="cursor:pointer;">
      <option value="sans">預設字體（黑體）</option>
      <option value="serif">襯線字體（宋體）</option>
      <option value="rounded">圓體（可愛）</option>
      <option value="kai">手寫風（楷體）</option>
    </select>
    <button class="btn-manage" id="themeToggle">🌙 深色模式</button>
  </div>
</header>

<main>
  <div class="board" id="board"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">找不到符合的工具，換個關鍵字試試看。</div>
</main>

<footer>共 <span id="totalCount"></span> 個教學工具・來自大家共同整理</footer>

<div class="overlay" id="overlay">
  <div class="panel panel-wrap">
    <button class="close-x" id="closeManage">✕</button>
    <h2>管理收藏</h2>
    <p class="panel-sub">新增、編輯或刪除工具；也可以新增自己的主題分類。修改會自動儲存。</p>

    <h3 id="formTitle">新增工具</h3>
    <label>工具名稱</label>
    <input type="text" id="f-title" placeholder="例如：造句小老師">

    <div class="row2">
      <div>
        <label>分類</label>
        <select id="f-cat"></select>
      </div>
      <div>
        <label>是否為國語相關</label>
        <select id="f-guoyu">
          <option value="">否</option>
          <option value="國語">是</option>
        </select>
      </div>
    </div>

    <label>連結網址</label>
    <input type="url" id="f-url" placeholder="https://...">

    <label>說明（選填）</label>
    <textarea id="f-desc" placeholder="簡短描述這個工具的功能或內容"></textarea>

    <div class="btn-row">
      <button class="btn-primary" id="saveTool">＋ 新增工具</button>
      <button class="btn-ghost" id="cancelEdit" style="display:none;">取消編輯</button>
    </div>
    <div class="status-msg" id="addStatus"></div>

    <hr class="hr">
    <h3>主題分類</h3>
    <div class="cat-chip-list" id="catChips"></div>
    <div class="add-cat-row">
      <input type="text" id="newCatName" placeholder="新增主題名稱，例如：注音符號">
      <button class="btn-secondary" id="addCatBtn">＋ 新增主題</button>
    </div>
    <div class="status-msg" id="catStatus"></div>

    <hr class="hr">
    <h3>目前所有工具（點項目可編輯，點 ✕ 刪除）</h3>
    <div class="manage-list" id="manageList"></div>

    <hr class="hr">
    <h3>備份與還原</h3>
    <div class="btn-row">
      <button class="btn-secondary" id="exportBtn">⬇️ 下載備份（JSON）</button>
      <label class="btn-secondary" style="display:inline-flex;align-items:center;cursor:pointer;">
        ⬆️ 還原備份
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </label>
      <button class="btn-danger" id="resetBtn">重置為預設清單</button>
    </div>
    <div class="status-msg" id="ioStatus"></div>
  </div>
</div>

<script>
const defaultCategories = [
  {name:"閱讀理解", bg:"#DCE7E6", dot:"#5F7A7C"},
  {name:"識字生字", bg:"#F3E1DC", dot:"#B3766C"},
  {name:"成語",     bg:"#F2E8D3", dot:"#A98F55"},
  {name:"作文寫作", bg:"#E5EADA", dot:"#7C8E63"},
  {name:"數學",     bg:"#EBE3EE", dot:"#8E7A9E"},
  {name:"社會／特教", bg:"#F3E1D4", dot:"#AD7C57"},
  {name:"英文",     bg:"#DCEAE5", dot:"#5F8A7D"},
  {name:"視覺設計", bg:"#F2E1E8", dot:"#AC7690"},
  {name:"課室經營", bg:"#E4E6EC", dot:"#6C7488"},
  {name:"教學資源網站", bg:"#F3E9DB", dot:"#9C8060"}
];

const colorPool = [
  {bg:"#EBE2D4", dot:"#9C8F76"},
  {bg:"#DCE7EA", dot:"#6C8890"},
  {bg:"#EEDDE5", dot:"#A97D96"},
  {bg:"#E1EBD9", dot:"#7E9468"},
  {bg:"#F2E4D6", dot:"#B08F68"},
  {bg:"#E2E2EF", dot:"#7A7AA8"},
  {bg:"#F4E0D8", dot:"#B0715F"}
];

const defaultTools = [
  // 這是公開版本，工具清單留空，讓每位使用者自行新增自己的收藏
];

let categoriesData = [];
let toolsData = [];
let editingIndex = null;

function cloneDefault(){
  return {
    categories: JSON.parse(JSON.stringify(defaultCategories)),
    tools: JSON.parse(JSON.stringify(defaultTools))
  };
}

function getCatMeta(name){
  return categoriesData.find(c=>c.name===name) || {name, bg:"#DDD6CC", dot:"#8A8177"};
}

/* Storage helper: uses Claude's window.storage when available (inside this chat),
   falls back to the browser's own localStorage when running as a standalone
   webpage (e.g. hosted on GitHub Pages), so saved changes still persist there. */
async function storageGet(key){
  try{
    const res = await window.storage.get(key);
    return res ? res.value : null;
  }catch(e){
    try{ return localStorage.getItem(key); }catch(e2){ return null; }
  }
}
async function storageSet(key, value){
  try{
    await window.storage.set(key, value);
    return;
  }catch(e){
    try{ localStorage.setItem(key, value); }catch(e2){ /* no storage available at all */ }
  }
}

async function loadData(){
  const raw = await storageGet('toolbox-tools-v6');
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      categoriesData = parsed.categories || JSON.parse(JSON.stringify(defaultCategories));
      toolsData = parsed.tools || [];
      return;
    }catch(e){ /* corrupted data, fall through to defaults */ }
  }
  const d = cloneDefault();
  categoriesData = d.categories;
  toolsData = d.tools;
}

async function saveData(){
  await storageSet('toolbox-tools-v6', JSON.stringify({categories:categoriesData, tools:toolsData}));
}

const boardEl = document.getElementById('board');
const gridEl = document.getElementById('grid');
const emptyEl = document.getElementById('empty');

function hexToRgb(hex){
  hex = hex.replace('#','');
  return { r: parseInt(hex.substring(0,2),16), g: parseInt(hex.substring(2,4),16), b: parseInt(hex.substring(4,6),16) };
}
function mixHex(hexA, hexB, weightA){
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const r = Math.round(a.r*weightA + b.r*(1-weightA));
  const g = Math.round(a.g*weightA + b.g*(1-weightA));
  const bl = Math.round(a.b*weightA + b.b*(1-weightA));
  return '#' + [r,g,bl].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function isDarkTheme(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
function accentColor(dot){ return isDarkTheme() ? mixHex(dot, '#FFFFFF', 0.45) : dot; }

function cardHTML(x, showTag){
  const col = getCatMeta(x.c);
  const dark = isDarkTheme();
  const bg = dark ? mixHex(col.bg, '#2E2822', 0.5) : col.bg;
  const textColor = dark ? '#F2EAE0' : '#3F362F';
  return `
    <a class="card" href="${x.u}" target="_blank" rel="noopener" style="background:${bg}; color:${textColor};">
      ${showTag ? `<div class="tag" style="color:${accentColor(col.dot)}">${x.c}</div>` : ''}
      <h3>${x.t}</h3>
      ${x.d ? `<p class="desc">${x.d}</p>` : ''}
    </a>`;
}

function renderBoard(){
  boardEl.innerHTML = categoriesData.map(cat=>{
    const items = toolsData.filter(x=>x.c===cat.name);
    const accent = accentColor(cat.dot);
    return `
      <div class="column">
        <div class="col-head">
          <span class="col-dot" style="background:${accent}"></span>
          <span class="col-title" style="color:${accent}">${cat.name}</span>
          <span class="col-count">${items.length}</span>
        </div>
        <div class="col-list">
          ${items.length ? items.map(x=>cardHTML(x,false)).join('') : '<p style="color:#a89e91;font-size:14px;padding:0 4px;">這個主題還沒有工具</p>'}
        </div>
      </div>`;
  }).join('');
  document.getElementById('totalCount').textContent = toolsData.length;
}

function renderSearch(term){
  const filtered = toolsData.filter(x=>{
    return x.t.toLowerCase().includes(term) || x.c.toLowerCase().includes(term) ||
      (x.d && x.d.toLowerCase().includes(term)) || (x.k && x.k.toLowerCase().includes(term));
  });
  gridEl.innerHTML = filtered.map(x=>cardHTML(x,true)).join('');
  emptyEl.style.display = filtered.length ? 'none' : 'block';
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  const term = e.target.value.trim().toLowerCase();
  if(term){
    boardEl.style.display = 'none';
    gridEl.classList.add('active');
    renderSearch(term);
  } else {
    boardEl.style.display = '';
    gridEl.classList.remove('active');
    emptyEl.style.display = 'none';
  }
});

/* ---- manage panel ---- */
const overlay = document.getElementById('overlay');
const catSelect = document.getElementById('f-cat');

function renderCatSelect(){
  catSelect.innerHTML = categoriesData.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
}

function renderCatChips(){
  const wrap = document.getElementById('catChips');
  wrap.innerHTML = categoriesData.map((c,i)=>`
    <span class="cat-chip" style="background:${c.bg};color:${c.dot};">
      ${c.name}
      <button data-i="${i}" class="cat-del" title="刪除主題">✕</button>
    </span>
  `).join('');
  wrap.querySelectorAll('.cat-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = parseInt(btn.dataset.i);
      const cat = categoriesData[i];
      const inUse = toolsData.filter(x=>x.c===cat.name).length;
      if(inUse > 0){
        if(!confirm(`「${cat.name}」還有 ${inUse} 個工具，刪除主題會一併刪除這些工具，確定嗎？`)) return;
        toolsData = toolsData.filter(x=>x.c!==cat.name);
      }
      categoriesData.splice(i,1);
      await saveData();
      renderCatChips(); renderCatSelect(); renderBoard(); renderManageList();
    });
  });
}

document.getElementById('addCatBtn').addEventListener('click', async ()=>{
  const input = document.getElementById('newCatName');
  const name = input.value.trim();
  const status = document.getElementById('catStatus');
  if(!name){ status.textContent = '請輸入主題名稱'; status.style.color = '#B3736A'; return; }
  if(categoriesData.some(c=>c.name===name)){ status.textContent = '這個主題已經存在'; status.style.color = '#B3736A'; return; }
  const color = colorPool[categoriesData.length % colorPool.length];
  categoriesData.push({name, bg:color.bg, dot:color.dot});
  await saveData();
  input.value='';
  status.textContent = `已新增主題「${name}」`;
  status.style.color = '#7A8A6C';
  renderCatChips(); renderCatSelect(); renderBoard();
});

function renderManageList(){
  const list = document.getElementById('manageList');
  list.innerHTML = toolsData.map((x,i)=>`
    <div class="manage-item" data-i="${i}">
      <div class="mi-body">
        <div class="mi-name">${x.t}</div>
        <div class="mi-cat">${x.c}</div>
      </div>
      <button class="mi-del" data-i="${i}" title="刪除">✕</button>
    </div>
  `).join('');
  list.querySelectorAll('.mi-body').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = parseInt(el.closest('.manage-item').dataset.i);
      startEdit(i);
    });
  });
  list.querySelectorAll('.mi-del').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const i = parseInt(btn.dataset.i);
      toolsData.splice(i,1);
      await saveData();
      renderBoard();
      renderManageList();
      if(editingIndex === i) cancelEdit();
    });
  });
}

function startEdit(i){
  editingIndex = i;
  const x = toolsData[i];
  document.getElementById('f-title').value = x.t;
  catSelect.value = x.c;
  document.getElementById('f-url').value = x.u;
  document.getElementById('f-desc').value = x.d || '';
  document.getElementById('f-guoyu').value = x.k || '';
  document.getElementById('formTitle').textContent = `編輯工具：${x.t}`;
  document.getElementById('saveTool').textContent = '✓ 更新工具';
  document.getElementById('cancelEdit').style.display = 'inline-block';
  overlay.scrollTop = 0;
}

function cancelEdit(){
  editingIndex = null;
  document.getElementById('f-title').value='';
  document.getElementById('f-url').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-guoyu').value='';
  document.getElementById('formTitle').textContent = '新增工具';
  document.getElementById('saveTool').textContent = '＋ 新增工具';
  document.getElementById('cancelEdit').style.display = 'none';
}
document.getElementById('cancelEdit').addEventListener('click', cancelEdit);

document.getElementById('openManage').addEventListener('click', ()=>{
  overlay.classList.add('active');
  renderCatChips();
  renderCatSelect();
  renderManageList();
});
document.getElementById('closeManage').addEventListener('click', ()=>{ overlay.classList.remove('active'); cancelEdit(); });
overlay.addEventListener('click', (e)=>{ if(e.target === overlay){ overlay.classList.remove('active'); cancelEdit(); } });

document.getElementById('saveTool').addEventListener('click', async ()=>{
  const t = document.getElementById('f-title').value.trim();
  const c = catSelect.value;
  const u = document.getElementById('f-url').value.trim();
  const d = document.getElementById('f-desc').value.trim();
  const k = document.getElementById('f-guoyu').value;
  const status = document.getElementById('addStatus');

  if(!t || !u){
    status.textContent = '請至少填寫「工具名稱」和「連結網址」';
    status.style.color = '#B3736A';
    return;
  }
  const toolObj = {t, c, u};
  if(d) toolObj.d = d;
  if(k) toolObj.k = k;

  if(editingIndex !== null){
    toolsData[editingIndex] = toolObj;
    status.textContent = `已更新「${t}」`;
  } else {
    toolsData.push(toolObj);
    status.textContent = `已新增「${t}」`;
  }
  status.style.color = '#7A8A6C';
  await saveData();
  renderBoard();
  renderManageList();
  cancelEdit();
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify({categories:categoriesData, tools:toolsData}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `教具箱備份_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  document.getElementById('ioStatus').textContent = '備份已下載';
  document.getElementById('ioStatus').style.color = '#7A8A6C';
});

document.getElementById('importFile').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  const status = document.getElementById('ioStatus');
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed.tools || !Array.isArray(parsed.tools)) throw new Error('格式錯誤');
    toolsData = parsed.tools;
    categoriesData = parsed.categories || categoriesData;
    await saveData();
    renderBoard(); renderCatChips(); renderCatSelect(); renderManageList();
    status.textContent = '已還原備份資料';
    status.style.color = '#7A8A6C';
  }catch(err){
    status.textContent = '備份檔案格式不正確，還原失敗';
    status.style.color = '#B3736A';
  }
  e.target.value = '';
});

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(!confirm('確定要重置為預設清單嗎？這會清除你自行新增、編輯或刪除的內容。')) return;
  const d = cloneDefault();
  categoriesData = d.categories;
  toolsData = d.tools;
  await saveData();
  renderBoard(); renderCatChips(); renderCatSelect(); renderManageList();
  document.getElementById('ioStatus').textContent = '已重置為預設清單';
  document.getElementById('ioStatus').style.color = '#7A8A6C';
});

(async function init(){
  await loadData();
  renderBoard();
  await loadPrefs();
})();

/* ---- font & theme preferences ---- */
const fontFamilies = {
  sans:   "'Noto Sans TC', sans-serif",
  serif:  "'Noto Serif TC', serif",
  rounded:"'Huninn', 'Noto Sans TC', sans-serif",
  kai:    "'LXGW WenKai TC', 'Noto Serif TC', serif"
};
let prefs = { font:'sans', theme:'light' };

async function loadPrefs(){
  const raw = await storageGet('toolbox-prefs-v1');
  if(raw){
    try{ prefs = JSON.parse(raw); }catch(e){ /* use defaults */ }
  }
  applyPrefs();
}

async function savePrefs(){
  await storageSet('toolbox-prefs-v1', JSON.stringify(prefs));
}

function applyPrefs(){
  document.body.style.fontFamily = fontFamilies[prefs.font] || fontFamilies.sans;
  document.getElementById('fontSelect').value = prefs.font;
  document.documentElement.setAttribute('data-theme', prefs.theme);
  document.getElementById('themeToggle').textContent = prefs.theme === 'dark' ? '☀️ 淺色模式' : '🌙 深色模式';
  const term = document.getElementById('searchInput').value.trim().toLowerCase();
  if(term){ renderSearch(term); } else { renderBoard(); }
}

document.getElementById('fontSelect').addEventListener('change', async (e)=>{
  prefs.font = e.target.value;
  applyPrefs();
  await savePrefs();
});

document.getElementById('themeToggle').addEventListener('click', async ()=>{
  prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark';
  applyPrefs();
  await savePrefs();
});

/* ---- button / card click sound (synthesized, no audio file needed) ---- */
let audioCtx;
function playClickSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(680, now);
    osc.frequency.exponentialRampToValueAtTime(420, now + 0.07);
    gain.gain.setValueAtTime(0.16, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  }catch(e){ /* audio not available, silently ignore */ }
}
document.addEventListener('click', (e)=>{
  if(e.target.closest('.card, .btn-manage, .btn-primary, .btn-secondary, .btn-danger, .btn-ghost, .mi-del, .cat-del, .close-x, .mi-body, .cat-chip button')){
    playClickSound();
  }
}, true);
