    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4;
            -webkit-tap-highlight-color: transparent;
        }
        .task-checkbox {
            appearance: none;
            width: 2.2rem;
            height: 2.2rem;
            border: 3px solid #4ade80;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease-in-out;
            flex-shrink: 0;
        }
        .task-checkbox:checked {
            background-color: #22c55e;
            border-color: #22c55e;
        }
        .task-checkbox:checked::after {
            content: '✔';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .task-card {
            transition: all 0.3s ease;
        }
        .task-card.completed {
            background-color: #e2e8f0;
            opacity: 0.8;
        }
        .task-card.completed .task-text {
            text-decoration: line-through;
            color: #64748b;
        }
    </style>

        <!-- 頁籤切換按鈕 (調整為 5 個頁籤) -->

            <button id="btn-tasks" onclick="switchTab('tasks')" class="bg-green-100 text-green-700 font-bold py-2 rounded-xl shadow-sm border-2 border-green-500 transition-colors text-[11px] flex flex-col items-center justify-center">

        <!-- 內容區：細節紀錄 (新增自訂餵食、泡澡時間與精進事項) -->

                    </select>
                </div>

                <!-- 細節文字輸入 -->

                    <label class="block text-xs font-bold text-slate-600 mb-1">詳細內容說明：</label>
                    <textarea id="detail-content" rows="2" placeholder="例如：吃了地瓜葉碎末加泡軟草餅 5 顆，泡溫水 20 分鐘，排酸正常。" class="w-full rounded-xl border-2 border-amber-200 p-3 text-sm bg-white focus:outline-none focus:border-amber-500"></textarea>

            <!-- 細節紀錄列表 -->

            <div id="detail-list" class="space-y-3">
                <!-- 紀錄由 JS 產生 -->
            </div>
        </div>

        <!-- 內容區：每月飼養指南 -->

        <!-- 內容區：每月成長相簿 -->

            </div>

            <div class="bg-purple-50 rounded-2xl p-4 border-2 border-purple-100 shadow-sm space-y-3">

                <select id="photo-month-select" class="w-full rounded-xl border-2 border-purple-200 px-3 py-2 text-sm font-bold bg-white focus:outline-none focus:border-purple-500">

                    <option value="第 6 個月">第 6 個月</option>
                    <option value="第 7 個月">第 7 個月</option>
                    <option value="第 8 個月">第 8 個月</option>
                    <option value="第 9 個月">第 9 個月</option>
                    <option value="第 10 個月">第 10 個月</option>
                    <option value="第 11 個月">第 11 個月</option>
                    <option value="第 12 個月">第 12 個月 (滿一歲)</option>

                <label class="block w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 rounded-xl text-center shadow-md cursor-pointer transition-transform active:scale-95">

            <div id="weight-list" class="space-y-3">
                <!-- 紀錄由 JS 產生 -->
            </div>

    <script>
        // 初始化時間下拉選單 (小時 00-23，分鐘 00-55 間隔 5 分鐘)
        function initTimeSelectors() {
            const hourSelect = document.getElementById('detail-hour');
            const minuteSelect = document.getElementById('detail-minute');
            
            if (!hourSelect || !minuteSelect) return;

            hourSelect.innerHTML = '';
            minuteSelect.innerHTML = '';

            for (let i = 0; i < 24; i++) {
                const hourStr = String(i).padStart(2, '0');
                hourSelect.innerHTML += `<option value="${hourStr}">${hourStr} 時</option>`;
            }

            for (let i = 0; i < 60; i += 5) {
                const minStr = String(i).padStart(2, '0');
                minuteSelect.innerHTML += `<option value="${minStr}">${minStr} 分</option>`;
            }

            // 預設選中當前時間
            const now = new Date();
            hourSelect.value = String(now.getHours()).padStart(2, '0');
            // 接近的 5 分鐘倍數
            const roundedMin = Math.round(now.getMinutes() / 5) * 5;
            minuteSelect.value = String(roundedMin === 60 ? 0 : roundedMin).padStart(2, '0');
        }

        // --- 詳細時間與每日任務資料 ---
        const taskData = [

            { id: 'm2', time: '🌞 早晨 (08:30 - 09:30)', title: '準備精細早餐', text: '將高纖野草/菜葉切成 0.5cm 極碎，或將草餅飼料「徹底溫水泡軟搗碎」，份量約龜殼體積 80%。', icon: 'fa-leaf', color: 'text-green-500' },
            { id: 'm3', time: '🌞 早晨 (09:00 之後)', title: '更換乾淨飲水', text: '換上極淺的陶土水盆（放置冷區，水位低於下巴，絕對不能過深防溺水）。', icon: 'fa-glass-water', color: 'text-blue-400' },
            
            { id: 'a1', time: '☀️ 下午 (14:00 - 16:00)', title: '溫水泡澡與排酸', text: '準備 30-35°C 溫水，讓龜龜泡澡 15-20 分鐘（水位不超過腹甲裙邊），仔細觀察有無白色排酸！', icon: 'fa-bath', color: 'text-cyan-500' },
            { id: 'a2', time: '☀️ 下午 (泡澡後)', title: '溫柔擦乾身體', text: '泡完澡後用軟毛巾將龜殼與腹甲輕輕擦乾，避免溫差著涼感冒。', icon: 'fa-hands-bubbles', color: 'text-pink-500' },
            
            { id: 'e1', time: '🌙 晚上 (19:00 - 20:00)', title: '檢查環境濕度', text: '噴水保持底材微濕，確保整體濕度在 60% - 70%（防止龜殼隆背變形）。', icon: 'fa-droplet', color: 'text-blue-500' },
            { id: 'e2', time: '🌙 晚上 (21:00)', title: '關燈就寢', text: '關閉所有發光燈具，讓龜龜安心睡覺（夜間溫度需維持 25°C 以上）。', icon: 'fa-moon', color: 'text-indigo-500' }
        ];

        let tasksState = {};
        taskData.forEach(task => {
            tasksState[task.id] = { completed: false, timeStr: '', keeper: '' };
        });

        // 每月飼養指南資料
        const monthGuideData = {
            1: {
                title: "🐣 1 ~ 3 個月：最脆弱的黃金起步期",
                badge: "現階段寶寶",
                bath: "每天 1 次溫水泡澡（15-20分鐘），嚴格盯緊排酸與保濕。",

                env: "熱點 38-40°C，環境濕度保持 60%-70%（防隆背）。",
                tip: "免疫力與保水力極差，切忌吹風或溫差過大，每天細心觀察糞便與排酸狀態！"
            },
            2: {
                title: "🌱 4 ~ 6 個月：適應環境與快速發育期",
                badge: "成長中",

                env: "隨著體型變大，可稍微擴大飼養箱活動空間，維持高溫高濕。",

                bath: "可從每天泡澡逐漸放寬為 **每週 2 到 3 次**。",
                diet: "不需要再切得像細末，可以給整株地瓜葉或牧草讓牠自己啃咬。",

            5: {

                alert('請填寫詳細內容說明喔！');

            detailRecords.push({
                date: dateStr,

                renderDetails();

        // --- 拍照與自動圖片壓縮功能 ---
        window.compressAndSavePhoto = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const monthSelect = document.getElementById('photo-month-select');
            const selectedMonth = monthSelect.value;
            const keeperInput = document.getElementById('keeper-name');
            const keeperName = keeperInput.value.trim() || '保母';

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    const MAX_HEIGHT = 600;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    const today = new Date();
                    const dateStr = today.getFullYear() + '/' + (today.getMonth()+1) + '/' + today.getDate();

                    const existingIndex = photoRecords.findIndex(p => p.month === selectedMonth);
                    if (existingIndex >= 0) {
                        photoRecords[existingIndex] = { month: selectedMonth, img: compressedDataUrl, date: dateStr, keeper: keeperName };
                    } else {
                        photoRecords.push({ month: selectedMonth, img: compressedDataUrl, date: dateStr, keeper: keeperName });
                    }

                    renderPhotos();
                    alert(`成功上傳並壓縮 [${selectedMonth}] 的成長照片！`);
                    event.target.value = '';
                }
            }
        }

        function renderPhotos() {
            const gallery = document.getElementById('photo-gallery');
            gallery.innerHTML = '';

            if (photoRecords.length === 0) {
                gallery.innerHTML = '<div class="col-span-2 text-center text-slate-400 py-6 font-medium text-sm">還沒有上傳照片喔！趕快拍一張記錄寶貝的可愛模樣吧。</div>';
                return;
            }

            photoRecords.forEach((record, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl border-2 border-purple-100 overflow-hidden shadow-sm flex flex-col relative';
                card.innerHTML = `
                    <button onclick="deletePhoto(${index})" class="absolute top-2 right-2 bg-red-500 text-white w-7 h-7 rounded-full flex items-center justify-center shadow hover:bg-red-600 text-xs z-10" title="刪除照片">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <div class="relative bg-slate-100 h-40">
                        <img src="${record.img}" alt="${record.month}" class="w-full h-full object-cover">
                        <span class="absolute top-2 left-2 bg-purple-600 text-white text-xs font-bold px-2 py-1 rounded-lg shadow">${record.month}</span>
                    </div>
                    <div class="p-3 text-xs text-slate-600 space-y-1">
                        <p class="font-bold text-slate-800"><i class="fa-solid fa-calendar mr-1 text-purple-500"></i> ${record.date}</p>
                        <p><i class="fa-solid fa-user mr-1 text-purple-500"></i> 攝影師：${record.keeper}</p>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        window.deletePhoto = function(index) {
            if (confirm('確定要刪除這張成長照片嗎？')) {
                photoRecords.splice(index, 1);
                renderPhotos();
            }

        // --- 渲染每日任務 ---
        function renderTasks() {
            const container = document.getElementById('task-container');
            container.innerHTML = '';
            let currentGroup = '';

            const petInput = document.getElementById('pet-name');
            const petName = petInput.value.trim() || '龜寶貝';

            taskData.forEach(task => {
                if (task.time !== currentGroup) {
                    currentGroup = task.time;
                    const groupTitle = document.createElement('h3');
                    groupTitle.className = 'font-bold text-base text-slate-700 bg-emerald-100 rounded-xl px-4 py-2 mt-5 mb-3 flex items-center gap-2';
                    groupTitle.innerHTML = `<i class="fa-solid fa-clock text-emerald-600"></i> ${currentGroup}`;
                    container.appendChild(groupTitle);
                }

                const state = tasksState[task.id];
                const card = document.createElement('label');
                card.className = `task-card flex items-center p-4 bg-white border-2 border-slate-100 rounded-2xl shadow-sm cursor-pointer ${state.completed ? 'completed' : ''}`;
                
                let infoHtml = '';
                if(state.completed) {
                    infoHtml = `<div class="text-xs text-green-600 font-bold mt-1"><i class="fa-solid fa-circle-check mr-1"></i>保母 [${state.keeper}] 已幫 [${petName}] 完成於 ${state.timeStr}</div>`;
                }

                card.innerHTML = `
                    <div class="flex-1 flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-slate-50 flex items-center justify-center border border-slate-100 shadow-inner shrink-0">
                            <i class="fa-solid ${task.icon} text-2xl ${task.color}"></i>
                        </div>
                        <div class="flex-1">
                            <h4 class="font-bold text-slate-800 text-lg task-text">${task.title}</h4>
                            <p class="text-xs text-slate-500 font-medium task-text mt-0.5 leading-relaxed">${task.text}</p>
                            ${infoHtml}
                        </div>
                    </div>
                    <input type="checkbox" class="task-checkbox ml-3" ${state.completed ? 'checked' : ''} onchange="toggleTask('${task.id}')">
                `;
                container.appendChild(card);
            });
        }

        window.toggleTask = function(id) {
            const keeperInput = document.getElementById('keeper-name');
            const keeperName = keeperInput.value.trim() || '值日生';

            if (!tasksState[id].completed) {
                const now = new Date();
                const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
                
                tasksState[id] = {
                    completed: true,
                    timeStr: timeStr,
                    keeper: keeperName
                };
            } else {
                tasksState[id] = {
                    completed: false,
                    timeStr: '',
                    keeper: ''
                };
            }
            renderTasks();
            checkAllDone();
        };

        function checkAllDone() {
            const allDone = Object.values(tasksState).every(val => val.completed === true);
            if (allDone) {
                setTimeout(() => {
                    confetti({
                        particleCount: 180,
                        spread: 80,
                        origin: { y: 0.6 },
                        colors: ['#4ade80', '#fbbf24', '#f472b6', '#60a5fa']
                    });
                }, 200);
            }
        }

        window.resetTasks = function() {
            for (let key in tasksState) {
                tasksState[key] = { completed: false, timeStr: '', keeper: '' };
            }
            renderTasks();
        }

        // --- 渲染每月指南 ---

                </div>

        // --- 體重紀錄功能 ---
        function renderWeights() {
            const list = document.getElementById('weight-list');
            list.innerHTML = '';
            
            if(weightRecords.length === 0) {
                list.innerHTML = '<div class="text-center text-slate-400 py-4 font-medium text-sm">還沒有體重紀錄喔！趕快輸入第一筆資料吧。</div>';
                return;
            }

            const sortedRecords = [...weightRecords].sort((a,b) => new Date(b.date) - new Date(a.date));

            sortedRecords.forEach((record, index) => {
                const originalIndex = weightRecords.indexOf(record);
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-white border-2 border-slate-100 p-4 rounded-xl shadow-sm';
                
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-500 flex items-center justify-center font-bold">
                            <i class="fa-regular fa-calendar"></i>
                        </div>
                        <div>
                            <p class="font-bold text-slate-700 text-sm">${record.date}</p>
                            <p class="text-xs text-slate-400">保母紀錄</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-xl font-black text-slate-800">
                            ${record.weight} <span class="text-sm font-bold text-slate-500">g</span>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="editWeight(${originalIndex})" class="bg-amber-100 text-amber-600 w-8 h-8 rounded-lg flex items-center justify-center hover:bg-amber-200 text-xs" title="修改">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteWeight(${originalIndex})" class="bg-red-100 text-red-600 w-8 h-8 rounded-lg flex items-center justify-center hover:bg-red-200 text-xs" title="刪除">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        window.addWeight = function() {
            const input = document.getElementById('weight-input');
            const weightVal = parseFloat(input.value);

            if (isNaN(weightVal) || weightVal <= 0) {
                alert('請輸入正確的數字喔！');
                return;
            }

            const today = new Date();
            const dateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

            weightRecords.push({ date: dateStr, weight: weightVal });
            input.value = '';
            renderWeights();
            
            confetti({
                particleCount: 50,
                spread: 50,
                origin: { y: 0.8 }
            });
        }

        window.deleteWeight = function(index) {
            if (confirm('確定要刪除這筆體重紀錄嗎？')) {
                weightRecords.splice(index, 1);
                renderWeights();
            }
        }

        window.editWeight = function(index) {
            const currentWeight = weightRecords[index].weight;
            const newWeightStr = prompt('請修改這筆紀錄的體重 (克 g)：', currentWeight);
            
            if (newWeightStr === null) return;

            const newWeight = parseFloat(newWeightStr);
            if (isNaN(newWeight) || newWeight <= 0) {
                alert('請輸入有效的數字！');
                return;
            }

            weightRecords[index].weight = newWeight;
            renderWeights();
            alert('體重紀錄修改成功！');
        }

                renderWeights();
            }
        }

        initTimeSelectors();
        renderTasks();
        renderWeights();
        renderPhotos();
        renderDetails();
    </script>
