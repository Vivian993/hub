<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>康軒五上國語隨身卡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .card-flip {
      perspective: 1000px;
    }
    .card-inner {
      transition: transform 0.5s;
      transform-style: preserve-3d;
    }
    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 flex flex-col justify-between selection:bg-amber-200">

  <!-- 頂部導覽列 -->
  <header class="bg-amber-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-graduation-cap text-2xl text-yellow-300"></i>
        <h1 class="text-lg font-extrabold tracking-wide">康軒五上生字句型卡</h1>
      </div>
      <div class="flex items-center gap-2">
        <!-- 音效開關按鈕 -->
        <button id="sound-toggle-btn" onclick="toggleSound()" class="text-xs bg-amber-700 hover:bg-amber-800 border border-amber-400 p-2 rounded-xl text-yellow-300" title="切換音效開關">
          <i id="sound-icon" class="fa-solid fa-volume-high text-sm"></i>
        </button>
        <!-- 備份管理按鈕 -->
        <button onclick="openBackupModal()" class="text-xs bg-amber-700 hover:bg-amber-800 border border-amber-400 px-2.5 py-1.5 rounded-xl flex items-center space-x-1 font-bold">
          <i class="fa-solid fa-floppy-disk"></i>
          <span>管理/備份</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區塊 -->
  <main class="max-w-md mx-auto w-full flex-1 px-4 py-3 flex flex-col justify-between">
    
    <!-- 課文選擇與模式切換 -->
    <div>
      <div class="mb-2">
        <select id="lesson-select" onchange="changeLesson()" class="w-full bg-white border-2 border-amber-300 text-amber-900 text-sm font-extrabold rounded-xl p-2.5 outline-none shadow-sm focus:ring-2 focus:ring-amber-500">
          <option value="L1">第 1 課 《蚊帳大使》</option>
          <option value="L2">第 2 課 《從空中看臺灣》</option>
          <option value="L3">第 3 課 《攀岩高手》</option>
          <option value="L4">第 4 課 《恆久的美》</option>
          <option value="L5">第 5 課 《它抓得住你–商標的故事》</option>
          <option value="L6">第 6 課 《故事動起來》</option>
          <option value="L7">第 7 課 《為生命找出路》</option>
          <option value="L8">第 8 課 《最勇敢的女孩》</option>
          <option value="L9">第 9 課 《在挫折中成長》</option>
          <option value="L10">第 10 課 《山中寄情》</option>
          <option value="L11">第 11 課 《與達駭黑熊走入森林》</option>
          <option value="L12">第 12 課 《荒島上的國王》</option>
        </select>
      </div>

      <!-- 四大分類標籤 -->
      <div class="grid grid-cols-4 gap-1 bg-amber-200/60 p-1 rounded-xl mb-3 text-[11px] sm:text-xs font-bold shadow-inner">
        <button id="tab-vocab" onclick="setFilter('vocab')" class="py-2 rounded-lg transition-all text-center bg-white text-amber-800 shadow-sm font-black">
          生字 (<span id="count-vocab">0</span>)
        </button>
        <button id="tab-sentence" onclick="setFilter('sentence')" class="py-2 rounded-lg transition-all text-center text-slate-700 hover:text-amber-800">
          句型 (<span id="count-sentence">0</span>)
        </button>
        <button id="tab-star" onclick="setFilter('star')" class="py-2 rounded-lg transition-all text-center text-slate-700 hover:text-amber-800 flex justify-center items-center gap-0.5">
          <i class="fa-solid fa-star text-amber-500"></i>星號 (<span id="count-star">0</span>)
        </button>
        <button id="tab-quiz" onclick="openQuizSetupModal()" class="py-2 rounded-lg transition-all text-center text-slate-700 hover:text-amber-800 flex justify-center items-center gap-0.5">
          <i class="fa-solid fa-gamepad text-emerald-600"></i>測驗
        </button>
      </div>

      <p id="mode-tip" class="text-xs text-amber-800/80 text-center font-bold mb-2">
        💡 切換選項專心背！翻面會「自動朗讀」解釋與例句喔！
      </p>
    </div>

    <!-- 單字卡視圖 -->
    <div id="flashcard-view" class="flex-1 flex flex-col justify-center my-2">
      <div id="card-container" class="card-flip w-full min-h-[380px] cursor-pointer" onclick="flipCard()">
        <div id="card-inner" class="card-inner relative w-full h-full min-h-[380px] bg-white rounded-3xl shadow-xl border-4 border-amber-200 flex flex-col justify-between p-6">
          
          <div class="card-front absolute inset-0 p-6 flex flex-col justify-between bg-white rounded-3xl">
            <div class="flex justify-between items-center">
              <span id="card-type-tag" class="text-xs font-black text-amber-700 bg-amber-100 px-3 py-1 rounded-full">生字學習</span>
              <span id="card-index-tag" class="text-xs font-bold text-slate-400">1 / 20</span>
              <button onclick="toggleStar(event)" class="text-3xl text-slate-300 hover:text-amber-400 transition-colors p-1" title="加入不熟記號">
                <i id="star-icon" class="fa-solid fa-star"></i>
              </button>
            </div>
            
            <div class="my-auto text-center py-4 relative">
              <div class="flex justify-center items-center gap-3 mb-2">
                <h2 id="card-word" class="font-black text-slate-800 tracking-wider leading-snug">載入中...</h2>
                <button onclick="playPronunciation(event, 'front')" class="text-amber-600 bg-amber-100 hover:bg-amber-200 rounded-full w-10 h-10 flex-shrink-0 flex items-center justify-center transition-colors shadow-md active:scale-95" title="點擊發音">
                  <i class="fa-solid fa-volume-high text-lg"></i>
                </button>
              </div>
              <p id="card-pinyin-front" class="text-xl font-extrabold text-amber-600 mt-2 tracking-widest"></p>
            </div>

            <div class="text-center text-xs text-slate-400 flex items-center justify-center gap-1 font-semibold">
              <i class="fa-solid fa-hand-pointer"></i> 點擊卡片空白處翻面，將會自動朗讀
            </div>
          </div>

          <div class="card-back absolute inset-0 p-5 flex flex-col justify-between bg-amber-900 text-white rounded-3xl">
            <div class="flex justify-between items-center border-b border-amber-700 pb-2">
              <div class="flex items-center gap-3 overflow-hidden">
                <h3 id="card-word-back" class="text-xl sm:text-2xl font-black text-yellow-300 truncate"></h3>
                <button onclick="playPronunciation(event, 'back')" class="text-amber-900 bg-yellow-400 hover:bg-yellow-300 rounded-full w-8 h-8 flex-shrink-0 flex items-center justify-center transition-colors shadow-sm active:scale-95" title="點擊重新朗讀全部">
                  <i class="fa-solid fa-volume-high text-sm"></i>
                </button>
                <span id="card-pinyin-back" class="text-xs sm:text-sm font-bold text-amber-200 ml-1 truncate"></span>
              </div>
              <button onclick="toggleStar(event)" class="text-3xl text-amber-300/60 hover:text-yellow-300 transition-colors p-1 flex-shrink-0">
                <i id="star-icon-back" class="fa-solid fa-star"></i>
              </button>
            </div>

            <div class="my-auto overflow-y-auto max-h-[260px] py-3 pr-1 text-left">
              <div id="card-meaning-container" class="space-y-2"></div>
            </div>

            <div class="text-center text-xs text-amber-300/80 border-t border-amber-700 pt-2 font-semibold">
              再次點擊可回到正面
            </div>
          </div>

        </div>
      </div>

      <div class="flex justify-between items-center gap-3 mt-4">
        <button onclick="prevCard()" class="flex-1 bg-white hover:bg-amber-50 text-amber-800 font-extrabold py-3 px-4 rounded-2xl shadow border-2 border-amber-200 active:scale-95 transition-all flex justify-center items-center gap-2 text-base">
          <i class="fa-solid fa-chevron-left"></i> 上一個
        </button>
        <button onclick="nextCard()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-extrabold py-3 px-4 rounded-2xl shadow-lg active:scale-95 transition-all flex justify-center items-center gap-2 text-base">
          下一個 <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>

    <!-- 測驗驗收視圖 -->
    <div id="quiz-view" class="hidden flex-1 flex-col justify-between my-2 bg-white rounded-3xl shadow-xl p-5 border-2 border-amber-200">
      <div id="quiz-body">
        <div class="flex justify-between items-center mb-3 pb-2 border-b">
          <span id="quiz-mode-tag" class="text-xs font-black text-emerald-800 bg-emerald-100 px-3 py-1 rounded-full">國語進階挑戰</span>
          <span id="quiz-progress" class="text-xs text-slate-500 font-bold">1 / 20</span>
        </div>
        <div class="text-center my-3">
          <span id="quiz-subtitle" class="text-sm text-slate-400 font-bold block mb-2">測驗載入中</span>
          <h3 id="quiz-question" class="text-2xl sm:text-3xl font-black text-slate-800 tracking-wide leading-snug">--</h3>
        </div>
        <div id="quiz-options" class="space-y-3 my-4"></div>
      </div>

      <div id="quiz-result" class="hidden py-4 text-center space-y-4">
        <h3 class="text-2xl font-black text-slate-800">🎉 測驗完成囉！</h3>
        <div class="bg-amber-50 p-4 rounded-2xl border-2 border-amber-200 inline-block w-full">
          <p class="text-slate-500 text-xs mb-1 font-bold">得分與答對題數</p>
          <p id="quiz-score-num" class="text-5xl font-black text-emerald-600">100 分</p>
          <p id="quiz-score-detail" class="text-sm text-slate-500 font-bold mt-2">答對 20 / 20 題</p>
        </div>

        <div id="wrong-summary" class="hidden text-left bg-rose-50 p-3 rounded-2xl border border-rose-200 text-xs space-y-1 max-h-[160px] overflow-y-auto">
          <p class="font-black text-rose-700 mb-2">❌ 錯題檢討紀錄：</p>
          <ul id="wrong-list" class="list-disc list-inside text-rose-800 space-y-2 font-semibold leading-relaxed"></ul>
        </div>

        <div class="space-y-2 pt-2">
          <button id="btn-add-wrong-stars" onclick="addWrongToStars()" class="hidden w-full bg-amber-500 hover:bg-amber-600 text-white font-black py-3 rounded-xl text-sm shadow-md transition-colors">
            ⭐ 將錯題字詞加入「星號加強庫」
          </button>
          <button onclick="openQuizSetupModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-sm shadow-md transition-colors">
            再進行一次測驗
          </button>
        </div>
      </div>

      <div id="quiz-footer" class="mt-2">
        <div id="quiz-feedback" class="text-center py-2 min-h-[3.5rem] flex flex-col justify-center font-black text-sm sm:text-base"></div>
        <button id="quiz-next-btn" onclick="nextQuizQuestion()" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl shadow active:scale-95 transition-all">
          下一題 <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>

    <!-- 底部功能列 -->
    <div class="mt-2 grid grid-cols-2 gap-2">
      <button onclick="openAddModal()" class="bg-amber-500 hover:bg-amber-600 text-white text-sm font-black py-2.5 px-3 rounded-2xl shadow flex justify-center items-center gap-1.5 active:scale-95 transition-all">
        <i class="fa-solid fa-circle-plus"></i> 新增補充學習
      </button>
      <button onclick="toggleListView()" id="btn-toggle-list" class="bg-slate-700 hover:bg-slate-800 text-white text-sm font-black py-2.5 px-3 rounded-2xl shadow flex justify-center items-center gap-1.5 active:scale-95 transition-all">
        <i class="fa-solid fa-list-check"></i> 總覽清單
      </button>
    </div>

  </main>

  <!-- 測驗設定 Modal -->
  <div id="quiz-setup-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-black text-slate-800 text-lg">設定測驗範圍與題數</h3>
        <button onclick="closeQuizSetupModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-slate-600 font-bold text-sm mb-1.5">測驗題目來源</label>
          <select id="quiz-source-select" class="w-full border-2 border-slate-200 rounded-xl p-3 text-sm font-bold text-slate-700 outline-none">
            <option value="all">綜合大挑戰 (生字 + 句型造句)</option>
            <option value="vocab">僅限【生字與語詞】測驗</option>
            <option value="sentence">僅限【句型與造句】測驗</option>
            <option value="star">僅限標記 ⭐ 星號的加強題</option>
          </select>
        </div>

        <div>
          <label class="block text-slate-600 font-bold text-sm mb-1.5">測驗總題數</label>
          <select id="quiz-count-select" class="w-full border-2 border-slate-200 rounded-xl p-3 text-sm font-bold text-slate-700 outline-none">
            <option value="max">全部測驗（100% 完整涵蓋）</option>
            <option value="10">10 題速刷</option>
            <option value="20">20 題練功</option>
          </select>
        </div>
      </div>

      <div class="pt-4 flex justify-end space-x-2">
        <button onclick="closeQuizSetupModal()" class="px-4 py-2 text-slate-500 font-bold text-sm">取消</button>
        <button onclick="startQuizWithSetup()" class="px-5 py-2.5 bg-emerald-600 text-white rounded-xl font-black text-sm shadow hover:bg-emerald-700">開始測驗</button>
      </div>
    </div>
  </div>

  <!-- 語詞清單 Modal -->
  <div id="list-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex justify-center items-end sm:items-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md max-h-[85vh] rounded-t-3xl sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 bg-amber-600 text-white flex justify-between items-center">
        <h3 class="font-black text-base flex items-center gap-2">
          <i class="fa-solid fa-list"></i> 字詞總覽與星號管理
        </h3>
        <button onclick="toggleListView()" class="text-white hover:text-amber-200 text-xl px-2">✕</button>
      </div>
      <div id="word-list-container" class="p-4 overflow-y-auto divide-y divide-slate-100 flex-1"></div>
    </div>
  </div>

  <!-- 新增語詞 Modal -->
  <div id="add-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-black text-slate-800 text-lg">新增補充內容</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-slate-600 font-bold mb-1">所屬課別 *</label>
          <select id="new-lesson-code" class="w-full border border-slate-300 rounded-xl p-2.5 font-bold outline-none">
            <option value="L1">第 1 課</option><option value="L2">第 2 課</option><option value="L3">第 3 課</option><option value="L4">第 4 課</option><option value="L5">第 5 課</option><option value="L6">第 6 課</option><option value="L7">第 7 課</option><option value="L8">第 8 課</option><option value="L9">第 9 課</option><option value="L10">第 10 課</option><option value="L11">第 11 課</option><option value="L12">第 12 課</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-600 font-bold mb-1">類型 *</label>
          <select id="new-type-code" class="w-full border border-slate-300 rounded-xl p-2.5 font-bold outline-none">
            <option value="生字">生字與語詞</option>
            <option value="句型練習">造句與句型</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-600 font-bold mb-1">標題文字 (生字 / 句型) *</label>
          <input type="text" id="new-word" placeholder="例如：雖然...可是..." class="w-full border border-slate-300 rounded-xl p-2.5 outline-none font-bold">
        </div>
        <div>
          <label class="block text-slate-600 font-bold mb-1">注音 / 部首 (選填)</label>
          <input type="text" id="new-pinyin" placeholder="例如：ㄖㄠˊ (食部)" class="w-full border border-slate-300 rounded-xl p-2.5 outline-none">
        </div>
        <div>
          <label class="block text-slate-600 font-bold mb-1">解釋與例句 *</label>
          <textarea id="new-meaning" rows="3" placeholder="請將解釋與相關語詞或例句寫在這裡..." class="w-full border border-slate-300 rounded-xl p-2.5 outline-none"></textarea>
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeAddModal()" class="px-4 py-2 text-slate-500 font-bold">取消</button>
        <button onclick="saveNewWord()" class="px-5 py-2 bg-amber-600 text-white rounded-xl font-black">儲存</button>
      </div>
    </div>
  </div>

  <!-- 備份與管理 Modal -->
  <div id="backup-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-black text-slate-800 text-lg">資料備份與復原</h3>
        <button onclick="closeBackupModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>
      <p class="text-xs text-slate-500 leading-relaxed font-semibold">
        您可以匯出孩子的星號標記與學習紀錄，也可以在其他設備匯入資料！
      </p>
      <div class="space-y-2">
        <button onclick="exportData()" class="w-full py-3 bg-amber-50 hover:bg-amber-100 text-amber-900 rounded-2xl font-black border border-amber-200 flex justify-center items-center gap-2 text-sm">
          <i class="fa-solid fa-download text-amber-600"></i> 下載備份 JSON 檔
        </button>
        <label class="w-full py-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 rounded-2xl font-black border border-emerald-200 flex justify-center items-center gap-2 text-sm cursor-pointer">
          <i class="fa-solid fa-upload text-emerald-600"></i> 匯入 JSON 備份檔
          <input type="file" accept=".json" onchange="importData(event)" class="hidden">
        </label>
        <button onclick="resetDefaultData()" class="w-full py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-2xl font-bold border border-rose-200 flex justify-center items-center gap-2 text-xs">
          <i class="fa-solid fa-rotate-left"></i> 重置為「康軒五上預設資料庫」
        </button>
      </div>
      <div class="pt-2 text-right">
        <button onclick="closeBackupModal()" class="px-4 py-2 bg-slate-700 text-white rounded-xl font-bold text-xs">關閉</button>
      </div>
    </div>
  </div>

  <script>
    // 整合版資料庫
    const rawData = `===L1===
蚊|ㄨㄣˊ|虫部|昆蟲名,吸食血液或植物汁液。|例句(蚊子)|例句(蚊帳)
帳|ㄓㄤˋ|巾部|用布或紗等做成的遮蔽物。|例句(蚊帳)|例句(帳篷)
洲|ㄓㄡ|水部|地球表面被分隔開的大片陸地。|例句(亞洲)|例句(非洲)
瘧|ㄋㄩㄝˋ|疒部|一種由瘧原蟲引起的急性傳染病。|例句(瘧疾)|例句(瘧蚊)
疾|ㄐㄧˊ|疒部|病、身體不適,或指快速。|例句(疾病)|例句(疾走)
死|ㄙˇ|歹部|生命結束。與「生」相對。|例句(死亡)|例句(死板)

    let defaultWords = [];
    
    function parseRawData() {
      const lines = rawData.split('\n');
      let currentL = "L1";
      let currentId = 1;
      
      for (let line of lines) {
        line = line.trim();
        if (!line) continue;
        
        if (line.startsWith('===')) {
          currentL = line.replace(/=/g, '').trim();
          continue;
        }
        
        const parts = line.split('|');
        if (parts.length === 6) {
          const [char, pinyin, bushou, charMeaning, word1Str, word2Str] = parts;
          
          const regex = /([^(（]+)[(（]([^)）]+)[)）]/;
          let v1 = null, v2 = null;
          
          const m1 = word1Str.match(regex);
          if (m1) v1 = { w: m1[1].trim(), m: m1[2].trim() };
          else if (word1Str.trim()) v1 = { w: word1Str.trim(), m: "無解釋" };
          
          const m2 = word2Str.match(regex);
          if (m2) v2 = { w: m2[1].trim(), m: m2[2].trim() };
          else if (word2Str.trim()) v2 = { w: word2Str.trim(), m: "無解釋" };
          
          let typeStr = "生字";
          if(bushou.includes('練習')) typeStr = bushou;

          defaultWords.push({
            id: currentId++, lesson: currentL, type: typeStr, 
            word: char, pinyin: pinyin, info: bushou, 
            meaning: charMeaning, v1: v1, v2: v2, starred: false
          });
        }
      }
    }
    
    parseRawData();

    // 全域變數供測驗精準訂正使用
    let currentQType = '';
    let currentQuizCorrectText = '';
    let quizQuestions = [];
    let currentQuizIndex = 0;
    let quizScore = 0;

    // 音效引擎
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'click') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
          gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'flip') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(350, now); osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'correct') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.08); 
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now); osc.frequency.setValueAtTime(140, now + 0.1);
          gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    // 真人語音
    function playPronunciation(e, side) {
      if (e) e.stopPropagation();
      if (!soundEnabled) {
          if (e) alert("請先點擊右上角的 🔊 音量圖示開啟音效喔！");
          return;
      }
      if (filteredWords.length === 0) return;
      const item = filteredWords[currentIndex];
      
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let textToRead = item.word;
        if (side === 'back') {
          if (item.info && item.info.includes('練習')) {
             textToRead += "。意思是：" + item.meaning;
             if (item.v1 && item.v1.w !== '無') textToRead += "。例句：" + item.v1.m;
             if (item.v2 && item.v2.w !== '無') textToRead += "。例句：" + item.v2.m;
          } else {
             if (item.info && item.info.includes('部')) textToRead += "。部首是：" + item.info;
             textToRead += "。字義解釋：" + item.meaning;
             if (item.v1 && item.v1.w !== '無') textToRead += "。造詞：" + item.v1.w + "，" + item.v1.m;
             if (item.v2 && item.v2.w !== '無') textToRead += "。造詞：" + item.v2.w + "，" + item.v2.m;
          }
        }
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'zh-TW';
        utterance.rate = 0.85; 
        window.speechSynthesis.speak(utterance);
      } else {
        if (e) alert("您的瀏覽器目前不支援語音朗讀喔！");
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const soundIcon = document.getElementById('sound-icon');
      if (soundEnabled) {
        soundIcon.className = "fa-solid fa-volume-high text-sm"; 
        playSound('click');
      } else {
        soundIcon.className = "fa-solid fa-volume-xmark text-sm text-slate-400";
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function init() {
      // 為確保完全無暫存干擾，再次換一把全新金鑰
      const localData = localStorage.getItem('kangxuan_g5a_v3');
      if (localData) {
        try { words = JSON.parse(localData); } catch (e) { words = [...defaultWords]; }
      } else { words = [...defaultWords]; }
      updateCounts();
      setFilter('vocab'); 
    }

    function saveData() {
      localStorage.setItem('kangxuan_g5a_v3', JSON.stringify(words));
      updateCounts();
    }

    function changeLesson() {
      playSound('click');
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      currentLesson = document.getElementById('lesson-select').value;
      currentIndex = 0; 
      updateCounts();
      updateView();
    }

    function updateCounts() {
      const lessonWords = words.filter(w => w.lesson === currentLesson);
      const vocabCount = lessonWords.filter(w => !w.info || !w.info.includes('練習')).length;
      const sentenceCount = lessonWords.filter(w => w.info && w.info.includes('練習')).length;
      const starCount = lessonWords.filter(w => w.starred).length;

      document.getElementById('count-vocab').innerText = vocabCount;
      document.getElementById('count-sentence').innerText = sentenceCount;
      document.getElementById('count-star').innerText = starCount;
    }

    function setFilter(filter) {
      playSound('click');
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      currentFilter = filter;
      document.getElementById('flashcard-view').classList.remove('hidden');
      document.getElementById('quiz-view').classList.add('hidden');
      document.getElementById('quiz-view').classList.remove('flex');

      const tabs = ['vocab', 'sentence', 'star', 'quiz'];
      tabs.forEach(t => {
        const el = document.getElementById('tab-' + t);
        if(t === filter) {
          el.className = "py-2 rounded-lg transition-all text-center bg-white text-amber-800 shadow-sm font-black flex justify-center items-center gap-0.5";
        } else {
          el.className = "py-2 rounded-lg transition-all text-center text-slate-700 hover:text-amber-800 flex justify-center items-center gap-0.5 font-bold bg-transparent shadow-none";
        }
      });

      currentIndex = 0; 
      updateView();
    }

    function updateView() {
      const lessonWords = words.filter(w => w.lesson === currentLesson);
      
      if (currentFilter === 'star') {
        filteredWords = lessonWords.filter(w => w.starred);
      } else if (currentFilter === 'sentence') {
        filteredWords = lessonWords.filter(w => w.info && w.info.includes('練習'));
      } else { 
        filteredWords = lessonWords.filter(w => !w.info || !w.info.includes('練習'));
      }

      if (filteredWords.length === 0) {
        document.getElementById('card-word').innerText = "尚無資料";
        document.getElementById('card-pinyin-front').innerText = "";
        document.getElementById('card-word-back').innerText = "";
        document.getElementById('card-pinyin-back').innerText = "";
        document.getElementById('card-meaning-container').innerHTML = `<div class="text-center mt-6">目前分類沒有內容喔！請切換其他標籤。</div>`;
        document.getElementById('card-index-tag').innerText = "0 / 0";
        document.getElementById('star-icon').className = "fa-solid fa-star text-slate-200";
        document.getElementById('star-icon-back').className = "fa-solid fa-star text-slate-200";
        return;
      }

      if (currentIndex >= filteredWords.length) currentIndex = 0;
      const item = filteredWords[currentIndex];
      
      const wordEl = document.getElementById('card-word');
      if (item.word.length > 5) {
        wordEl.className = "text-3xl sm:text-4xl font-black text-slate-800 tracking-wider leading-snug";
      } else {
        wordEl.className = "text-6xl font-black text-slate-800 tracking-wider leading-snug";
      }

      wordEl.innerText = item.word;
      document.getElementById('card-pinyin-front').innerText = item.pinyin || "";
      document.getElementById('card-type-tag').innerText = item.info && item.info.includes('練習') ? item.info : "生字學習";
      document.getElementById('card-index-tag').innerText = `${currentIndex + 1} / ${filteredWords.length}`;
      
      const starClass = item.starred ? "fa-solid fa-star text-amber-400" : "fa-regular fa-star text-slate-300";
      document.getElementById('star-icon').className = starClass;
      document.getElementById('star-icon-back').className = item.starred ? "fa-solid fa-star text-amber-300" : "fa-regular fa-star text-amber-300/60";

      document.getElementById('card-word-back').innerText = item.word;
      
      if (item.info && item.info.includes('練習')) {
        document.getElementById('card-pinyin-back').innerText = ""; 
      } else {
        document.getElementById('card-pinyin-back').innerText = `${item.pinyin || ""} ${item.info ? '('+item.info+')' : ''}`;
      }
      
      let backHtml = `
        <div class="mb-2 text-amber-100 font-bold border-b border-amber-700/50 pb-2 text-base leading-relaxed">
          <span class="bg-amber-800 text-yellow-200 px-2 py-0.5 rounded text-xs mr-1">${item.info && item.info.includes('練習') ? '說明' : '字義'}</span>${item.meaning}
        </div>
        <div class="space-y-2 mt-3 text-sm">
          ${item.v1 && item.v1.w !== '無' ? `<div class="bg-amber-950/40 p-2.5 rounded-xl border border-amber-800/50 leading-relaxed"><span class="text-yellow-300 font-black text-sm mr-1">${item.v1.w}</span>${item.v1.m}</div>` : ''}
          ${item.v2 && item.v2.w !== '無' ? `<div class="bg-amber-950/40 p-2.5 rounded-xl border border-amber-800/50 leading-relaxed"><span class="text-yellow-300 font-black text-sm mr-1">${item.v2.w}</span>${item.v2.m}</div>` : ''}
        </div>
      `;
      document.getElementById('card-meaning-container').innerHTML = backHtml;

      if (isFlipped) {
        isFlipped = false;
        document.getElementById('card-inner').classList.remove('is-flipped');
      }
    }

    function flipCard() {
      if (filteredWords.length === 0) return;
      playSound('flip');
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      isFlipped = !isFlipped;
      document.getElementById('card-inner').classList.toggle('is-flipped', isFlipped);
      if (isFlipped && soundEnabled) playPronunciation(null, 'back');
    }

    function nextCard() {
      if (filteredWords.length === 0) return;
      playSound('click');
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      currentIndex = (currentIndex + 1) % filteredWords.length; updateView();
    }

    function prevCard() {
      if (filteredWords.length === 0) return;
      playSound('click');
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      currentIndex = (currentIndex - 1 + filteredWords.length) % filteredWords.length; updateView();
    }

    function toggleStar(e) {
      e.stopPropagation();
      if (filteredWords.length === 0) return;
      playSound('click');
      const currentItem = filteredWords[currentIndex];
      const targetInMain = words.find(w => w.id === currentItem.id);
      if (targetInMain) { targetInMain.starred = !targetInMain.starred; saveData(); updateView(); }
    }

    function openQuizSetupModal() {
      playSound('click'); 
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      document.getElementById('quiz-setup-modal').classList.remove('hidden');
    }
    function closeQuizSetupModal() { playSound('click'); document.getElementById('quiz-setup-modal').classList.add('hidden'); }

    function startQuizWithSetup() {
      playSound('click');
      const source = document.getElementById('quiz-source-select').value;
      const countOpt = document.getElementById('quiz-count-select').value;
      const lessonWords = words.filter(w => w.lesson === currentLesson);
      
      let pool = lessonWords;
      if (source === 'vocab') pool = lessonWords.filter(w => !w.info || !w.info.includes('練習'));
      else if (source === 'sentence') pool = lessonWords.filter(w => w.info && w.info.includes('練習'));
      else if (source === 'star') pool = lessonWords.filter(w => w.starred);

      if (pool.length < 3) {
        alert('此範圍題目少於 3 題，請切換其他課別或記下星號後再測驗！');
        return;
      }

      let totalQuestions = pool.length;
      if (countOpt !== 'max') totalQuestions = Math.min(parseInt(countOpt), pool.length);

      closeQuizSetupModal();
      document.getElementById('flashcard-view').classList.add('hidden');
      const quizView = document.getElementById('quiz-view');
      quizView.classList.remove('hidden'); quizView.classList.add('flex');
      
      const tabs = ['vocab', 'sentence', 'star', 'quiz'];
      tabs.forEach(t => {
        const el = document.getElementById('tab-' + t);
        if(t === 'quiz') el.className = "py-2 rounded-lg transition-all text-center bg-white text-emerald-800 shadow-sm font-black flex justify-center items-center gap-0.5";
        else el.className = "py-2 rounded-lg transition-all text-center text-slate-700 hover:text-amber-800 flex justify-center items-center gap-0.5 font-bold bg-transparent shadow-none";
      });

      document.getElementById('quiz-body').classList.remove('hidden');
      document.getElementById('quiz-result').classList.add('hidden');
      document.getElementById('quiz-footer').classList.remove('hidden');

      quizQuestions = [...pool].sort(() => 0.5 - Math.random()).slice(0, totalQuestions);
      currentQuizIndex = 0; quizScore = 0; wrongWords = [];
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      document.getElementById('quiz-feedback').innerText = '';
      document.getElementById('quiz-next-btn').classList.add('hidden');
      const q = quizQuestions[currentQuizIndex];
      document.getElementById('quiz-progress').innerText = `${currentQuizIndex + 1} / ${quizQuestions.length}`;

      // 決定題型
      let availableTypes = ['meaning', 'reverse'];
      if (q.type === '生字' && q.info && q.info.includes('部')) availableTypes.push('radical');
      currentQType = availableTypes[Math.floor(Math.random() * availableTypes.length)];

      let distractors = [];
      
      if (currentQType === 'radical') {
        // 保證「部首選項」絕對不會重複
        let pool = words.filter(w => w.id !== q.id && w.type === '生字' && w.info && w.info.includes('部') && w.info !== q.info);
        let uniqueSet = new Set([q.info]);
        let uniquePool = [];
        for(let w of pool.sort(() => 0.5 - Math.random())) {
          if(!uniqueSet.has(w.info)) {
            uniqueSet.add(w.info);
            uniquePool.push(w);
          }
        }
        distractors = uniquePool.slice(0, 3);
        if (distractors.length < 3) {
            const backups = ["水部", "木部", "人部", "手部", "口部", "心部", "金部", "糸部", "艸部", "火部", "言部", "辵部"].filter(r => !uniqueSet.has(r));
            while (distractors.length < 3 && backups.length > 0) {
                const r = backups.pop();
                uniqueSet.add(r);
                distractors.push({ id: -Math.random(), info: r });
            }
        }
        currentQuizCorrectText = q.info;
      } else if (currentQType === 'meaning') {
        let pool = words.filter(w => w.id !== q.id && w.type === q.type && w.meaning !== q.meaning);
        if(pool.length < 3) pool = words.filter(w => w.id !== q.id && w.meaning !== q.meaning);
        let uniqueSet = new Set([q.meaning]);
        let uniquePool = [];
        for(let w of pool.sort(() => 0.5 - Math.random())) {
          if(!uniqueSet.has(w.meaning)) {
            uniqueSet.add(w.meaning);
            uniquePool.push(w);
          }
        }
        distractors = uniquePool.slice(0, 3);
        currentQuizCorrectText = q.meaning;
      } else { 
        let pool = words.filter(w => w.id !== q.id && w.type === q.type && w.word !== q.word);
        if(pool.length < 3) pool = words.filter(w => w.id !== q.id && w.word !== q.word);
        let uniqueSet = new Set([q.word]);
        let uniquePool = [];
        for(let w of pool.sort(() => 0.5 - Math.random())) {
          if(!uniqueSet.has(w.word)) {
            uniqueSet.add(w.word);
            uniquePool.push(w);
          }
        }
        distractors = uniquePool.slice(0, 3);
        currentQuizCorrectText = q.word;
      }

      let options = [q, ...distractors].sort(() => 0.5 - Math.random());

      let questionText = "";
      let subtitleText = "選擇正確答案";
      let optionsHtml = "";

      if (currentQType === 'meaning') {
        subtitleText = q.info && q.info.includes('練習') ? "📖 句型/短語測驗" : "📖 字義測驗";
        questionText = `「${q.word}」的意思是？`;
        optionsHtml = options.map((opt, i) => `
          <button data-id="${opt.id}" onclick="checkAnswer(${opt.id}, ${q.id}, this)" class="option-btn w-full text-left p-4 rounded-2xl border-2 border-slate-200 hover:border-amber-400 font-extrabold text-slate-700 text-sm sm:text-base transition-all flex items-center justify-between shadow-sm active:scale-95">
            <span class="leading-relaxed">${String.fromCharCode(65 + i)}. ${opt.meaning}</span>
          </button>
        `).join('');
      } else if (currentQType === 'reverse') {
        subtitleText = "🔍 反向測驗";
        questionText = `解釋為「${q.meaning}」的是哪一個？`;
        optionsHtml = options.map((opt, i) => `
          <button data-id="${opt.id}" onclick="checkAnswer(${opt.id}, ${q.id}, this)" class="option-btn w-full text-left p-4 rounded-2xl border-2 border-slate-200 hover:border-amber-400 font-extrabold text-slate-700 text-lg transition-all flex items-center justify-between shadow-sm active:scale-95">
            <span class="leading-relaxed">${String.fromCharCode(65 + i)}. ${opt.word}</span>
          </button>
        `).join('');
      } else if (currentQType === 'radical') {
        subtitleText = "✍️ 部首測驗";
        questionText = `生字「${q.word}」的部首是？`;
        optionsHtml = options.map((opt, i) => `
          <button data-id="${opt.id}" onclick="checkAnswer(${opt.id}, ${q.id}, this)" class="option-btn w-full text-left p-4 rounded-2xl border-2 border-slate-200 hover:border-amber-400 font-extrabold text-slate-700 text-lg transition-all flex items-center justify-between shadow-sm active:scale-95">
            <span class="leading-relaxed">${String.fromCharCode(65 + i)}. ${opt.info}</span>
          </button>
        `).join('');
      }

      document.getElementById('quiz-subtitle').innerText = subtitleText;
      
      const qEl = document.getElementById('quiz-question');
      if(questionText.length > 20) qEl.className = "text-xl sm:text-2xl font-black text-slate-800 tracking-wide leading-snug";
      else qEl.className = "text-2xl sm:text-3xl font-black text-slate-800 tracking-wide leading-snug";
      qEl.innerHTML = questionText;
      
      document.getElementById('quiz-options').innerHTML = optionsHtml;
    }

    function checkAnswer(selectedId, correctId, btnElement) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.onclick = null);
      const q = quizQuestions[currentQuizIndex];
      const feedback = document.getElementById('quiz-feedback');

      if (selectedId === correctId) {
        playSound('correct');
        btnElement.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-800');
        feedback.className = "text-center py-2 text-emerald-600 font-black text-base";
        feedback.innerHTML = '<i class="fa-solid fa-circle-check"></i> 太棒了！答對了！🌟';
        quizScore++;
      } else {
        playSound('wrong');
        btnElement.classList.remove('border-slate-200', 'hover:border-amber-400');
        btnElement.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-800');
        
        const correctBtn = Array.from(allBtns).find(b => parseFloat(b.dataset.id) === parseFloat(correctId));
        if(correctBtn) {
            correctBtn.classList.remove('border-slate-200', 'hover:border-amber-400');
            correctBtn.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-800');
        }

        let explainText = "";
        if (currentQType === 'radical') {
            explainText = `「${q.word}」的部首是：<span class="text-rose-800 ml-1 font-extrabold">${q.info}</span>`;
        } else if (currentQType === 'reverse') {
            explainText = `這個解釋的字詞是：<span class="text-rose-800 ml-1 font-extrabold">${q.word}</span>`;
        } else {
            explainText = `「${q.word}」的意思是：<br><span class="text-rose-800 mt-1 block text-left font-extrabold">${q.meaning}</span>`;
        }

        feedback.className = "text-center py-2 text-rose-600 font-bold text-sm sm:text-base";
        feedback.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> 答錯囉！${explainText}`;
        wrongWords.push({ wordObj: q, qType: currentQType });
      }
      document.getElementById('quiz-next-btn').classList.remove('hidden');
    }

    function nextQuizQuestion() {
      playSound('click');
      currentQuizIndex++;
      if (currentQuizIndex < quizQuestions.length) renderQuizQuestion();
      else showQuizResults();
    }

    function showQuizResults() {
      document.getElementById('quiz-body').classList.add('hidden');
      document.getElementById('quiz-footer').classList.add('hidden');
      document.getElementById('quiz-result').classList.remove('hidden');
      const scorePercent = Math.round((quizScore / quizQuestions.length) * 100);
      document.getElementById('quiz-score-num').innerText = `${scorePercent} 分`;
      document.getElementById('quiz-score-detail').innerText = `答對 ${quizScore} / ${quizQuestions.length} 題`;

      const wrongSummary = document.getElementById('wrong-summary');
      const wrongList = document.getElementById('wrong-list');
      const addWrongBtn = document.getElementById('btn-add-wrong-stars');

      if (wrongWords.length > 0) {
        wrongSummary.classList.remove('hidden'); addWrongBtn.classList.remove('hidden');
        
        const uniqueWrongsMap = new Map();
        wrongWords.forEach(w => uniqueWrongsMap.set(w.wordObj.id + '_' + w.qType, w));
        
        wrongList.innerHTML = Array.from(uniqueWrongsMap.values()).map(w => {
          const obj = w.wordObj;
          if (w.qType === 'radical') {
            return `<li><strong>${obj.word}</strong> 的部首是：<span class="text-rose-600">${obj.info}</span></li>`;
          } else if (w.qType === 'reverse') {
            return `<li>解釋為「${obj.meaning}」的是：<span class="text-rose-600">${obj.word}</span></li>`;
          } else {
            return `<li><strong>${obj.word}</strong> 的意思是：<span class="text-rose-600">${obj.meaning}</span></li>`;
          }
        }).join('');
      } else {
        wrongSummary.classList.add('hidden'); addWrongBtn.classList.add('hidden');
      }
    }

    function addWrongToStars() {
      playSound('click');
      wrongWords.forEach(w => {
        const target = words.find(item => item.id === w.wordObj.id);
        if (target) target.starred = true;
      });
      saveData();
      alert(`已將 ${wrongWords.length} 題錯題自動標記至「星號加強」！`);
      document.getElementById('btn-add-wrong-stars').classList.add('hidden');
      updateCounts();
    }

    function toggleListView() {
      playSound('click');
      const modal = document.getElementById('list-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) renderWordList();
    }

    function renderWordList() {
      const container = document.getElementById('word-list-container');
      const lessonWords = words.filter(w => w.lesson === currentLesson);
      container.innerHTML = lessonWords.map((w) => `
        <div class="py-3 flex justify-between items-start gap-2">
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="font-extrabold text-slate-800 text-lg">${w.word}</span>
              <span class="text-[10px] font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">${w.info && w.info.includes('練習') ? w.info : w.pinyin}</span>
            </div>
            <p class="text-xs text-slate-500 mt-1.5 leading-relaxed font-bold">${w.meaning}</p>
          </div>
          <button onclick="toggleStarById(${w.id})" class="text-2xl p-1 text-slate-300 hover:text-amber-400">
            <i class="${w.starred ? 'fa-solid fa-star text-amber-400' : 'fa-regular fa-star'}"></i>
          </button>
        </div>
      `).join('');

    function toggleStarById(id) {
      playSound('click');
      const item = words.find(w => w.id === id);
      if (item) {
        item.starred = !item.starred;
        saveData(); renderWordList(); updateView();
      }
    }

    function openAddModal() { playSound('click'); document.getElementById('add-modal').classList.remove('hidden'); }
    function closeAddModal() {
      playSound('click'); document.getElementById('add-modal').classList.add('hidden');
      document.getElementById('new-word').value = ''; document.getElementById('new-pinyin').value = ''; document.getElementById('new-meaning').value = '';
    }

    function saveNewWord() {
      playSound('click');
      const lesson = document.getElementById('new-lesson-code').value || "L1";
      const typeCode = document.getElementById('new-type-code').value;
      const word = document.getElementById('new-word').value.trim();
      const pinyin = document.getElementById('new-pinyin').value.trim();
      const meaning = document.getElementById('new-meaning').value.trim();
      if (!word || !meaning) { alert('請完整輸入字詞與解釋！'); return; }
      
      const newId = words.length > 0 ? Math.max(...words.map(w => w.id)) + 1 : 1;
      let infoStr = typeCode === "生字" ? "補充生字" : "句型練習";
      
      words.push({ id: newId, lesson, type: typeCode, word, pinyin, info: infoStr, meaning, v1: null, v2: null, starred: true });
      currentLesson = lesson; document.getElementById('lesson-select').value = lesson;
      saveData(); closeAddModal(); 
      setFilter(typeCode === "生字" ? 'vocab' : 'sentence');
      alert(`已成功將內容新增至學習庫！`);
    }

    function openBackupModal() { playSound('click'); document.getElementById('backup-modal').classList.remove('hidden'); }
    function closeBackupModal() { playSound('click'); document.getElementById('backup-modal').classList.add('hidden'); }

    function exportData() {
      playSound('click');
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(words, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `康軒五上學習備份_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click(); downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            words = imported; saveData(); updateView(); closeBackupModal(); alert('成功匯入學習紀錄與字詞！');
          } else { alert('格式不符，請上傳正確的 JSON 備份檔。'); }
        } catch (err) { alert('解析檔案失敗，請確認檔案格式是否正確。'); }
      };
      reader.readAsText(file);
    }

    function resetDefaultData() {
      playSound('click');
      if (confirm('確定要將資料庫重置為「康軒五上預設資料庫」嗎？\n(注意：舊有的星號與新增字詞將會被重置)')) {
        words = [...defaultWords]; currentLesson = "L1"; document.getElementById('lesson-select').value = "L1";
        saveData(); setFilter('vocab'); closeBackupModal(); alert('已為您載入最新的1-12課完整資料庫！');
      }
    }

    let touchstartX = 0; let touchendX = 0;
    const cardEl = document.getElementById('card-container');
    cardEl.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, false);
    cardEl.addEventListener('touchend', e => { touchendX = e.changedTouches[0].screenX; handleSwipe(); }, false);
    function handleSwipe() { if (touchendX < touchstartX - 50) nextCard(); if (touchendX > touchstartX + 50) prevCard(); }

    window.onload = init;
  </script>
</body>
</html>
