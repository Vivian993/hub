<style>
  :root{
    --paper: #f3eedd;
    --paper-alt: #ece4cd;
    --ink: #2c2b26;
    --ink-soft: #5b564a;
    --red: #b4483a;
    --red-soft: #c97365;
    --blue: #7fa0b8;
    --blue-faint: rgba(127,160,184,0.35);
    --gold: #c2953f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(196,158,90,0.10), transparent 55%),
      var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:28px 18px 60px;
    user-select:none;
  }
  .wrap{ max-width:520px; margin:0 auto; }

  header{
    padding:0 2px 20px 18px;
    margin-bottom:22px;
    border-left:3px solid var(--red);
  }
  .eyebrow{
    font-family:'Ma Shan Zheng', cursive;
    font-size:19px;
    color:var(--red-soft);
    display:block;
    margin-bottom:2px;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:24px;
    margin:0 0 6px;
  }
  header p{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.7;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px 10px;
  }

  .tile-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    position:relative;
  }
  .tile{
    width:100%;
    aspect-ratio:1/1;
    border-radius:22%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(44,43,38,0.16), inset 0 0 0 1px rgba(255,255,255,0.25);
    transition:transform .12s ease;
    position:relative;
  }
  .tile:active{ transform:scale(0.92); }
  .tile.add{
    background:transparent;
    box-shadow:none;
    border:1.8px dashed var(--red-soft);
    color:var(--red);
    font-size:22px;
  }
  .label{
    font-size:11px;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:400;
    text-align:center;
    color:var(--ink);
    line-height:1.3;
    max-width:100%;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    white-space:normal;
  }
  .label.add-label{ color:var(--red); }

  .badge{
    position:absolute;
    top:-6px; left:-6px;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--red);
    color:#fdf9ef;
    font-size:13px;
    line-height:20px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    display:none;
    z-index:2;
  }
  .jiggling .badge{ display:block; }
  .jiggling .tile{ animation:jiggle .28s infinite; }
  @keyframes jiggle{
    0%{ transform:rotate(-1.3deg); }
    50%{ transform:rotate(1.3deg); }
    100%{ transform:rotate(-1.3deg); }
  }

  .hint{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:22px;
    opacity:0.75;
    line-height:1.7;
  }

  .done-bar{
    display:none;
    justify-content:flex-end;
    margin-bottom:12px;
  }
  .done-bar.show{ display:flex; }
  .done-btn{
    background:var(--red);
    color:#fdf9ef;
    border:none;
    padding:8px 16px;
    border-radius:20px;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:13px;
  }

  /* modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(44,43,38,0.42);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.open{ display:flex; }
  .sheet{
    width:100%;
    max-width:520px;
    background:var(--paper-alt);
    border-radius:18px 18px 0 0;
    padding:22px 20px 26px;
    box-shadow:0 -8px 30px rgba(0,0,0,0.2);
    animation:rise .22s ease;
  }
  @keyframes rise{ from{ transform:translateY(16px); opacity:0;} to{ transform:translateY(0); opacity:1; } }
  .sheet h2{
    font-family:'Noto Serif TC', serif;
    font-size:18px;
    margin:0 0 16px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:1.5px solid var(--blue-faint);
    background:#fbf8ef;
    font-size:14.5px;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
  }
  .field input:focus{ outline:none; border-color:var(--gold); }
  .emoji-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .emoji-opt{
    width:38px; height:38px;
    border-radius:10px;
    border:1.5px solid var(--blue-faint);
    background:#fbf8ef;
    font-size:19px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .emoji-opt.selected{ border-color:var(--gold); background:rgba(196,158,90,0.15); }
  .swatch-row{ display:flex; gap:8px; margin-top:8px; }
  .swatch{
    width:30px; height:30px; border-radius:50%;
    cursor:pointer; border:2px solid transparent;
  }
  .swatch.selected{ border-color:var(--ink); }

  .sheet-actions{ display:flex; gap:10px; margin-top:8px; }
  .btn{
    flex:1; padding:12px; border-radius:8px; border:none;
    font-family:'Noto Sans TC', sans-serif; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .btn.cancel{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--blue-faint); }
  .btn.save{ background:var(--red); color:#fdf9ef; }
  .btn.delete{ background:transparent; color:var(--red); border:1.5px solid var(--red-soft); flex:0 0 auto; padding:12px 16px; }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">自己的小工具・自己排</span>
      <h1>我的學習角</h1>
      <p>把常用的網頁工具集中在這裡。長按任一圖示可以改圖示、改名字、改連結；輕點就直接開啟。</p>
    </header>

    <div class="done-bar" id="doneBar"><button class="done-btn" id="doneBtn">完成</button></div>

    <div class="grid" id="grid"></div>

    <div class="hint">輕點圖示＝開啟連結　・　長按圖示＝編輯這個 App　・　點「＋」新增</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2 id="sheetTitle">新增項目</h2>
      <div class="field">
        <label>選一個圖示</label>
        <div class="emoji-row" id="emojiRow"></div>
      </div>
      <div class="field">
        <label>顏色</label>
        <div class="swatch-row" id="swatchRow"></div>
      </div>
      <div class="field">
        <label for="fName">名稱</label>
        <input id="fName" placeholder="例如：國語字典聽寫簿學習系統">
      </div>
      <div class="field">
        <label for="fUrl">網址連結</label>
        <input id="fUrl" placeholder="https://...">
      </div>
      <div class="sheet-actions">
        <button class="btn delete" id="deleteBtn" style="display:none;">刪除</button>
        <button class="btn cancel" id="cancelBtn">取消</button>
        <button class="btn save" id="saveBtn">儲存</button>
      </div>
    </div>
  </div>

<script>
const STORAGE_KEY = 'learning-corner-icons';
const EMOJI_CHOICES = ['📖','⭐','🏃','💒','✍️','🔗','🀄','🧮','📚','🎯','🎨','🧩','📝','🔤','🕰️','📌'];
const COLOR_CHOICES = ['#b4483a','#c2953f','#7fa0b8','#6e8f6a','#a3688f','#5b564a'];

const GH_USER = 'Vivian993';
const GH_REPO = 'hub';
const ghUrl = (folder) => `https://${GH_USER}.github.io/${GH_REPO}/${folder}/`;

const defaultItems = [
  { id:'d1', emoji:'📖', color:COLOR_CHOICES[0], name:'全能國語線上字典聽寫系統', url: ghUrl('ryan-libra') },
  { id:'d2', emoji:'🤖', color:COLOR_CHOICES[1], name:'AI家庭幫手', url: ghUrl('family-assistant') },
  { id:'d3', emoji:'💒', color:COLOR_CHOICES[2], name:'日常小管家', url: ghUrl('note-assistant') },
  { id:'d4', emoji:'✍️', color:COLOR_CHOICES[3], name:'魔法寫作業', url: ghUrl('note-book') },
  { id:'d5', emoji:'🌱', color:COLOR_CHOICES[4], name:'小樹苗成語故事典故', url: ghUrl('idiom-dictionary') },
  { id:'d6', emoji:'🏃', color:COLOR_CHOICES[5], name:'數學跑酷 Math Parkour', url: ghUrl('math-game') },
  { id:'d7', emoji:'🔗', color:COLOR_CHOICES[0], name:'我的捷徑', url: ghUrl('quicklinks') },
];

let items = [];
let editingId = null;
let selectedEmoji = EMOJI_CHOICES[0];
let selectedColor = COLOR_CHOICES[0];
let jiggleMode = false;

const gridEl = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const doneBar = document.getElementById('doneBar');

async function loadItems(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    items = raw ? JSON.parse(raw) : defaultItems;
    if(!raw) saveItems();
  }catch(e){
    items = defaultItems;
  }
  render();
}

function saveItems(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }catch(e){}
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function render(){
  gridEl.innerHTML = '';
  gridEl.classList.toggle('jiggling', jiggleMode);
  doneBar.classList.toggle('show', jiggleMode);

  items.forEach(item => {
    const tw = document.createElement('div');
    tw.className = 'tile-wrap';
    tw.innerHTML = `
      <div class="tile" style="background:${item.color || COLOR_CHOICES[0]}; color:#fdf9ef;">
        ${escapeHtml(item.emoji || '📌')}
        <div class="badge" data-id="${item.id}">✕</div>
      </div>
      <div class="label">${escapeHtml(item.name || '未命名')}</div>
    `;
    const tile = tw.querySelector('.tile');
    attachPress(tile, item);
    tw.querySelector('.badge').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteItem(item.id);
    });
    gridEl.appendChild(tw);
  });

  const addWrap = document.createElement('div');
  addWrap.className = 'tile-wrap';
  addWrap.innerHTML = `
    <div class="tile add">＋</div>
    <div class="label add-label">新增</div>
  `;
  addWrap.querySelector('.tile').addEventListener('click', () => openSheet(null));
  gridEl.appendChild(addWrap);
}

function attachPress(el, item){
  let timer = null;
  let longPressed = false;
  const start = (e) => {
    longPressed = false;
    timer = setTimeout(() => {
      longPressed = true;
      if(navigator.vibrate) navigator.vibrate(12);
      jiggleMode = true;
      render();
    }, 480);
  };
  const cancel = () => { if(timer) clearTimeout(timer); };
  const end = (e) => {
    cancel();
    if(longPressed) return;
    if(jiggleMode){
      openSheet(item);
    } else if(item.url){
      window.open(item.url, '_blank', 'noopener');
    } else {
      openSheet(item);
    }
  };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointerleave', cancel);
  el.addEventListener('pointercancel', cancel);
  el.addEventListener('contextmenu', (e) => { e.preventDefault(); jiggleMode = true; render(); });
}

document.getElementById('doneBtn').addEventListener('click', () => {
  jiggleMode = false;
  render();
});

function buildEmojiRow(){
  const row = document.getElementById('emojiRow');
  row.innerHTML = '';
  EMOJI_CHOICES.forEach(em => {
    const b = document.createElement('div');
    b.className = 'emoji-opt' + (em === selectedEmoji ? ' selected' : '');
    b.textContent = em;
    b.addEventListener('click', () => { selectedEmoji = em; buildEmojiRow(); });
    row.appendChild(b);
  });
}
function buildSwatchRow(){
  const row = document.getElementById('swatchRow');
  row.innerHTML = '';
  COLOR_CHOICES.forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch' + (c === selectedColor ? ' selected' : '');
    s.style.background = c;
    s.addEventListener('click', () => { selectedColor = c; buildSwatchRow(); });
    row.appendChild(s);
  });
}

function openSheet(item){
  editingId = item ? item.id : null;
  document.getElementById('sheetTitle').textContent = item ? '編輯這個 App' : '新增項目';
  document.getElementById('fName').value = item ? item.name : '';
  document.getElementById('fUrl').value = item ? item.url : '';
  selectedEmoji = item ? (item.emoji || EMOJI_CHOICES[0]) : EMOJI_CHOICES[0];
  selectedColor = item ? (item.color || COLOR_CHOICES[0]) : COLOR_CHOICES[0];
  document.getElementById('deleteBtn').style.display = item ? 'block' : 'none';
  buildEmojiRow();
  buildSwatchRow();
  overlay.classList.add('open');
}

document.getElementById('cancelBtn').addEventListener('click', () => {
  overlay.classList.remove('open');
});
overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('open'); });

document.getElementById('saveBtn').addEventListener('click', async () => {
  const name = document.getElementById('fName').value.trim();
  if(!name){ document.getElementById('fName').focus(); return; }
  let url = document.getElementById('fUrl').value.trim();
  if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;

  if(editingId){
    const idx = items.findIndex(i => i.id === editingId);
    if(idx > -1){
      items[idx] = { ...items[idx], name, url, emoji:selectedEmoji, color:selectedColor };
    }
  } else {
    items.push({ id:'i'+Date.now(), name, url, emoji:selectedEmoji, color:selectedColor });
  }
  overlay.classList.remove('open');
  render();
  await saveItems();
});

document.getElementById('deleteBtn').addEventListener('click', async () => {
  if(editingId){
    items = items.filter(i => i.id !== editingId);
    overlay.classList.remove('open');
    render();
    await saveItems();
  }
});

async function deleteItem(id){
  items = items.filter(i => i.id !== id);
  render();
  await saveItems();
}

loadItems();
</script>
</body>
</html>
