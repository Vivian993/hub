<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Ryan Library</title>
<meta name="description" content="Ryan 的個人學習圖書館 — Knowledge grows every day." />

<!-- PWA / add-to-home-screen -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FBF6EC" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Ryan Library" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="favicon-32.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

<style>
  :root{
    --cream:#FBF6EC; --sage:#7E9A79; --sage-soft:#EAF0E6; --blue:#A7B8C6;
    --wood:#C79B6E; --text:#4A4038; --muted:#8A8074; --card:#FFFEF9;
    --tag:#EFEAE0; --rose:#C0796B;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--cream); color:var(--text);
    font-family:'Noto Sans TC',sans-serif; -webkit-font-smoothing:antialiased; overscroll-behavior-y: none; }
  .display{ font-family:'Klee One','Noto Sans TC',sans-serif; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; }
  ::-webkit-scrollbar{ display:none; }
  #app{ min-height:100vh; padding-bottom:40px; }

  .header{ background:linear-gradient(180deg,#E4EDE1,#FBF6EC); padding:22px 18px 18px; border-radius:0 0 32px 32px; }
  .header-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .header-left{ display:flex; gap:12px; align-items:center; }
  .app-title{ font-size:22px; font-weight:600; color:var(--text); }
  .app-sub{ font-size:11.5px; color:var(--sage); margin-top:2px; }
  .icon-btn{ width:36px; height:36px; border-radius:12px; border:none; background:var(--card);
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(74,64,56,.10); color:var(--text); flex-shrink:0; }
  .search-wrap{ margin-top:16px; position:relative; }
  .search-wrap svg{ position:absolute; left:14px; top:12px; }
  .search-input{ width:100%; border:none; border-radius:16px; padding:11px 38px 11px 38px; font-size:14px;
    background:var(--card); box-shadow:0 4px 14px rgba(74,64,56,.08); color:var(--text); }
  .search-clear{ position:absolute; right:8px; top:7px; background:var(--tag); border:none; border-radius:10px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; }

  .section{ margin-top:22px; }
  .section-title{ display:flex; align-items:center; gap:6px; padding:0 18px; margin-bottom:10px; font-size:16px; font-weight:600; }
  .hscroll{ display:flex; gap:12px; overflow-x:auto; padding:2px 18px 6px; scroll-snap-type:x proximity; }
  .hscroll > *{ scroll-snap-align:start; }

  .card{ background:var(--card); border-radius:20px; box-shadow:0 4px 16px rgba(74,64,56,.08); padding:14px;
    display:flex; gap:12px; position:relative; }
  .card.compact{ width:176px; height:296px; flex-shrink:0; flex-direction:column; }
  .card.full{ width:100%; flex-direction:row; }
  .cover{ border-radius:14px; overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .card.compact .cover{ width:100%; height:92px; }
  .card.full .cover{ width:64px; height:64px; }
  .card-body{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .card-title{ font-weight:700; font-size:14.5px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card.compact .card-title{ min-height:38px; }
  .fav-btn{ border:none; background:none; flex-shrink:0; padding:2px; }
  .card-desc{ font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card.compact .card-desc{ min-height:33px; }
  .card-tags{ display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap; min-height:22px; }
  .tag-type{ font-size:10.5px; background:var(--tag); color:var(--sage); padding:3px 8px; border-radius:999px; display:flex; align-items:center; gap:4px; font-weight:500; }
  .tag-cat{ font-size:10.5px; color:var(--blue); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .card-actions{ display:flex; gap:8px; margin-top:auto; padding-top:10px; }
  .btn-go{ background:var(--sage); color:var(--card); border:none; border-radius:10px; padding:6px 12px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px; }
  .btn-mini{ background:var(--tag); border:none; border-radius:10px; padding:6px 9px; color:var(--text); }
  .btn-mini.danger{ background:#F3E1DC; color:#B15A46; }

  .cat-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; padding:0 18px; }
  .cat-tile{ background:var(--card); border:none; border-radius:20px; height:128px; padding:16px 6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; box-shadow:0 4px 14px rgba(74,64,56,.07); }
  .cat-icon{ width:48px; height:48px; border-radius:16px; background:var(--sage-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .cat-name{ font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:center; display:block; }
  .cat-count{ font-size:10px; color:#A79D8F; white-space:nowrap; }

  .pill{ background:var(--tag); color:var(--text); border:none; border-radius:999px; padding:7px 16px; font-size:13px; font-weight:500; white-space:nowrap; flex-shrink:0; }
  .pill.active{ background:var(--sage); color:var(--card); }
  .pill-row{ display:flex; gap:8px; overflow-x:auto; margin-top:14px; padding-bottom:2px; }

  .cat-header{ background:linear-gradient(180deg,#E4EDE1,#FBF6EC); padding:18px 18px 16px; border-radius:0 0 28px 28px; }
  .cat-header-top{ display:flex; align-items:center; gap:10px; }
  .cat-header-icon{ width:40px; height:40px; border-radius:14px; background:var(--sage-soft); display:flex; align-items:center; justify-content:center; }
  .cat-header-title{ font-size:19px; font-weight:600; }

  .empty{ text-align:center; padding:40px 0; color:#A79D8F; }
  .empty div.msg{ font-size:13px; margin-top:10px; }

  .add-btn{ width:100%; background:var(--sage); color:var(--card); border:none; border-radius:16px; padding:14px; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .add-btn-outline{ width:100%; background:var(--tag); border:1px dashed #C9BFAF; border-radius:16px; padding:12px; font-size:13px; font-weight:600; color:var(--sage); display:flex; align-items:center; justify-content:center; gap:6px; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(74,64,56,.35); z-index:50; display:flex; align-items:flex-end; }
  .modal-overlay.center{ align-items:center; justify-content:center; }
  .sheet{ background:var(--card); width:100%; max-height:88vh; overflow-y:auto; border-radius:24px 24px 0 0; padding:18px 20px 28px; }
  .sheet-head{ display:flex; justify-content:space-between; align-items:center; }
  .sheet-title{ font-size:18px; font-weight:600; }
  .field-label{ font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:5px; margin-top:14px; display:block; }
  .field-input{ width:100%; border:1px solid var(--tag); border-radius:12px; padding:10px 12px; font-size:14px; background:var(--cream); color:var(--text); }
  textarea.field-input{ resize:vertical; }

  .swatch-row{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 6px; }
  .swatch{ width:48px; height:48px; border-radius:14px; flex-shrink:0; border:2px solid transparent; display:flex; align-items:center; justify-content:center; padding:0; }
  .swatch.selected{ border-color:var(--sage); }
  .swatch.clear{ background:var(--tag); color:var(--muted); }

  .save-btn{ margin-top:22px; width:100%; background:var(--sage); color:var(--card); border:none; border-radius:14px; padding:13px; font-size:15px; font-weight:700; }

  .pw-box{ background:var(--card); border-radius:22px; padding:24px; width:82%; max-width:320px; text-align:center; }
  .pw-input{ width:100%; margin-top:14px; border:1px solid var(--tag); border-radius:12px; padding:10px 12px; font-size:15px; text-align:center; background:var(--cream); }

  .subs-box{ background:var(--cream); border-radius:14px; padding:12px; margin-bottom:10px; }
  .sub-chip{ background:var(--tag); border-radius:999px; padding:4px 10px; font-size:11.5px; display:inline-flex; align-items:center; gap:4px; margin:0 6px 6px 0; }
  .sub-add{ background:none; border:1px dashed #C9BFAF; border-radius:999px; padding:4px 10px; font-size:11.5px; color:var(--muted); }
  .sub-add-input{ border:1px solid #C9BFAF; border-radius:999px; padding:3px 8px; font-size:11.5px; width:100px; }
</style>
</head>
<body>

function defaultData(){
  return { materials: SEED_MATERIALS, categories: DEFAULT_CATEGORIES, settings:{ adminPassword:"0000" } };
}
function migrateData(d){
  if(!d.categories) d.categories = DEFAULT_CATEGORIES;
  if(!d.settings) d.settings = { adminPassword:"0000" };
  d.categories.forEach((c,ci) => { if(c.order === undefined) c.order = ci; });
  d.materials = (d.materials||[]).map((m,i) => {
    if(!m.tags){ m.tags = m.sub ? [m.sub] : []; }
    if(m.order === undefined) m.order = i;
    return m;
  });
  return d;
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return migrateData(JSON.parse(raw));
  }catch(e){}
  return migrateData(defaultData());
}

function icon(name, size=16, color="currentColor", strokeWidth=1.8){
  const paths = ICON_PATHS[name] || ICON_PATHS.star;
  const filled = name === "heart" || name === "star";
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
}
function iconFilled(name, size, color){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]}</svg>`;
}

/* ---------------- helpers ---------------- */
function esc(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function typeInfo(key){ return TYPES.find(t => t.key === key) || TYPES[TYPES.length-1]; }
function catByKey(key){ return state.data.categories.find(c => c.key === key); }

function coverThumbHTML(cover, type, size){
  if(cover && cover.indexOf("preset:") === 0){
    const p = COVER_PRESETS.find(p => "preset:"+p.id === cover);
    if(p) return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,${p.colors[0]},${p.colors[1]})">${icon(p.icon, size, p.fg, 1.8)}</div>`;
  }
  if(cover){
    return `<div style="width:100%;height:100%;background:url('${esc(cover)}') center/cover"></div>`;
  }
  const t = typeInfo(type);
  return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EFEAE0,#DCE7D8);color:#7E9A79">${icon(t.icon, size, "#7E9A79", 1.8)}</div>`;
}

function materialCardHTML(m, compact, reorderInfo){
  const cat = catByKey(m.category);
  const t = typeInfo(m.type);
  const favIcon = m.favorite ? iconFilled("heart", 17, "#C0796B") : icon("heart", 17, "#C9BFAF");
  const tagsStr = (m.tags && m.tags.length) ? m.tags.join("、") : "";
  return `
  <div class="card ${compact ? "compact":"full"}">
    <div class="cover">${coverThumbHTML(m.cover, m.type, compact?30:24)}</div>
    <div class="card-body">
      <div class="card-top">
        <div class="card-title">${esc(m.title)}</div>
        <button class="fav-btn" onclick="RL.toggleFav('${m.id}')">${favIcon}</button>
      </div>
      <div class="card-desc">${esc(m.description || "")}</div>
      <div class="card-tags">
        <span class="tag-type">${icon(t.icon,11,"#7E9A79",1.8)} ${esc(t.label)}</span>
        ${cat ? `<span class="tag-cat">${esc(cat.name)}${tagsStr ? " · "+esc(tagsStr) : ""}</span>` : ""}
      </div>
      <div class="card-actions">
        <button class="btn-go" onclick="RL.openMaterial('${m.id}')">前往 ${icon("external",12,"#FFFDF8",2)}</button>

          <button class="btn-mini" onclick="RL.openEditor('${m.id}')">${icon("pencil",12,"#4A4038",1.8)}</button>
          <button class="btn-mini danger" onclick="RL.deleteMaterial('${m.id}')">${icon("trash",12,"#B15A46",1.8)}</button>

function sectionHTML(title, iconName, iconColor, items, compact=true){
  if(!items.length) return "";
  return `

  const { materials } = state.data;

/* ---------------- home-body-only refresh (keeps search input focused) ---------------- */
function refreshHomeBody(){
  const { materials } = state.data;
  const favorites = materials.filter(m=>m.favorite).sort((a,b)=>(a.order??0)-(b.order??0));
  const dayIndex = materials.length ? new Date().getDate() % materials.length : 0;
  const todayPick = materials.length ? [materials[dayIndex], ...materials.filter((_,i)=>i!==dayIndex)].slice(0,6) : [];
  const body = document.getElementById("home-body");
  if(body) body.innerHTML = renderHomeBody(favorites, todayPick);
  const clearBtnArea = document.querySelector(".search-wrap");
  if(clearBtnArea){
    const existing = clearBtnArea.querySelector(".search-clear");
    if(state.query && !existing){
      const btn = document.createElement("button");
      btn.className = "search-clear"; btn.onclick = RL.clearSearch;
      btn.innerHTML = icon("x",13,"#8A8074");
      clearBtnArea.appendChild(btn);
    } else if(!state.query && existing){ existing.remove(); }
  }
}

function guessType(url){
  const u = (url||"").toLowerCase();
  if(u.includes("youtube.com") || u.includes("youtu.be")) return "youtube";
  if(u.includes("drive.google.com")) return "gdrive";
  if(u.includes("docs.google.com/document")) return "gdoc";
  if(u.includes("docs.google.com/spreadsheets")) return "gsheet";
  if(u.includes("docs.google.com/presentation")) return "ppt";
  if(u.endsWith(".pdf")) return "pdf";
  if(u.endsWith(".doc") || u.endsWith(".docx")) return "word";
  if(u.endsWith(".xls") || u.endsWith(".xlsx")) return "excel";
  if(u.endsWith(".ppt") || u.endsWith(".pptx")) return "ppt";
  if(u.match(/\.(png|jpg|jpeg|gif|webp)$/)) return "image";
  if(u) return "website";
  return "other";
}
const CATEGORY_KEYWORDS = {
  chinese: ["國語","國文","注音","成語","生字","國字","作文","閱讀理解","字詞"],
  math: ["數學","計算","公式","加減","乘除","分數","算數","九九乘法"],
  english: ["英文","英語","單字","文法","字彙","發音","英聽","字根"],
  science: ["自然","科學","科普","實驗"],
  social: ["社會","歷史","地理","公民"],
};
function guessCategory(title){
  const t = (title||"");
  for(const key in CATEGORY_KEYWORDS){
    if(CATEGORY_KEYWORDS[key].some(k => t.includes(k))){
      if(catByKey(key)) return key;
    }
  }
  const channel = state.data.categories.find(c => c.key === "channel");
  return channel ? channel.key : (state.data.categories[0] ? state.data.categories[0].key : "");
}
function guessTag(title, cat){
  if(!cat) return "";
  const hit = cat.subs.find(s => title && title.includes(s));
  return hit || "";
}


function tagPickerHTML(cat, currentTags){
  if(!cat || !cat.subs.length) return `<div style="font-size:12px;color:var(--muted)">此分類尚無標籤，可在下方自訂新增</div>`;
  return cat.subs.map(s => {
    const active = currentTags.includes(s);
    return `<button type="button" class="pill ${active?'active':''}" style="flex-shrink:0" onclick="RL.toggleTag('${esc(s).replace(/'/g,"&#39;")}', this)">${esc(s)}</button>`;
  }).join("");
}

/* ================= RL controller ================= */
const RL = {
  onLockClick(){

  },
  submitPassword(){

    if(v === state.data.settings.adminPassword){ state.admin = true; closeModal(); render(); }
    else { document.getElementById("pw-error").style.display = "block"; }
  },
  closeModal(){ closeModal(); },

  onSearchInput(v){ state.query = v; refreshHomeBody(); },
  clearSearch(){ state.query = ""; render(); setTimeout(()=>document.getElementById("search-input")?.focus(),0); },

  openCategory(key){ state.view = {page:"category", key}; state.subFilter = ""; render(); window.scrollTo(0,0); },
  goHome(){ state.view = {page:"home"}; render(); window.scrollTo(0,0); },
  setSubFilter(s){ state.subFilter = s; render(); },

  toggleFav(id){
    const m = state.data.materials.find(m=>m.id===id);

  },
  openMaterial(id){
    const m = state.data.materials.find(m=>m.id===id);

    m.lastReadAt = Date.now(); saveData();
    window.open(m.url, "_blank", "noopener,noreferrer");

  },
  deleteMaterial(id){
    if(!confirm("確定要刪除這筆教材嗎？")) return;
    state.data.materials = state.data.materials.filter(m=>m.id!==id);
    saveData(); render();
  },

  openEditor(id, presetCategory, presetSub){
    const material = id ? state.data.materials.find(m=>m.id===id) : null;
    document.getElementById("modal-root").innerHTML = editorModalHTML(material, presetCategory, presetSub);
  },
  onCategoryChange(key){
    const cat = catByKey(key);
    document.getElementById("f-tags").value = "";
    document.getElementById("tag-picker").innerHTML = tagPickerHTML(cat, []);
  },
  toggleTag(tag, btnEl){
    const hidden = document.getElementById("f-tags");
    let tags = hidden.value ? hidden.value.split("|||") : [];
    if(tags.includes(tag)){ tags = tags.filter(t=>t!==tag); btnEl.classList.remove("active"); }
    else { tags.push(tag); btnEl.classList.add("active"); }
    hidden.value = tags.join("|||");
  },
  addCustomTag(){
    const input = document.getElementById("f-newtag");
    const v = input.value.trim();
    if(!v) return;
    const hidden = document.getElementById("f-tags");
    let tags = hidden.value ? hidden.value.split("|||") : [];
    if(!tags.includes(v)){
      tags.push(v);
      hidden.value = tags.join("|||");
      const picker = document.getElementById("tag-picker");
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "pill active"; btn.style.flexShrink = "0";
      btn.textContent = v;
      btn.onclick = () => RL.toggleTag(v, btn);
      picker.appendChild(btn);
    }
    input.value = "";
  },
  selectCover(value, btnEl){
    document.getElementById("f-cover").value = value;
    if(value) document.getElementById("f-cover-url").value = "";
    document.querySelectorAll(".swatch-row .swatch").forEach(s=>s.classList.remove("selected"));
    btnEl.classList.add("selected");
  },
  onCoverUrlInput(v){
    if(v) document.getElementById("f-cover").value = v;
  },
  saveMaterialFromForm(id, createdAt, lastReadAt, order){
    const title = document.getElementById("f-title").value.trim();
    const url = document.getElementById("f-url").value.trim();
    if(!title || !url){ alert("請至少填寫標題和網址"); return; }
    const urlField = document.getElementById("f-cover-url").value.trim();
    const cover = urlField || document.getElementById("f-cover").value;
    const tagsRaw = document.getElementById("f-tags").value;
    const tags = tagsRaw ? tagsRaw.split("|||").filter(Boolean) : [];
    const m = {
      id: id || ("m-" + Date.now()),
      title,
      description: document.getElementById("f-desc").value.trim(),
      category: document.getElementById("f-category").value,
      tags,
      type: document.getElementById("f-type").value,
      url,
      cover,
      grade: document.getElementById("f-grade").value.trim(),
      difficulty: document.getElementById("f-difficulty").value,
      notes: document.getElementById("f-notes").value.trim(),
      favorite: document.getElementById("f-fav").checked,
      completed: document.getElementById("f-completed").checked,
      createdAt: createdAt || Date.now(),
      lastReadAt: lastReadAt || 0,
      order: order !== undefined ? order : state.data.materials.length,
    };
    const idx = state.data.materials.findIndex(x=>x.id===m.id);
    if(idx >= 0) state.data.materials[idx] = m; else state.data.materials.unshift(m);
    saveData(); closeModal(); render();
  },

  moveMaterial(id, dir){
    const m = state.data.materials.find(x=>x.id===id);
    if(!m) return;
    const siblings = state.data.materials
      .filter(x => x.category === m.category && (!state.subFilter || (x.tags||[]).includes(state.subFilter)))
      .sort((a,b)=>(a.order??0)-(b.order??0));
    const idx = siblings.findIndex(x=>x.id===id);
    const swapIdx = idx + dir;
    if(swapIdx < 0 || swapIdx >= siblings.length) return;
    const a = siblings[idx], b = siblings[swapIdx];
    const tmp = a.order; a.order = b.order; b.order = tmp;
    saveData(); render();
  },

  openCategoryEditor(){
    const swatches = [
      {icon:"feather"},{icon:"divide"},{icon:"languages"},{icon:"flask"},{icon:"globe"},{icon:"video"},
      {icon:"book"},{icon:"star"},{icon:"heart"},{icon:"leaf"},{icon:"sun"},{icon:"cloud"},
      {icon:"lightbulb"},{icon:"music"},{icon:"rocket"},{icon:"tree"},{icon:"palette"},{icon:"sparkles"},
    ];
    document.getElementById("modal-root").innerHTML = `
      <div class="modal-overlay center" onclick="if(event.target===this) RL.closeModal()">
        <div class="pw-box" style="text-align:left" onclick="event.stopPropagation()">
          <div class="display" style="font-size:17px;font-weight:600;text-align:center">新增分類</div>
          <label class="field-label">名稱</label>
          <input id="new-cat-name" class="field-input" placeholder="例如：才藝" />
          <label class="field-label">圖示</label>
          <div class="swatch-row">
            ${swatches.map((s,i)=>`<button type="button" class="swatch ${i===0?'selected':''}" style="background:var(--sage-soft)" onclick="RL.selectCatIcon('${s.icon}', this)">${icon(s.icon,20,"#7E9A79",1.8)}</button>`).join("")}
          </div>
          <input type="hidden" id="new-cat-icon" value="${swatches[0].icon}" />
          <button class="save-btn" onclick="RL.addCategory()">新增</button>
        </div>
      </div>`;
  },
  selectCatIcon(iconName, btnEl){
    document.getElementById("new-cat-icon").value = iconName;
    document.querySelectorAll("#modal-root .swatch-row .swatch").forEach(s=>s.classList.remove("selected"));
    btnEl.classList.add("selected");
  },
  addCategory(){
    const name = document.getElementById("new-cat-name").value.trim();
    if(!name) return;
    const iconName = document.getElementById("new-cat-icon").value;
    const key = "cat-" + Date.now();
    state.data.categories.push({ key, name, icon: iconName, subs: [], order: state.data.categories.length });
    saveData(); closeModal(); render();
  },
  moveCategory(key, dir){
    const sorted = [...state.data.categories].sort((a,b)=>(a.order??0)-(b.order??0));
    const idx = sorted.findIndex(c=>c.key===key);
    const swapIdx = idx + dir;
    if(swapIdx < 0 || swapIdx >= sorted.length) return;
    const a = sorted[idx], b = sorted[swapIdx];
    const tmp = a.order; a.order = b.order; b.order = tmp;
    saveData(); render();
  },
  deleteCategory(key){
    const cat = catByKey(key);
    const count = state.data.materials.filter(m=>m.category===key).length;
    if(!confirm(`確定要刪除「${cat.name}」嗎？裡面的 ${count} 筆教材也會一併刪除。`)) return;
    state.data.categories = state.data.categories.filter(c=>c.key!==key);
    state.data.materials = state.data.materials.filter(m=>m.category!==key);
    saveData(); render();
  },

  bulkRows: [],
  parseBulk(){
    const raw = document.getElementById("bulk-input").value;
    const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
    RL.bulkRows = lines.map(line => {
      const match = line.match(/^(.*?)[\s,，、\t]*?(https?:\/\/\S+)\s*$/i);
      let title, url;
      if(match){ title = match[1].trim(); url = match[2].trim(); }
      else { title = line.trim(); url = ""; }
      if(!title) title = url.replace(/^https?:\/\/(www\.)?/,"").split("/")[0];
      const category = guessCategory(title);
      const cat = catByKey(category);
      const type = guessType(url);
      const tag = guessTag(title, cat);
      return { title, url, category, type, tags: tag ? [tag] : [] };
    });
    RL.renderBulkPreview();
  },
  renderBulkPreview(){
    const box = document.getElementById("bulk-preview");
    if(!RL.bulkRows.length){ box.innerHTML = ""; return; }
    box.innerHTML = `
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${RL.bulkRows.length} 筆，確認分類後送出</div>
      ${RL.bulkRows.map((r,i)=>`
        <div style="background:var(--cream);border-radius:12px;padding:10px;margin-bottom:8px">
          <input class="field-input" style="font-size:13px;margin-bottom:6px" value="${esc(r.title)}" oninput="RL.bulkRows[${i}].title=this.value" placeholder="標題" />
          <input class="field-input" style="font-size:12px;margin-bottom:6px" value="${esc(r.url)}" oninput="RL.bulkRows[${i}].url=this.value" placeholder="網址" />
          <div style="display:flex;gap:6px">
            <select class="field-input" style="flex:1;font-size:12px" onchange="RL.bulkRows[${i}].category=this.value">
              ${state.data.categories.map(c=>`<option value="${c.key}" ${c.key===r.category?"selected":""}>${esc(c.name)}</option>`).join("")}
            </select>
            <select class="field-input" style="flex:1;font-size:12px" onchange="RL.bulkRows[${i}].type=this.value">
              ${TYPES.map(t=>`<option value="${t.key}" ${t.key===r.type?"selected":""}>${esc(t.label)}</option>`).join("")}
            </select>
          </div>
        </div>`).join("")}
      <button class="save-btn" onclick="RL.confirmBulk()">確認新增 ${RL.bulkRows.length} 筆</button>
    `;
  },
  confirmBulk(){
    const now = Date.now();
    let orderBase = state.data.materials.length;
    RL.bulkRows.forEach((r,i) => {
      if(!r.title.trim() || !r.url.trim()) return;
      state.data.materials.push({
        id: "m-" + now + "-" + i,
        title: r.title.trim(), description:"", category: r.category, tags: r.tags||[],
        type: r.type, url: r.url.trim(), cover:"", grade:"", difficulty:"中", notes:"",
        favorite:false, completed:false, createdAt: now, lastReadAt:0, order: orderBase + i,
      });
    });
    RL.bulkRows = [];
    saveData();
    document.getElementById("bulk-input").value = "";
    document.getElementById("bulk-preview").innerHTML = "";
    alert("已新增！");
    document.getElementById("subs-editor").innerHTML = subsEditorHTML();
  },

  exportJson(){
    const blob = new Blob([JSON.stringify(state.data, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `ryan-library-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  },
  importJson(input){
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(parsed.materials && parsed.categories){
          state.data = migrateData(parsed); saveData(); closeModal(); render();
        } else alert("檔案格式不正確");
      }catch(e){ alert("檔案格式錯誤"); }
    };
    reader.readAsText(file);
  },
  changePassword(){
    const v = document.getElementById("new-pw").value.trim();
    if(!v) return;
    state.data.settings.adminPassword = v; saveData();
    document.getElementById("new-pw").value = "";
    alert("密碼已更新");
  },
  showAddSub(ci){
    document.getElementById("add-sub-"+ci).innerHTML = `
      <input id="new-sub-${ci}" class="sub-add-input" autofocus onkeydown="if(event.key==='Enter') RL.addSub(${ci})" />
      <button class="sub-add" onclick="RL.addSub(${ci})">加</button>`;
    setTimeout(()=>document.getElementById("new-sub-"+ci)?.focus(),0);
  },
  addSub(ci){
    const input = document.getElementById("new-sub-"+ci);
    const v = input.value.trim();
    if(v){ state.data.categories[ci].subs.push(v); saveData(); }
    document.getElementById("subs-editor").innerHTML = subsEditorHTML();
  },
  removeSub(ci, si){
    state.data.categories[ci].subs.splice(si,1); saveData();
    document.getElementById("subs-editor").innerHTML = subsEditorHTML();
  },
};
