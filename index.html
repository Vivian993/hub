<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐢 蘇卡達保母小日記</title>
    
    <!-- 📌 iPhone 桌面 App 圖示：它會去抓您上傳到 GitHub 的 custom-icon.png 照片 -->
    <link rel="apple-touch-icon" href="custom-icon.png">
    <link rel="icon" type="image/png" href="custom-icon.png">

    <!-- 引入 Tailwind CSS 進行美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Canvas Confetti 灑花特效 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4;
            -webkit-tap-highlight-color: transparent;
        }
        .task-checkbox {
            appearance: none;
            width: 2.2rem;
            height: 2.2rem;
            border: 3px solid #4ade80;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease-in-out;
            flex-shrink: 0;
        }
        .task-checkbox:checked {
            background-color: #22c55e;
            border-color: #22c55e;
        }
        .task-checkbox:checked::after {
            content: '✔';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .task-card.completed {
            background-color: #e2e8f0;
            opacity: 0.8;
        }
        .task-card.completed .task-text {
            text-decoration: line-through;
            color: #64748b;
        }
        /* 隱藏原生卷軸但保留滑動 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 可愛相框特效 */
        .cute-frame {
            border: 8px solid #fde047;
            border-radius: 16px;
            padding: 4px;
            background: repeating-linear-gradient(45deg, #fef08a, #fef08a 10px, #ffffff 10px, #ffffff 20px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .polaroid-frame {
            border: 6px solid #ffffff;
            border-bottom: 24px solid #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            background-color: white;
        }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative">
        <!-- 頂部導覽與名稱 (固定於上方) -->
        <header class="bg-green-500 text-white p-4 rounded-b-3xl shadow-md text-center">
            <h1 class="text-2xl font-black mb-2 flex items-center justify-center gap-2">
                <i class="fa-solid fa-leaf text-green-200"></i> 蘇卡達保母小日記
            </h1>
            <div class="flex justify-center items-center gap-2 text-sm bg-green-600 bg-opacity-50 p-2 rounded-xl">
                <input type="text" id="keeper-name" class="bg-transparent text-white font-bold w-20 text-center border-b border-green-300 focus:outline-none placeholder-green-200" placeholder="保母名字" onchange="saveData()">
                <span>照顧</span>
                <input type="text" id="pet-name" class="bg-transparent text-white font-bold w-24 text-center border-b border-green-300 focus:outline-none placeholder-green-200" placeholder="寵物名字" onchange="saveData()">
            </div>
        </header>

        <!-- 滑動式頁籤選單 -->
        <div class="flex overflow-x-auto hide-scrollbar gap-2 px-3 mt-4 pb-2 snap-x">
            <button onclick="switchTab('home')" id="btn-home" class="snap-start shrink-0 w-20 bg-green-100 text-green-700 font-bold py-2 rounded-xl border-2 border-green-500 text-xs flex flex-col items-center">
                <i class="fa-solid fa-house mb-1 text-lg"></i> 首頁
            </button>
            <button onclick="switchTab('tasks')" id="btn-tasks" class="snap-start shrink-0 w-20 bg-slate-100 text-slate-500 font-bold py-2 rounded-xl border-2 border-transparent text-xs flex flex-col items-center">
                <i class="fa-solid fa-list-check mb-1 text-lg"></i> 任務
            </button>
            <button onclick="switchTab('detail')" id="btn-detail" class="snap-start shrink-0 w-20 bg-slate-100 text-slate-500 font-bold py-2 rounded-xl border-2 border-transparent text-xs flex flex-col items-center">
                <i class="fa-solid fa-file-pen mb-1 text-lg"></i> 細節
            </button>
            <button onclick="switchTab('guide')" id="btn-guide" class="snap-start shrink-0 w-20 bg-slate-100 text-slate-500 font-bold py-2 rounded-xl border-2 border-transparent text-xs flex flex-col items-center">
                <i class="fa-solid fa-book-open mb-1 text-lg"></i> 指南
            </button>
            <button onclick="switchTab('photo')" id="btn-photo" class="snap-start shrink-0 w-20 bg-slate-100 text-slate-500 font-bold py-2 rounded-xl border-2 border-transparent text-xs flex flex-col items-center">
                <i class="fa-solid fa-camera mb-1 text-lg"></i> 相簿
            </button>
            <button onclick="switchTab('weight')" id="btn-weight" class="snap-start shrink-0 w-20 bg-slate-100 text-slate-500 font-bold py-2 rounded-xl border-2 border-transparent text-xs flex flex-col items-center">
                <i class="fa-solid fa-scale-balanced mb-1 text-lg"></i> 體重
            </button>
        </div>

        <!-- ================= 內容區：首頁 ================= -->
        <div id="tab-home" class="p-4 space-y-5">
            <div class="bg-green-50 p-4 rounded-3xl border-2 border-green-100 flex flex-col items-center justify-center relative">
                <h2 class="font-bold text-green-800 mb-2">🐢 我的可愛大頭照</h2>
                <div class="relative w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-lg bg-slate-200">
                    <img id="profile-pic-preview" src="" class="w-full h-full object-cover hidden" alt="大頭照">
                    <div id="profile-pic-placeholder" class="w-full h-full flex items-center justify-center text-slate-400 text-4xl">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                    <label class="absolute inset-0 cursor-pointer w-full h-full opacity-0">
                        <input type="file" accept="image/*" class="hidden" onchange="uploadProfilePic(event)">
                    </label>
                </div>
                <p class="text-xs text-green-600 mt-2">點擊照片可更換</p>
            </div>

            <div class="bg-amber-50 p-4 rounded-2xl border-2 border-amber-100 shadow-sm">
                <h3 class="font-bold text-amber-800 mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-star text-amber-500"></i> 保母教養與觀察方針
                </h3>
                <textarea id="principles-input" rows="4" class="w-full bg-white p-3 rounded-xl border border-amber-200 focus:outline-none focus:border-amber-400 text-sm font-medium text-slate-700 leading-relaxed" placeholder="例如：&#10;1. 每天都要溫柔對待牠&#10;2. 泡澡時要觀察便便與排酸&#10;3. 多給牠吃新鮮菜菜..." onchange="saveData()"></textarea>
                <p class="text-[10px] text-amber-600 mt-1">打完字會自動存檔喔！</p>
            </div>

            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200">
                <h3 class="font-bold text-slate-700 mb-3 text-sm"><i class="fa-solid fa-floppy-disk mr-1"></i> 資料備份 (匯出/匯入)</h3>
                <div class="flex gap-2">
                    <button onclick="exportData()" class="flex-1 bg-blue-500 text-white font-bold py-2 rounded-xl shadow text-sm hover:bg-blue-600">
                        <i class="fa-solid fa-download mr-1"></i> 匯出備份檔
                    </button>
                    <label class="flex-1 bg-purple-500 text-white font-bold py-2 rounded-xl shadow text-sm hover:bg-purple-600 text-center cursor-pointer">
                        <i class="fa-solid fa-upload mr-1"></i> 匯入資料
                        <input type="file" accept=".json" class="hidden" onchange="importData(event)">
                    </label>
                </div>
                <p class="text-[10px] text-slate-500 mt-2 leading-tight">建議定期「匯出」保存，若換手機時可以用「匯入」把資料找回來！</p>
            </div>
        </div>

        <!-- ================= 內容區：每日任務 (支援排序與歸檔) ================= -->
        <div id="tab-tasks" class="p-4 hidden">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-lg font-bold text-slate-700"><i class="fa-regular fa-calendar-check mr-2 text-green-500"></i>打卡任務表</h2>
                <div class="flex gap-2">
                    <button onclick="toggleTaskEditMode()" id="btn-edit-task" class="text-xs bg-amber-100 text-amber-700 px-3 py-1.5 rounded-full font-bold shadow-sm border border-amber-200">
                        <i class="fa-solid fa-pen mr-1"></i>編輯
                    </button>
                    <button onclick="resetTasks()" class="text-xs bg-slate-200 text-slate-600 px-3 py-1.5 rounded-full font-bold">
                        <i class="fa-solid fa-rotate-right mr-1"></i>重置
                    </button>
                </div>
            </div>

            <!-- 自訂任務新增面板 (編輯模式時顯示) -->
            <div id="task-edit-panel" class="hidden mb-4 p-4 bg-amber-50 rounded-2xl border-2 border-amber-200 shadow-sm space-y-3">
                <h3 class="font-bold text-amber-800 text-sm"><i class="fa-solid fa-plus mr-1"></i> 新增專屬任務</h3>
                <input type="text" id="nt-title" placeholder="任務主項目 (例: 吃飯 / 排酸)" class="w-full p-2.5 rounded-xl border border-amber-200 focus:border-amber-400 focus:outline-none text-sm bg-white font-bold">
                <input type="text" id="nt-desc" placeholder="詳細說明 (例: 切碎菜葉與軟飼料)" class="w-full p-2.5 rounded-xl border border-amber-200 focus:border-amber-400 focus:outline-none text-sm bg-white">
                <div class="flex gap-2">
                    <select id="nt-icon" class="p-2.5 rounded-xl border border-amber-200 focus:outline-none text-sm bg-white flex-1 font-bold">
                        <option value="fa-utensils,text-green-500">🍽️ 吃飯</option>
                        <option value="fa-bath,text-cyan-500">🛁 泡澡</option>
                        <option value="fa-droplet,text-blue-500">💧 排酸 / 換水</option>
                        <option value="fa-sun,text-orange-500">🌞 開燈 / 曬太陽</option>
                        <option value="fa-moon,text-indigo-500">🌙 關燈 / 睡覺</option>
                        <option value="fa-star,text-amber-400">⭐ 其他</option>
                    </select>
                    <button onclick="addTask()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-2 rounded-xl shadow transition-colors">
                        新增
                    </button>
                </div>
            </div>

            <!-- 封存今日紀錄到細節簿的按鈕 (當有任務完成時顯示) -->
            <div id="archive-today-box" class="hidden mb-4 p-3 bg-green-50 rounded-2xl border border-green-200 text-center">
                <button onclick="archiveTodayTasks()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl shadow text-xs">
                    <i class="fa-solid fa-box-archive mr-1"></i> 📦 將打卡紀錄存入「細節簿」並準備明天
                </button>
            </div>

            <div id="task-container" class="space-y-3"></div>
        </div>

        <!-- ================= 內容區：細節紀錄 ================= -->
        <div id="tab-detail" class="p-4 hidden space-y-4">
            <h2 class="text-lg font-bold text-slate-700 mb-2"><i class="fa-solid fa-clipboard-list mr-2 text-amber-500"></i>每日細節記錄</h2>
            <div class="bg-amber-50 rounded-2xl p-4 border-2 border-amber-200 shadow-sm space-y-3">
                <div class="flex gap-2">
                    <select id="detail-hour" class="flex-1 rounded-xl border-2 border-amber-200 px-2 py-2 text-sm font-bold bg-white text-center"></select>
                    <span class="flex items-center font-bold text-slate-500">:</span>
                    <select id="detail-minute" class="flex-1 rounded-xl border-2 border-amber-200 px-2 py-2 text-sm font-bold bg-white text-center"></select>
                </div>
                <select id="detail-category" class="w-full rounded-xl border-2 border-amber-200 px-3 py-2 text-sm font-bold bg-white">
                    <option value="🥬 餵食">🥬 餵食 (食物/份量)</option>
                    <option value="🛁 泡澡">🛁 泡澡 (溫度/時長)</option>
                    <option value="💧 排酸">💧 排酸 (質地/狀態)</option>
                    <option value="☀️ 活動">☀️ 曬背與活動</option>
                    <option value="💡 其他">💡 其他精進觀察</option>
                </select>
                <textarea id="detail-content" rows="2" placeholder="紀錄內容..." class="w-full rounded-xl border-2 border-amber-200 p-2 text-sm bg-white"></textarea>
                <button onclick="addDetailRecord()" class="w-full bg-amber-500 text-white font-bold py-2 rounded-xl shadow-md text-sm">
                    <i class="fa-solid fa-plus mr-1"></i> 新增紀錄
                </button>
            </div>
            <div id="detail-list" class="space-y-3"></div>
        </div>

        <!-- ================= 內容區：每月指南 ================= -->
        <div id="tab-guide" class="p-4 hidden space-y-4">
            <h2 class="text-lg font-bold text-slate-700 mb-2"><i class="fa-solid fa-graduation-cap mr-2 text-green-600"></i>成長指南與心得</h2>
            <div class="grid grid-cols-3 gap-2" id="guide-month-buttons">
                <!-- 按鈕由JS產生 -->
            </div>
            <div id="month-content-card" class="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-4 shadow-sm space-y-3">
                <!-- 內容由 JS 動態填入 -->
            </div>
        </div>

        <!-- ================= 內容區：成長相簿 ================= -->
        <div id="tab-photo" class="p-4 hidden space-y-4">
            <h2 class="text-lg font-bold text-slate-700 mb-2"><i class="fa-solid fa-camera-retro mr-2 text-purple-500"></i>相簿收藏區</h2>
            
            <div class="bg-purple-50 rounded-2xl p-4 border-2 border-purple-200 shadow-sm space-y-3">
                <div class="flex gap-2 mb-2">
                    <button onclick="setPhotoMode('monthly')" id="pm-monthly" class="flex-1 bg-purple-500 text-white font-bold py-2 rounded-xl text-xs shadow-inner">每月里程碑</button>
                    <button onclick="setPhotoMode('daily')" id="pm-daily" class="flex-1 bg-white text-purple-500 border border-purple-300 font-bold py-2 rounded-xl text-xs">日常收藏照</button>
                </div>
                
                <select id="photo-month-select" class="w-full rounded-xl border-2 border-purple-200 px-3 py-2 text-sm font-bold bg-white"></select>
                <input type="text" id="photo-daily-desc" placeholder="簡單描述 (如：可愛睡姿)" class="w-full rounded-xl border-2 border-purple-200 px-3 py-2 text-sm font-bold bg-white hidden">

                <label class="block w-full bg-purple-600 text-white font-bold py-3 rounded-xl text-center shadow-md cursor-pointer text-sm">
                    <i class="fa-solid fa-camera mr-1"></i> 拍照 / 上傳照片
                    <input type="file" accept="image/*" capture="environment" class="hidden" onchange="compressAndSavePhoto(event)">
                </label>
            </div>

            <div id="photo-gallery" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- ================= 內容區：體重紀錄 ================= -->
        <div id="tab-weight" class="p-4 hidden">
            <h2 class="text-lg font-bold text-slate-700 mb-2"><i class="fa-solid fa-scale-balanced mr-2 text-blue-500"></i>體重紀錄</h2>
            
            <div class="bg-blue-50 rounded-2xl p-4 border-2 border-blue-200 mb-4 shadow-sm space-y-3">
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-600 mb-1">測量日期</label>
                        <input type="date" id="weight-date" class="w-full rounded-xl border-2 border-blue-200 px-2 py-2 text-sm font-bold bg-white">
                    </div>
                    <div class="w-24">
                        <label class="block text-xs font-bold text-slate-600 mb-1">單位</label>
                        <select id="weight-unit" class="w-full rounded-xl border-2 border-blue-200 px-1 py-2 text-sm font-bold bg-white text-center">
                            <option value="g">公克 (g)</option>
                            <option value="kg">公斤 (kg)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">體重數值</label>
                    <input type="number" step="0.01" id="weight-input" placeholder="輸入數字" class="w-full rounded-xl border-2 border-blue-200 px-3 py-2 text-lg font-bold bg-white text-center focus:border-blue-500">
                </div>
                <button onclick="addWeight()" class="w-full bg-blue-500 text-white font-bold py-2.5 rounded-xl shadow-md text-sm">
                    <i class="fa-solid fa-pen mr-1"></i> 儲存紀錄
                </button>
            </div>
            <div id="weight-list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        // ================= 全局資料結構 =================
        let appData = {
            keeperName: '',
            petName: '',
            profilePic: '',
            principles: '',
            customTasks: [],
            tasksState: {},
            detailRecords: [],
            weightRecords: [],
            photoRecords: [],
            customGuides: {}
        };

        const STORAGE_KEY = 'tortoise_diary_data';

        // 預設主項目任務列表
        const defaultTasks = [
            { id: 't_1', title: '開燈', text: '開啟太陽燈與UVB燈保暖', icon: 'fa-sun', color: 'text-orange-500' },
            { id: 't_2', title: '吃飯', text: '切碎菜葉或浸泡軟化草餅', icon: 'fa-utensils', color: 'text-green-500' },
            { id: 't_3', title: '換水', text: '更換淺水盆乾淨飲水', icon: 'fa-glass-water', color: 'text-blue-400' },
            { id: 't_4', title: '泡澡', text: '溫水泡澡 15-20 分鐘', icon: 'fa-bath', color: 'text-cyan-500' },
            { id: 't_5', title: '排酸', text: '觀察有無白色軟尿酸排泄', icon: 'fa-droplet', color: 'text-blue-500' },
            { id: 't_6', title: '關燈', text: '晚上關閉發光燈具就寢', icon: 'fa-moon', color: 'text-indigo-500' }
        ];

        const monthGuideData = {
            1: { title: "1個月(剛到家)", text: "每天泡澡盯排酸。食物切極碎，極需保溫防風。" },
            2: { title: "2個月", text: "適應期。維持高溫高濕與切碎食物。" },
            3: { title: "3個月", text: "生長黃金期。每週補鈣2次，食物量為龜殼體積80%。" },
            4: { title: "4-6個月", text: "食量變大，可加多種野草，稍微切大塊一點。" },
            5: { title: "7-12個月", text: "邁向一歲。加強UVB與乾草比例，預防隆背。" },
            6: { title: "1歲~1.5歲", text: "青年期。可每週泡2-3次，自己啃咬整片葉子。" },
            7: { title: "1.5歲~2歲", text: "亞成體。主食轉為高纖乾燥牧草，破壞力漸強。" },
            8: { title: "3歲以上", text: "成年巨獸。提供大空間與水池，完全草食低蛋白。" }
        };

        // ================= 存檔與讀檔 =================
        function saveData() {
            appData.keeperName = document.getElementById('keeper-name').value;
            appData.petName = document.getElementById('pet-name').value;
            appData.principles = document.getElementById('principles-input').value;
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            } catch (e) {
                alert("儲存失敗！可能是上傳太多照片導致空間不足，請先匯出備份後刪除幾張舊照片。");
            }
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                appData = JSON.parse(saved);
            }
            
            if (!appData.customTasks || appData.customTasks.length === 0) {
                appData.customTasks = JSON.parse(JSON.stringify(defaultTasks));
            }

            appData.customTasks.forEach(t => {
                if (!appData.tasksState[t.id]) {
                    appData.tasksState[t.id] = { completed: false, time: '', keeper: '' };
                }
            });

            document.getElementById('keeper-name').value = appData.keeperName || '';
            document.getElementById('pet-name').value = appData.petName || '';
            document.getElementById('principles-input').value = appData.principles || '';
            
            if (appData.profilePic) {
                document.getElementById('profile-pic-preview').src = appData.profilePic;
                document.getElementById('profile-pic-preview').classList.remove('hidden');
                document.getElementById('profile-pic-placeholder').classList.add('hidden');
            }
        }

        function exportData() {
            saveData();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "龜龜日記備份_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(dl); dl.click(); dl.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    appData = JSON.parse(e.target.result);
                    saveData();
                    alert("資料匯入成功！系統將重新整理。");
                    location.reload();
                } catch(err) {
                    alert("匯入失敗，請確認檔案格式是否正確。");
                }
            };
            reader.readAsText(file);
        }

        // ================= 初始化 UI 元素 =================
        function initSelectors() {
            const hSel = document.getElementById('detail-hour');
            const mSel = document.getElementById('detail-minute');
            for(let i=0; i<24; i++) hSel.innerHTML += `<option value="${String(i).padStart(2,'0')}">${String(i).padStart(2,'0')} 時</option>`;
            for(let i=0; i<60; i+=5) mSel.innerHTML += `<option value="${String(i).padStart(2,'0')}">${String(i).padStart(2,'0')} 分</option>`;
            
            const now = new Date();
            hSel.value = String(now.getHours()).padStart(2, '0');
            const rMin = Math.round(now.getMinutes()/5)*5;
            mSel.value = String(rMin===60?0:rMin).padStart(2, '0');

            const pMonth = document.getElementById('photo-month-select');
            for(let i=1; i<=11; i++) pMonth.innerHTML += `<option value="${i}個月大">${i}個月大</option>`;
            pMonth.innerHTML += `<option value="滿1歲">滿1歲 🎂</option>`;
            for(let i=1; i<=11; i++) pMonth.innerHTML += `<option value="1歲${i}個月">1歲${i}個月</option>`;
            pMonth.innerHTML += `<option value="滿2歲">滿2歲 🎂</option>`;
            pMonth.innerHTML += `<option value="滿3歲以上">3歲以上巨獸</option>`;

            document.getElementById('weight-date').valueAsDate = new Date();

            const gBtns = document.getElementById('guide-month-buttons');
            for(let key in monthGuideData) {
                gBtns.innerHTML += `<button onclick="renderGuide(${key})" id="gbtn-${key}" class="bg-slate-100 text-slate-600 font-bold py-2 rounded-xl text-xs shadow-sm">${monthGuideData[key].title}</button>`;
            }
        }

        // ================= 功能：首頁大頭照 =================
        function uploadProfilePic(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(evt) {
                compressImage(evt.target.result, 400, (compressedBase64) => {
                    appData.profilePic = compressedBase64;
                    document.getElementById('profile-pic-preview').src = compressedBase64;
                    document.getElementById('profile-pic-preview').classList.remove('hidden');
                    document.getElementById('profile-pic-placeholder').classList.add('hidden');
                    saveData();
                });
            }
        }

        function compressImage(dataUrl, maxSize, callback) {
            const img = new Image();
            img.src = dataUrl;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                if (w > h && w > maxSize) { h *= maxSize / w; w = maxSize; } 
                else if (h > maxSize) { w *= maxSize / h; h = maxSize; }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                callback(canvas.toDataURL('image/jpeg', 0.6));
            }
        }

        // ================= 功能：任務打卡 (支援排序、編輯、轉移至細節簿) =================
        let isTaskEditMode = false;

        window.toggleTaskEditMode = function() {
            isTaskEditMode = !isTaskEditMode;
            const panel = document.getElementById('task-edit-panel');
            const btn = document.getElementById('btn-edit-task');
            
            if (isTaskEditMode) {
                panel.classList.remove('hidden');
                btn.innerHTML = '<i class="fa-solid fa-check mr-1"></i>完成編輯';
                btn.className = 'text-xs bg-green-100 text-green-700 px-3 py-1.5 rounded-full font-bold shadow-sm border border-green-200';
            } else {
                panel.classList.add('hidden');
                btn.innerHTML = '<i class="fa-solid fa-pen mr-1"></i>編輯';
                btn.className = 'text-xs bg-amber-100 text-amber-700 px-3 py-1.5 rounded-full font-bold shadow-sm border border-amber-200';
            }
            renderTasks();
        }

        // 上下移動任務位置
        window.moveTask = function(index, direction, event) {
            event.stopPropagation();
            if (direction === 'up' && index > 0) {
                const temp = appData.customTasks[index];
                appData.customTasks[index] = appData.customTasks[index - 1];
                appData.customTasks[index - 1] = temp;
            } else if (direction === 'down' && index < appData.customTasks.length - 1) {
                const temp = appData.customTasks[index];
                appData.customTasks[index] = appData.customTasks[index + 1];
                appData.customTasks[index + 1] = temp;
            }
            saveData();
            renderTasks();
        }

        window.addTask = function() {
            const title = document.getElementById('nt-title').value.trim();
            const desc = document.getElementById('nt-desc').value.trim();
            const iconData = document.getElementById('nt-icon').value.split(',');

            if(!title) return alert("請輸入「任務名稱」！");

            const newId = 't_' + Date.now();
            appData.customTasks.push({
                id: newId,
                title: title,
                text: desc,
                icon: iconData[0],
                color: iconData[1]
            });
            appData.tasksState[newId] = { completed: false, time: '', keeper: '' };
            
            document.getElementById('nt-title').value = '';
            document.getElementById('nt-desc').value = '';
            
            saveData();
            renderTasks();
        }

        window.removeTask = function(id, event) {
            event.stopPropagation();
            if(confirm("確定要刪除這個任務嗎？")) {
                appData.customTasks = appData.customTasks.filter(t => t.id !== id);
                delete appData.tasksState[id];
                saveData();
                renderTasks();
            }
        }

        // 將今日已完成的打卡紀錄轉移封存到「細節紀錄」簿子裡
        window.archiveTodayTasks = function() {
            const completedItems = appData.customTasks.filter(t => appData.tasksState[t.id] && appData.tasksState[t.id].completed);
            if (completedItems.length === 0) return alert("今天還沒有打卡紀錄喔！");

            if (confirm("要將今天的打卡紀錄保存到「細節紀錄」簿子裡，並重置打卡表準備明天嗎？")) {
                const now = new Date();
                const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
                
                let summaryText = completedItems.map(t => {
                    const st = appData.tasksState[t.id];
                    return `• ${t.title} (${st.time} 由保母[${st.keeper}]完成)`;
                }).join('\n');

                appData.detailRecords.push({
                    id: Date.now(),
                    date: dateStr,
                    time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
                    cat: '✅ 每日打卡總結',
                    content: `今日完成 ${completedItems.length} 項任務：\n` + summaryText,
                    keeper: appData.keeperName || '保母'
                });

                resetTasks();
                alert("成功記錄到細節紀錄簿！可在「細節」頁籤查看歷史總結。");
            }
        }

        function renderTasks() {
            const c = document.getElementById('task-container');
            const archiveBox = document.getElementById('archive-today-box');
            c.innerHTML = '';
            
            if (!appData.customTasks || appData.customTasks.length === 0) {
                c.innerHTML = '<div class="text-center text-slate-400 py-6 text-sm font-bold">還沒有任務喔，請點擊上方「編輯」來新增！</div>';
                archiveBox.classList.add('hidden');
                return;
            }

            const pName = appData.petName || '龜寶貝';
            let hasAnyCompleted = false;
            
            appData.customTasks.forEach((t, index) => {
                const st = appData.tasksState[t.id] || { completed: false };
                if (st.completed) hasAnyCompleted = true;

                let info = st.completed ? `<div class="text-[10px] text-green-600 mt-0.5 font-bold"><i class="fa-solid fa-check"></i> [${st.keeper}] 幫 [${pName}] 完成於 ${st.time}</div>` : '';
                
                let actionHtml = '';
                if (isTaskEditMode) {
                    // 編輯模式：顯示上下移按鈕與刪除按鈕
                    actionHtml = `
                        <div class="flex items-center gap-1">
                            <button onclick="moveTask(${index}, 'up', event)" class="w-7 h-7 flex items-center justify-center bg-amber-100 text-amber-700 rounded-lg hover:bg-amber-200 text-xs font-bold ${index === 0 ? 'opacity-30 cursor-not-allowed' : ''}">
                                ▲
                            </button>
                            <button onclick="moveTask(${index}, 'down', event)" class="w-7 h-7 flex items-center justify-center bg-amber-100 text-amber-700 rounded-lg hover:bg-amber-200 text-xs font-bold ${index === appData.customTasks.length - 1 ? 'opacity-30 cursor-not-allowed' : ''}">
                                ▼
                            </button>
                            <button onclick="removeTask('${t.id}', event)" class="w-7 h-7 flex items-center justify-center bg-red-100 text-red-500 rounded-lg hover:bg-red-200 text-xs ml-1">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                } else {
                    actionHtml = `<input type="checkbox" class="task-checkbox ml-2" ${st.completed ? 'checked' : ''} onchange="toggleTask('${t.id}')">`;
                }

                c.innerHTML += `
                    <div class="flex items-center p-3.5 bg-white border border-slate-200 rounded-2xl shadow-sm ${st.completed && !isTaskEditMode ? 'opacity-75 bg-slate-50' : ''} ${!isTaskEditMode ? 'cursor-pointer' : ''}" ${!isTaskEditMode ? `onclick="toggleTask('${t.id}')"` : ''}>
                        <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center border shrink-0 shadow-inner">
                            <i class="fa-solid ${t.icon} text-xl ${t.color}"></i>
                        </div>
                        <div class="flex-1 ml-3 pr-2 pointer-events-none">
                            <h4 class="font-bold text-base text-slate-800 ${st.completed && !isTaskEditMode ? 'line-through' : ''}">${t.title}</h4>
                            ${t.text ? `<p class="text-xs text-slate-500 leading-tight">${t.text}</p>` : ''}
                            ${!isTaskEditMode ? info : ''}
                        </div>
                        <div class="shrink-0" onclick="event.stopPropagation()">
                            ${actionHtml}
                        </div>
                    </div>
                `;
            });

            // 如果有完成的項目且不在編輯模式，顯示歸檔到細節簿按鈕
            if (hasAnyCompleted && !isTaskEditMode) {
                archiveBox.classList.remove('hidden');
            } else {
                archiveBox.classList.add('hidden');
            }
        }

        window.toggleTask = function(id) {
            if(isTaskEditMode) return;

            const k = appData.keeperName || '保母';
            const st = appData.tasksState[id] || {};
            
            if (!st.completed) {
                const now = new Date();
                appData.tasksState[id] = { completed: true, time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`, keeper: k };
            } else {
                appData.tasksState[id] = { completed: false, time: '', keeper: '' };
            }
            saveData();
            renderTasks();
            
            if (Object.values(appData.tasksState).every(v => v.completed) && appData.customTasks.length > 0) {
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            }
        }

        window.resetTasks = function() {
            for (let k in appData.tasksState) {
                appData.tasksState[k] = { completed: false, time: '', keeper: '' };
            }
            saveData(); 
            renderTasks();
        }

        // ================= 功能：細節紀錄 =================
        window.addDetailRecord = function() {
            const t = `${document.getElementById('detail-hour').value}:${document.getElementById('detail-minute').value}`;
            const cat = document.getElementById('detail-category').value;
            const c = document.getElementById('detail-content').value.trim();
            if(!c) return alert("請輸入內容！");
            
            const now = new Date();
            appData.detailRecords.push({
                id: Date.now(),
                date: `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`,
                time: t, cat: cat, content: c,
                keeper: appData.keeperName || '保母'
            });
            document.getElementById('detail-content').value = '';
            saveData(); renderDetails();
        }

        function renderDetails() {
            const c = document.getElementById('detail-list');
            c.innerHTML = '';
            if(appData.detailRecords.length===0) c.innerHTML = '<p class="text-xs text-slate-400 text-center py-4 font-bold">尚無紀錄</p>';
            
            [...appData.detailRecords].reverse().forEach(r => {
                c.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border border-amber-100 shadow-sm relative">
                        <button onclick="delRecord('detail', ${r.id})" class="absolute top-2 right-2 text-red-300 hover:text-red-500"><i class="fa-solid fa-trash text-xs"></i></button>
                        <div class="flex justify-between items-center pr-4">
                            <span class="text-xs font-bold text-amber-700 bg-amber-100 px-2 rounded">${r.cat}</span>
                            <span class="text-[10px] font-bold text-slate-400">${r.date} ${r.time}</span>
                        </div>
                        <p class="text-sm mt-2 text-slate-700 font-medium whitespace-pre-line leading-relaxed">${r.content}</p>
                        <div class="text-[10px] text-slate-400 mt-2 font-bold border-t border-slate-50 pt-1">記錄保母: ${r.keeper}</div>
                    </div>
                `;
            });
        }

        window.delRecord = function(type, id) {
            if(!confirm("確定刪除嗎？")) return;
            if(type==='detail') appData.detailRecords = appData.detailRecords.filter(x => x.id !== id);
            if(type==='weight') appData.weightRecords = appData.weightRecords.filter(x => x.id !== id);
            if(type==='photo') appData.photoRecords = appData.photoRecords.filter(x => x.id !== id);
            saveData();
            if(type==='detail') renderDetails();
            if(type==='weight') renderWeights();
            if(type==='photo') renderPhotos();
        }

        // ================= 功能：自訂指南 =================
        window.renderGuide = function(monthKey) {
            for(let i=1; i<=8; i++) {
                let b = document.getElementById(`gbtn-${i}`);
                if(b) b.className = (i == monthKey) ? "bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs shadow-sm" : "bg-slate-100 text-slate-600 font-bold py-2 rounded-xl text-xs shadow-sm";
            }
            
            const data = monthGuideData[monthKey];
            const customTxt = appData.customGuides[monthKey] || '';
            
            const c = document.getElementById('month-content-card');
            c.innerHTML = `
                <h3 class="font-black text-emerald-900">${data.title} 照護重點</h3>
                <p class="text-sm text-slate-700 bg-white p-3 rounded-lg border border-emerald-100 font-medium leading-relaxed">${data.text}</p>
                <div class="mt-4 border-t-2 border-emerald-100 pt-3">
                    <label class="text-xs font-bold text-emerald-700 flex items-center mb-1.5"><i class="fa-solid fa-pen mr-1"></i> 保母的專屬心得 (可自訂)</label>
                    <textarea id="custom-guide-input" rows="3" class="w-full bg-white p-3 rounded-xl border border-emerald-200 focus:outline-none focus:border-emerald-500 text-sm font-medium" placeholder="寫下這個月觀察到寶貝的變化或是學習到的新知識...">${customTxt}</textarea>
                    <button onclick="saveCustomGuide(${monthKey})" class="mt-2 w-full bg-emerald-100 text-emerald-700 font-bold py-2 rounded-xl text-xs hover:bg-emerald-200">儲存心得</button>
                </div>
            `;
        }

        window.saveCustomGuide = function(monthKey) {
            appData.customGuides[monthKey] = document.getElementById('custom-guide-input').value;
            saveData();
            alert("心得已儲存！");
        }

        // ================= 功能：進階相簿 =================
        let photoMode = 'monthly';
        window.setPhotoMode = function(mode) {
            photoMode = mode;
            const pmBtn = document.getElementById('pm-monthly');
            const pdBtn = document.getElementById('pm-daily');
            const ms = document.getElementById('photo-month-select');
            const dd = document.getElementById('photo-daily-desc');
            
            if(mode === 'monthly') {
                pmBtn.className = "flex-1 bg-purple-500 text-white font-bold py-2 rounded-xl text-xs shadow-inner";
                pdBtn.className = "flex-1 bg-white text-purple-500 border border-purple-300 font-bold py-2 rounded-xl text-xs";
                ms.classList.remove('hidden');
                dd.classList.add('hidden');
            } else {
                pdBtn.className = "flex-1 bg-purple-500 text-white font-bold py-2 rounded-xl text-xs shadow-inner";
                pmBtn.className = "flex-1 bg-white text-purple-500 border border-purple-300 font-bold py-2 rounded-xl text-xs";
                ms.classList.add('hidden');
                dd.classList.remove('hidden');
            }
        }

        window.compressAndSavePhoto = function(e) {
            const f = e.target.files[0]; if(!f) return;
            const reader = new FileReader();
            reader.readAsDataURL(f);
            reader.onload = function(evt) {
                compressImage(evt.target.result, 500, (compressedData) => {
                    const now = new Date();
                    let label = photoMode === 'monthly' ? document.getElementById('photo-month-select').value : (document.getElementById('photo-daily-desc').value.trim() || '日常可愛紀錄');
                    
                    appData.photoRecords.push({
                        id: Date.now(),
                        type: photoMode,
                        label: label,
                        img: compressedData,
                        date: `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`,
                        keeper: appData.keeperName || '保母'
                    });
                    
                    document.getElementById('photo-daily-desc').value = '';
                    e.target.value = '';
                    saveData(); renderPhotos();
                    alert("照片壓縮並存檔成功！");
                });
            }
        }

        function renderPhotos() {
            const c = document.getElementById('photo-gallery');
            c.innerHTML = '';
            if(appData.photoRecords.length===0) c.innerHTML = '<div class="col-span-2 text-center text-xs font-bold text-slate-400 py-4">尚無照片，快拍一張吧！</div>';
            
            [...appData.photoRecords].reverse().forEach(r => {
                const frameClass = r.type === 'monthly' ? 'cute-frame' : 'polaroid-frame';
                const tagBg = r.type === 'monthly' ? 'bg-pink-500' : 'bg-purple-500';

                c.innerHTML += `
                    <div class="relative ${frameClass} flex flex-col items-center">
                        <button onclick="delRecord('photo', ${r.id})" class="absolute top-1 right-1 bg-red-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px] z-10 shadow"><i class="fa-solid fa-x"></i></button>
                        <div class="w-full aspect-square overflow-hidden bg-slate-100">
                            <img src="${r.img}" class="w-full h-full object-cover">
                        </div>
                        <div class="w-full mt-2 text-center">
                            <span class="${tagBg} text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow-sm">${r.label}</span>
                            <p class="text-[9px] text-slate-500 mt-1 font-bold">${r.date} | ${r.keeper}拍</p>
                        </div>
                    </div>
                `;
            });
        }

        // ================= 功能：體重紀錄 =================
        window.addWeight = function() {
            const dateVal = document.getElementById('weight-date').value;
            const unit = document.getElementById('weight-unit').value;
            const weightVal = parseFloat(document.getElementById('weight-input').value);
            
            if(!dateVal || isNaN(weightVal) || weightVal <= 0) return alert("請輸入正確日期與數字！");
            
            appData.weightRecords.push({
                id: Date.now(),
                date: dateVal,
                weight: weightVal,
                unit: unit,
                keeper: appData.keeperName || '保母'
            });
            
            document.getElementById('weight-input').value = '';
            saveData(); renderWeights();
            confetti({ particleCount: 50, origin: { y: 0.8 } });
        }

        function renderWeights() {
            const c = document.getElementById('weight-list');
            c.innerHTML = '';
            if(appData.weightRecords.length===0) return c.innerHTML = '<p class="text-xs font-bold text-slate-400 text-center py-4">尚無紀錄</p>';
            
            const sorted = [...appData.weightRecords].sort((a,b)=> new Date(b.date) - new Date(a.date));
            sorted.forEach(r => {
                c.innerHTML += `
                    <div class="flex justify-between items-center bg-white border border-blue-100 p-3 rounded-xl shadow-sm relative">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-400 flex items-center justify-center"><i class="fa-solid fa-calendar text-xs"></i></div>
                            <div>
                                <p class="text-sm font-bold text-slate-700">${r.date}</p>
                                <p class="text-[9px] font-bold text-slate-400">保母: ${r.keeper}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-lg font-black text-slate-800">${r.weight} <span class="text-xs text-slate-500">${r.unit}</span></span>
                            <button onclick="delRecord('weight', ${r.id})" class="text-red-300 hover:text-red-500 ml-1"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        // ================= 頁籤切換邏輯 =================
        window.switchTab = function(tabName) {
            const tabs = ['home', 'tasks', 'detail', 'guide', 'photo', 'weight'];
            
            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                const btn = document.getElementById(`btn-${t}`);
                btn.className = 'snap-start shrink-0 w-20 bg-slate-100 text-slate-500 font-bold py-2 rounded-xl border-2 border-transparent text-xs flex flex-col items-center';
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            
            const activeBtn = document.getElementById(`btn-${tabName}`);
            const colorMap = {
                'home': 'green', 'tasks': 'emerald', 'detail': 'amber', 
                'guide': 'teal', 'photo': 'purple', 'weight': 'blue'
            };
            const c = colorMap[tabName];
            activeBtn.className = `snap-start shrink-0 w-20 bg-${c}-100 text-${c}-700 font-bold py-2 rounded-xl border-2 border-${c}-500 text-xs flex flex-col items-center`;

            if(tabName === 'tasks') renderTasks();
            if(tabName === 'detail') renderDetails();
            if(tabName === 'guide') renderGuide(1);
            if(tabName === 'photo') renderPhotos();
            if(tabName === 'weight') renderWeights();
        }

        // ================= 系統啟動 =================
        window.onload = function() {
            initSelectors();
            loadData();
            switchTab('home'); 
        }
    </script>
</body>
