<style>
  :root{
    --paper: #fff2f6;
    --paper-alt: #ffe3ec;
    --ink: #4a3b4f;
    --ink-soft: #a68ba3;
    --red: #ff8fa3;
    --red-soft: #ffb6c6;
    --blue: #8ecbec;
    --blue-faint: rgba(142,203,236,0.35);
    --gold: #ffc875;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(255,200,117,0.14), transparent 55%),
      var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:28px 18px 60px;
    user-select:none;
  }
  .wrap{ max-width:520px; margin:0 auto; }

  header{
    padding:0 2px 20px 18px;
    margin-bottom:22px;
    border-left:3px solid var(--red);
  }
  .eyebrow{
    font-family:'Ma Shan Zheng', cursive;
    font-size:19px;
    color:var(--red-soft);
    display:block;
    margin-bottom:2px;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:24px;
    margin:0 0 6px;
  }
  header p{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.7;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:34px 12px;
  }

  .tile-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    position:relative;
  }
  .tile{
    width:100%;
    aspect-ratio:1/1;
    border-radius:22%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(74,59,79,0.14), inset 0 0 0 1px rgba(255,255,255,0.4);
    transition:transform .12s ease;
    position:relative;
  }
  .tile:active{ transform:scale(0.92); }
  .tile.add{
    background:transparent;
    box-shadow:none;
    border:1.8px dashed var(--red-soft);
    color:var(--red);
    font-size:22px;
  }
  .label{
    font-size:11px;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:400;
    text-align:center;
    color:var(--ink);
    line-height:1.35;
    max-width:100%;
    min-height:29.5px;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    white-space:normal;
  }
  .label.add-label{ color:var(--red); }

  .badge{
    position:absolute;
    top:-6px; left:-6px;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--red);
    color:#fdf9ef;
    font-size:13px;
    line-height:20px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    display:none;
    z-index:2;
  }
  .jiggling .badge{ display:block; }
  .jiggling .tile{ animation:jiggle .28s infinite; }
  @keyframes jiggle{
    0%{ transform:rotate(-1.3deg); }
    50%{ transform:rotate(1.3deg); }
    100%{ transform:rotate(-1.3deg); }
  }

  .hint{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:22px;
    opacity:0.75;
    line-height:1.7;
  }

  .done-bar{
    display:none;
    justify-content:flex-end;
    margin-bottom:12px;
  }
  .done-bar.show{ display:flex; }
  .done-btn{
    background:var(--red);
    color:#fdf9ef;
    border:none;
    padding:8px 16px;
    border-radius:20px;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:13px;
  }

  .backup-row{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:26px;
  }
  .backup-btn{
    flex:1;
    max-width:220px;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--blue-faint);
    background:#fbf8ef;
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:12.5px;
    cursor:pointer;
    text-align:center;
  }
  .backup-btn.reset{
    border-color:var(--red-soft);
    color:var(--red);
    flex:0 0 auto;
    max-width:none;
  }
  #restoreFile{ display:none; }
  .backup-status{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:8px;
    min-height:16px;
  }

  /* modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(44,43,38,0.42);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.open{ display:flex; }
  .sheet{
    width:100%;
    max-width:520px;
    background:var(--paper-alt);
    border-radius:18px 18px 0 0;
    padding:22px 20px 26px;
    box-shadow:0 -8px 30px rgba(0,0,0,0.2);
    animation:rise .22s ease;
  }
  @keyframes rise{ from{ transform:translateY(16px); opacity:0;} to{ transform:translateY(0); opacity:1; } }
  .sheet h2{
    font-family:'Noto Serif TC', serif;
    font-size:18px;
    margin:0 0 16px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:1.5px solid var(--blue-faint);
    background:#fbf8ef;
    font-size:14.5px;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
  }
  .field input:focus{ outline:none; border-color:var(--gold); }
  .image-picker-row{ display:flex; align-items:center; gap:14px; margin-top:8px; }
  .image-preview{
    width:58px; height:58px;
    border-radius:22%;
    border:1.5px dashed var(--blue-faint);
    background:#fbf8ef;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
    font-size:20px;
    flex-shrink:0;
    overflow:hidden;
    background-size:cover;
    background-position:center;
  }
  .image-picker-actions{ display:flex; flex-direction:column; gap:8px; }
  .btn.pick-img{
    display:inline-block;
    padding:9px 14px;
    border-radius:8px;
    border:1.5px solid var(--blue-faint);
    background:#fbf8ef;
    color:var(--ink);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
  }
  .btn.clear-img{
    padding:8px 14px;
    border-radius:8px;
    border:1.5px solid var(--red-soft);
    background:transparent;
    color:var(--red);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
  }
  .emoji-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .emoji-opt{
    width:38px; height:38px;
    border-radius:10px;
    border:1.5px solid var(--blue-faint);
    background:#fbf8ef;
    font-size:19px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .emoji-opt.selected{ border-color:var(--gold); background:rgba(255,200,117,0.2); }
  .swatch-row{ display:flex; gap:8px; margin-top:8px; }
  .swatch{
    width:30px; height:30px; border-radius:50%;
    cursor:pointer; border:2px solid transparent;
  }
  .swatch.selected{ border-color:var(--ink); }

  .sheet-actions{ display:flex; gap:10px; margin-top:8px; }
  .btn{
    flex:1; padding:12px; border-radius:8px; border:none;
    font-family:'Noto Sans TC', sans-serif; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .btn.cancel{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--blue-faint); }
  .btn.save{ background:var(--red); color:#fdf9ef; }
  .btn.delete{ background:transparent; color:var(--red); border:1.5px solid var(--red-soft); flex:0 0 auto; padding:12px 16px; }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">自己的小工具・自己排</span>
      <h1>我的百寶箱</h1>
      <p>把常用的網頁工具集中在這裡。長按任一圖示可以改圖示、改名字、改連結；輕點就直接開啟。</p>
    </header>

    <div class="done-bar" id="doneBar"><button class="done-btn" id="doneBtn">完成</button></div>

    <div class="grid" id="grid"></div>

    <div class="hint">輕點圖示＝開啟連結　・　長按圖示＝編輯這個 App　・　點「＋」新增</div>

    <div class="backup-row">
      <button class="backup-btn" id="backupBtn">⬇️ 下載備份（JSON）</button>
      <button class="backup-btn" id="restoreBtn">⬆️ 還原備份</button>
      <input type="file" id="restoreFile" accept="application/json">
    </div>
    <div class="backup-status" id="backupStatus"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2 id="sheetTitle">新增項目</h2>
      <div class="field">
        <label>圖示圖片（可選，從相簿或檔案選一張）</label>
        <div class="image-picker-row">
          <div class="image-preview" id="imagePreview">＋</div>
          <div class="image-picker-actions">
            <label class="btn pick-img" for="fImage">選擇圖片</label>
            <input type="file" id="fImage" accept="image/*" style="display:none;">
            <button type="button" class="btn clear-img" id="clearImg" style="display:none;">改用 emoji</button>
          </div>
        </div>
      </div>
      <div class="field">
        <label>或選一個 emoji 圖示</label>
        <div class="emoji-row" id="emojiRow"></div>
      </div>
      <div class="field">
        <label>顏色</label>
        <div class="swatch-row" id="swatchRow"></div>
      </div>
      <div class="field">
        <label for="fName">名稱</label>
        <input id="fName" placeholder="例如：國語字典聽寫簿學習系統">
      </div>
      <div class="field">
        <label for="fUrl">網址連結</label>
        <input id="fUrl" placeholder="https://...">
      </div>
      <div class="sheet-actions">
        <button class="btn delete" id="deleteBtn" style="display:none;">刪除</button>
        <button class="btn cancel" id="cancelBtn">取消</button>
        <button class="btn save" id="saveBtn">儲存</button>
      </div>
    </div>
  </div>

<script>
const STORAGE_KEY = 'learning-corner-icons';
const EMOJI_CHOICES = ['📖','⭐','🏃','💒','✍️','🔗','🀄','🧮','📚','🎯','🎨','🧩','📝','🔤','🕰️','📌'];
const COLOR_CHOICES = ['#ff8fa3','#ffc875','#8ecbec','#8fd9a8','#c9a9e9','#ffab76'];

const GH_USER = 'Vivian993';
const GH_REPO = 'hub';
const ghUrl = (folder) => `https://${GH_USER}.github.io/${GH_REPO}/${folder}/`;

const defaultItems = [
  { id:'d1', emoji:'📖', color:COLOR_CHOICES[0], name:'全能國語線上字典聽寫系統', url: ghUrl('ryan-libra') },
  { id:'d2', emoji:'🤖', color:COLOR_CHOICES[1], name:'AI家庭幫手', url: ghUrl('family-assistant') },
  { id:'d3', emoji:'💒', color:COLOR_CHOICES[2], name:'日常小管家', url: ghUrl('note-assistant') },
  { id:'d4', emoji:'✍️', color:COLOR_CHOICES[3], name:'魔法寫作業', url: ghUrl('note-book') },
  { id:'d5', emoji:'🌱', color:COLOR_CHOICES[4], name:'小樹苗成語故事典故', url: ghUrl('idiom-dictionary') },
  { id:'d6', emoji:'🏃', color:COLOR_CHOICES[5], name:'數學跑酷 Math Parkour', url: ghUrl('math-game') },
  { id:'d7', emoji:'🔗', color:COLOR_CHOICES[0], name:'我的捷徑', url: ghUrl('quicklinks') },
];

let items = [];
let editingId = null;
let selectedEmoji = EMOJI_CHOICES[0];
let selectedColor = COLOR_CHOICES[0];
let selectedImage = null;
let jiggleMode = false;

function resizeImageFile(file, maxSize=240, quality=0.85){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.round(w * scale);
        h = Math.round(h * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function updateImagePreview(){
  const preview = document.getElementById('imagePreview');
  const clearBtn = document.getElementById('clearImg');
  if(selectedImage){
    preview.style.backgroundImage = `url('${selectedImage}')`;
    preview.textContent = '';
    clearBtn.style.display = 'inline-block';
  } else {
    preview.style.backgroundImage = '';
    preview.textContent = '＋';
    clearBtn.style.display = 'none';
  }
}

document.getElementById('fImage').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    selectedImage = await resizeImageFile(file);
    updateImagePreview();
  }catch(err){
    alert('圖片讀取失敗，換一張試試看');
  }
  e.target.value = '';
});

document.getElementById('clearImg').addEventListener('click', () => {
  selectedImage = null;
  updateImagePreview();
});


const gridEl = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const doneBar = document.getElementById('doneBar');

async function loadItems(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    items = raw ? JSON.parse(raw) : defaultItems;
    if(!raw) saveItems();
  }catch(e){
    items = defaultItems;
  }
  render();
}

function saveItems(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }catch(e){}
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function render(){
  gridEl.innerHTML = '';
  gridEl.classList.toggle('jiggling', jiggleMode);
  doneBar.classList.toggle('show', jiggleMode);

  items.forEach(item => {
    const tw = document.createElement('div');
    tw.className = 'tile-wrap';
    const tileStyle = item.image
      ? `background-image:url('${item.image}'); background-size:cover; background-position:center;`
      : `background:${item.color || COLOR_CHOICES[0]}; color:#fdf9ef;`;
    tw.innerHTML = `
      <div class="tile" style="${tileStyle}">
        ${item.image ? '' : escapeHtml(item.emoji || '📌')}
        <div class="badge" data-id="${item.id}">✕</div>
      </div>
      <div class="label">${escapeHtml(item.name || '未命名')}</div>
    `;
    const tile = tw.querySelector('.tile');
    attachPress(tile, item);
    tw.querySelector('.badge').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteItem(item.id);
    });
    gridEl.appendChild(tw);
  });

  const addWrap = document.createElement('div');
  addWrap.className = 'tile-wrap';
  addWrap.innerHTML = `
    <div class="tile add">＋</div>
    <div class="label add-label">新增</div>
  `;
  addWrap.querySelector('.tile').addEventListener('click', () => openSheet(null));
  gridEl.appendChild(addWrap);
}

function attachPress(el, item){
  let timer = null;
  let longPressed = false;
  const start = (e) => {
    longPressed = false;
    timer = setTimeout(() => {
      longPressed = true;
      if(navigator.vibrate) navigator.vibrate(12);
      jiggleMode = true;
      render();
    }, 480);
  };
  const cancel = () => { if(timer) clearTimeout(timer); };
  const end = (e) => {
    cancel();
    if(longPressed) return;
    if(jiggleMode){
      openSheet(item);
    } else if(item.url){
      window.open(item.url, '_blank', 'noopener');
    } else {
      openSheet(item);
    }
  };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointerleave', cancel);
  el.addEventListener('pointercancel', cancel);
  el.addEventListener('contextmenu', (e) => { e.preventDefault(); jiggleMode = true; render(); });
}

document.getElementById('doneBtn').addEventListener('click', () => {
  jiggleMode = false;
  render();
});

function buildEmojiRow(){
  const row = document.getElementById('emojiRow');
  row.innerHTML = '';
  EMOJI_CHOICES.forEach(em => {
    const b = document.createElement('div');
    b.className = 'emoji-opt' + (em === selectedEmoji ? ' selected' : '');
    b.textContent = em;
    b.addEventListener('click', () => { selectedEmoji = em; buildEmojiRow(); });
    row.appendChild(b);
  });
}
function buildSwatchRow(){
  const row = document.getElementById('swatchRow');
  row.innerHTML = '';
  COLOR_CHOICES.forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch' + (c === selectedColor ? ' selected' : '');
    s.style.background = c;
    s.addEventListener('click', () => { selectedColor = c; buildSwatchRow(); });
    row.appendChild(s);
  });
}

function openSheet(item){
  editingId = item ? item.id : null;
  document.getElementById('sheetTitle').textContent = item ? '編輯這個 App' : '新增項目';
  document.getElementById('fName').value = item ? item.name : '';
  document.getElementById('fUrl').value = item ? item.url : '';
  selectedEmoji = item ? (item.emoji || EMOJI_CHOICES[0]) : EMOJI_CHOICES[0];
  selectedColor = item ? (item.color || COLOR_CHOICES[0]) : COLOR_CHOICES[0];
  selectedImage = item ? (item.image || null) : null;
  document.getElementById('deleteBtn').style.display = item ? 'block' : 'none';
  buildEmojiRow();
  buildSwatchRow();
  updateImagePreview();
  overlay.classList.add('open');
}

document.getElementById('cancelBtn').addEventListener('click', () => {
  overlay.classList.remove('open');
});
overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('open'); });

document.getElementById('saveBtn').addEventListener('click', async () => {
  const name = document.getElementById('fName').value.trim();
  if(!name){ document.getElementById('fName').focus(); return; }
  let url = document.getElementById('fUrl').value.trim();
  if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;

  if(editingId){
    const idx = items.findIndex(i => i.id === editingId);
    if(idx > -1){
      items[idx] = { ...items[idx], name, url, emoji:selectedEmoji, color:selectedColor, image:selectedImage };
    }
  } else {
    items.push({ id:'i'+Date.now(), name, url, emoji:selectedEmoji, color:selectedColor, image:selectedImage });
  }
  overlay.classList.remove('open');
  render();
  await saveItems();
});

document.getElementById('deleteBtn').addEventListener('click', async () => {
  if(editingId){
    items = items.filter(i => i.id !== editingId);
    overlay.classList.remove('open');
    render();
    await saveItems();
  }
});

async function deleteItem(id){
  items = items.filter(i => i.id !== id);
  render();
  await saveItems();
}

// --- 備份與還原 ---
const backupStatusEl = document.getElementById('backupStatus');
function showBackupStatus(msg){
  backupStatusEl.textContent = msg;
  setTimeout(() => { if(backupStatusEl.textContent === msg) backupStatusEl.textContent = ''; }, 4000);
}

document.getElementById('backupBtn').addEventListener('click', () => {
  try{
    const payload = { app:'我的百寶箱', exportedAt: new Date().toISOString(), items };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `我的百寶箱備份-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showBackupStatus('已下載備份檔案');
  }catch(err){
    showBackupStatus('下載失敗，請再試一次');
  }
});

document.getElementById('restoreBtn').addEventListener('click', () => {
  document.getElementById('restoreFile').click();
});

document.getElementById('restoreFile').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const data = JSON.parse(ev.target.result);
      const restored = Array.isArray(data) ? data : data.items;
      if(!Array.isArray(restored)) throw new Error('格式不對');
      items = restored;
      render();
      await saveItems();
      showBackupStatus('還原成功！');
    }catch(err){
      showBackupStatus('這個檔案看起來不是備份檔，還原失敗');
    }
  };
  reader.onerror = () => showBackupStatus('讀取檔案失敗');
  reader.readAsText(file);
  e.target.value = '';
});

// --- 按鍵音效 ---
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTick(freq=760, dur=0.045){
  const ctx = ensureAudio();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.12, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + dur);
}
document.body.addEventListener('pointerdown', (e) => {
  if(e.target.closest('.tile, .btn, .swatch, .emoji-opt, .badge, .done-btn, .backup-btn')){
    playTick();
  }
}, true);

loadItems();
</script>
</body>
