<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英語字卡辭典</title>
<!-- 📌 iPhone 桌面 App 圖示：把 icon.png 和這個 html 放在同一個資料夾（例如同一個 GitHub Pages 專案）就會顯示 -->
<link rel="apple-touch-icon" href="custom-icon.png">
<link rel="icon" type="image/png" href="custom-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6FAF8; --paper-deep:#EAF4EF;
    --ink:#1F3A3A; --ink-soft:#5B7370;
    --mint:#3FBF95; --mint-deep:#2FA382;
    --sky:#4FA8D8; --sky-deep:#3B8FBE;
    --coral:#FF8A65; --coral-deep:#F16F49;
    --sand:#FFF3E4;
    --line:#D9EDE5;
    --white:#FFFFFF;
    --shadow:0 4px 14px rgba(31,58,58,0.08);
    --shadow-sm:0 2px 8px rgba(31,58,58,0.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:'Noto Sans TC','Poppins',sans-serif;
    background:var(--paper); color:var(--ink);
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Poppins','Noto Sans TC',sans-serif; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',monospace;}

  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky; top:0; z-index:30; background:var(--white);
    box-shadow:var(--shadow-sm);
    padding: clamp(10px,2vh,14px) clamp(14px,3vw,26px);
    display:flex; flex-direction:column; gap:10px;
  }
  .topbar-row1{display:flex; align-items:center; justify-content:space-between; gap:14px;}
  .topbar h1{
    font-size:clamp(18px,3.4vw,24px); font-weight:800; color:var(--mint-deep);
    display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  .tabs{display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%;}
  .tab-btn{
    border:none; background:var(--paper-deep); color:var(--ink-soft); font-weight:700;
    padding:11px 6px; border-radius:14px; font-size:clamp(14px,3.6vw,17px); white-space:normal;
    line-height:1.3; transition:background .15s, color .15s;
  }
  .tab-btn.active{background:var(--mint); color:#fff;}
  .mute-btn{
    border:none; background:var(--paper-deep); width:38px; height:38px; border-radius:50%;
    font-size:16px; flex-shrink:0;
  }

  main{flex:1; display:flex; flex-direction:column; min-height:0;}
  .tab-panel{display:none; flex:1; min-height:0; flex-direction:column; padding: clamp(14px,3vw,24px);}
  .tab-panel.active{display:flex;}

  .primary-btn{
    border:none; background:var(--mint); color:#fff; font-weight:700; border-radius:12px;
    padding:11px 20px; font-size:clamp(13px,2.6vw,15px); box-shadow:var(--shadow-sm);
  }
  .primary-btn:active{transform:translateY(2px);}
  .primary-btn.small{padding:8px 14px; font-size:13px;}
  .secondary-btn{
    border:2px solid var(--mint); background:#fff; color:var(--mint-deep); font-weight:700;
    border-radius:12px; padding:9px 18px; font-size:clamp(13px,2.6vw,15px);
  }
  .secondary-btn:active{transform:translateY(2px);}
  .secondary-btn.small{padding:6px 12px; font-size:13px;}
  .ghost-btn{
    border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); font-weight:600;
    border-radius:12px; padding:8px 16px; font-size:clamp(12px,2.4vw,14px);
  }
  .ghost-btn.small{padding:5px 12px; font-size:12px;}
  .icon-btn{
    border:none; background:var(--sky); color:#fff; border-radius:10px; width:36px; height:36px;
    font-size:15px; flex-shrink:0;
  }
  .add-btn{background:var(--coral); font-size:19px; font-weight:800;}
  .add-btn:active{transform:scale(0.9);}

  /* ---------- FLASHCARDS TAB ---------- */
  .panel-toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
  .mode-toggle{display:flex; background:var(--paper-deep); border-radius:12px; padding:3px; gap:2px;}
  .mode-btn{
    border:none; background:transparent; color:var(--ink-soft); font-weight:700; border-radius:10px;
    padding:7px 12px; font-size:clamp(12px,2.4vw,14px);
  }
  .mode-btn.active{background:var(--mint); color:#fff;}
  .unit-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
  .unit-chip{
    border:none; background:var(--paper-deep); color:var(--ink-soft); font-weight:700;
    padding:7px 14px; border-radius:999px; font-size:13px; white-space:nowrap;
  }
  .unit-chip.active{background:var(--sky); color:#fff;}
  .unit-add-btn{
    border:1.5px dashed var(--line); background:transparent; color:var(--ink-soft); font-weight:700;
    padding:6px 13px; border-radius:999px; font-size:13px;
  }
  .empty-hint{color:var(--ink-soft); text-align:center; margin-top:40px; font-size:15px; display:none;}
  .card-scroll{flex:1; min-height:0; overflow-y:auto; padding-bottom:10px;}
  .card-section{margin-bottom:22px;}
  .card-section-title{
    font-size:15px; color:var(--ink-soft); margin-bottom:10px; display:flex; align-items:center; gap:8px;
  }
  .mastered-title{color:var(--mint-deep);}
  .count-badge{
    background:var(--paper-deep); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:700; color:var(--ink);
  }
  .mastered-badge{background:var(--mint); color:#fff;}
  .card-grid{
    display:flex; flex-direction:column; gap:14px;
  }
  .flash-card{
    background:#fff; border-radius:16px; box-shadow:var(--shadow-sm); padding:12px;
    display:flex; flex-direction:column; gap:8px; position:relative;
  }
  .flash-card.mastered{background:var(--paper-deep);}
  .card-top-row{display:flex; justify-content:space-between; align-items:center; gap:6px;}
  .card-master-check{
    display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); cursor:pointer;
    background:var(--paper-deep); border-radius:999px; padding:4px 9px 4px 7px;
  }
  .flash-card.mastered .card-master-check{background:var(--mint); color:#fff;}
  .card-master-check input{width:14px; height:14px; accent-color:var(--mint-deep); cursor:pointer;}
  .card-remove{
    width:24px; height:24px; border-radius:50%; flex-shrink:0;
    border:none; background:rgba(255,255,255,0.9); color:var(--coral-deep); font-size:13px; box-shadow:var(--shadow-sm);
  }
  .card-edit{
    width:24px; height:24px; border-radius:50%; flex-shrink:0;
    border:none; background:rgba(255,255,255,0.9); font-size:12px; box-shadow:var(--shadow-sm);
  }
  .icon-divider{width:1px; height:18px; background:var(--line); flex-shrink:0;}
  /* 圖卡模式：正面圖片，點擊翻面看答案 */
  .flip-card{cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .card-photo{
    width:100%; max-width:260px; margin:0 auto; aspect-ratio:1/1; border-radius:12px; background:var(--paper-deep);
    display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:34px;
    color:var(--ink-soft); position:relative; touch-action:none;
  }
  .card-photo img{width:100%; height:100%; object-fit:cover; pointer-events:none;}
  .flip-hint{
    position:absolute; bottom:6px; left:0; right:0; text-align:center; font-size:11px; color:#fff;
    background:rgba(31,58,58,0.45); padding:3px 0; pointer-events:none;
  }
  .card-answer{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:6px 2px;
    animation:cardFadeIn .25s ease;
  }
  @keyframes cardFadeIn{ from{opacity:0; transform:scale(0.94);} to{opacity:1; transform:scale(1);} }
  .card-word-big{font-weight:800; font-size:clamp(20px,4.6vw,28px); color:var(--mint-deep); line-height:1.15;}
  .card-word{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    font-weight:800; font-size:clamp(16px,3.4vw,19px); color:var(--ink);
  }
  .card-speak{border:none; background:var(--sky); color:#fff; border-radius:8px; width:30px; height:30px; font-size:13px; flex-shrink:0;}
  .card-phonetic{
    font-size:12px; color:var(--sky-deep); background:var(--paper-deep); display:inline-block;
    padding:2px 8px; border-radius:999px; width:fit-content;
  }
  .card-zh{font-size:13px; color:var(--ink-soft);}
  .card-def{font-size:12px; color:var(--ink-soft); line-height:1.4;}
  .flip-back-hint{font-size:11px; color:var(--ink-soft); opacity:0.7;}
  /* 純文字模式：一列一個單字，精簡不佔空間，方便隨時滑動複習 */
  .compact-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:2px 0; font-size:14px;
  }
  .compact-word{font-weight:800; color:var(--mint-deep); font-size:15px;}
  .compact-pos{color:var(--coral-deep); font-weight:700; font-size:12px;}
  .compact-zh{color:var(--ink); flex:1; min-width:60px;}
  .compact-speak{
    border:none; background:var(--sky); color:#fff; border-radius:7px; width:24px; height:24px;
    font-size:11px; flex-shrink:0;
  }

  /* ---------- DICTIONARY TAB ---------- */
  .dict-layout{display:flex; gap:20px; flex:1; min-height:0; flex-wrap:wrap;}
  .dict-main{flex:2; min-width:260px; display:flex; flex-direction:column; min-height:0;}
  .dir-toggle{display:flex; gap:8px; margin-bottom:10px;}
  .dir-btn{
    flex:1; border:none; background:var(--paper-deep); color:var(--ink-soft); font-weight:700;
    padding:9px 6px; border-radius:12px; font-size:clamp(12px,2.6vw,14px);
  }
  .dir-btn.active{background:var(--sky); color:#fff;}
  .search-row{display:flex; gap:8px; margin-bottom:14px;}
  .search-row input{
    flex:1; border:2px solid var(--line); border-radius:12px; padding:11px 14px;
    font-size:clamp(14px,2.8vw,16px); outline:none; background:#fff;
  }
  .search-row input:focus{border-color:var(--mint);}
  .search-row button{
    border:none; background:var(--mint); color:#fff; border-radius:12px; padding:0 18px; font-weight:700;
    font-size:clamp(13px,2.6vw,15px);
  }
  .dict-result{flex:1; overflow-y:auto; background:#fff; border-radius:16px; padding:18px; box-shadow:var(--shadow-sm); min-height:120px;}
  .dict-placeholder{color:var(--ink-soft); text-align:center; padding:30px 10px; font-size:14px;}
  .dict-notfound{color:var(--coral-deep); text-align:center; padding:30px 10px; font-size:14px;}
  .dict-word-row{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .dict-word-row h2{font-size:clamp(24px,5vw,32px); color:var(--mint-deep);}
  .phonetic-chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--paper-deep); color:var(--sky-deep);
    border-radius:999px; padding:5px 12px; font-size:14px; margin-bottom:14px;
  }
  .dict-image-slot{margin:2px 0 14px;}
  .dict-image-slot img{
    display:block; max-width:100%; max-height:200px; border-radius:14px; box-shadow:var(--shadow-sm);
  }
  .dict-image-credit{font-size:11px; color:var(--ink-soft); opacity:0.7; margin-top:4px;}
  .dict-zh-line{
    font-size:19px; font-weight:800; color:var(--mint-deep); background:var(--paper-deep);
    border-radius:12px; padding:12px 14px; margin-bottom:12px; line-height:1.4;
    border:2px solid var(--mint);
  }
  .dict-pos{
    display:inline-block; background:var(--sand); color:var(--coral-deep); font-weight:700; font-size:13px;
    border-radius:8px; padding:3px 10px; margin:10px 0 6px;
  }
  .dict-pos-abbr{font-weight:800; font-family:'JetBrains Mono',monospace;}
  .dict-defs{margin:0 0 4px; padding-left:20px;}
  .dict-defs li{margin-bottom:10px; font-size:14px; line-height:1.5;}
  .dict-def-block{font-size:14px; line-height:1.6; margin-bottom:6px;}
  .dict-example{color:var(--ink-soft); font-style:italic; font-size:13px; margin-top:2px;}
  .sentence-speak-btn{
    border:none; background:var(--sky); color:#fff; border-radius:7px; width:22px; height:22px;
    font-size:10px; margin-right:4px; flex-shrink:0; vertical-align:middle;
  }
  .click-word{
    cursor:pointer; border-bottom:1.5px dotted var(--sky-deep);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .click-word:active{background:var(--paper-deep);}
  .word-tip{
    display:inline-block; background:var(--sky); color:#fff; font-size:11px; font-style:normal;
    border-radius:6px; padding:1px 7px; margin-left:3px; vertical-align:middle; white-space:nowrap;
  }
  .dict-def-zh{color:var(--sky-deep); font-size:13px; font-style:normal; margin-top:2px;}
  .zh-meta-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .zh-meta-chip{
    background:var(--paper-deep); color:var(--ink-soft); font-size:12px; font-weight:700;
    border-radius:999px; padding:4px 11px;
  }
  .zh-bopomofo-row{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
  .zh-pinyin{color:var(--ink-soft); font-size:13px;}
  .zh-evolution-box{
    margin-top:16px; background:var(--sand); border-radius:14px; padding:14px 16px;
  }
  .zh-evolution-title{font-weight:700; color:var(--coral-deep); margin-bottom:6px; font-size:14px;}
  .zh-evolution-text{font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin-bottom:10px;}
  .zh-evolution-hint{font-size:11px; color:var(--ink-soft); opacity:0.75; margin-top:6px;}
  .dict-history{
    flex:1; min-width:180px; max-width:260px; background:#fff; border-radius:16px; padding:14px;
    box-shadow:var(--shadow-sm); display:flex; flex-direction:column; max-height:70vh;
  }
  .dict-history h3{font-size:15px; margin-bottom:8px; color:var(--ink-soft);}
  #historyList{list-style:none; margin:0; padding:0; overflow-y:auto; flex:1;}
  #historyList li{
    padding:8px 10px; border-radius:10px; cursor:pointer; font-size:14px; margin-bottom:4px;
    display:flex; justify-content:space-between; align-items:center;
  }
  #historyList li:hover{background:var(--paper-deep);}

  /* ---------- ROOTS TAB ---------- */
  .root-toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
  .root-cat-tabs{display:flex; gap:6px;}
  .cat-btn{
    border:none; background:var(--paper-deep); color:var(--ink-soft); font-weight:700;
    padding:8px 16px; border-radius:999px; font-size:13px;
  }
  .cat-btn.active{background:var(--coral); color:#fff;}
  #rootSearch{
    flex:1; min-width:160px; border:2px solid var(--line); border-radius:999px; padding:9px 16px;
    font-size:14px; outline:none;
  }
  #rootSearch:focus{border-color:var(--coral);}
  .root-list{
    flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:12px; align-content:start; padding-bottom:20px;
  }
  .root-card{background:#fff; border-radius:14px; padding:14px 16px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column;}
  .root-affix{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px; color:var(--coral-deep);}
  .root-meaning{font-size:13px; color:var(--ink-soft); margin:4px 0 6px;}
  .root-origin{
    font-size:11.5px; color:var(--sky-deep); background:var(--paper-deep); border-radius:8px;
    padding:5px 9px; margin-bottom:8px; line-height:1.4;
  }
  .root-examples{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .root-ex{
    background:var(--paper-deep); border-radius:8px; padding:4px 9px; font-size:12px; cursor:pointer;
  }
  .root-ex:hover{background:var(--mint); color:#fff;}
  .root-note{
    width:100%; border:1.5px dashed var(--line); border-radius:10px; padding:8px 10px; font-size:12px;
    font-family:inherit; color:var(--ink); resize:vertical; min-height:38px; outline:none; background:var(--sand);
  }
  .root-note:focus{border-color:var(--coral);}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(31,58,58,0.45); z-index:50;
    align-items:center; justify-content:center; padding:16px;
  }
  .modal-overlay.active{display:flex;}
  .modal-box{
    background:#fff; border-radius:20px; padding:24px; width:100%; max-width:380px;
    display:flex; flex-direction:column; gap:12px; max-height:90vh; overflow-y:auto;
  }
  .modal-box h2{font-size:19px; text-align:center; color:var(--mint-deep);}
  .modal-photo{
    width:120px; height:120px; border-radius:16px; background:var(--paper-deep); margin:0 auto;
    display:flex; align-items:center; justify-content:center; font-size:34px; cursor:grab; overflow:hidden;
    touch-action:none;
  }
  .modal-photo img{width:100%; height:100%; object-fit:cover; pointer-events:none;}
  .text-input{
    border:2px solid var(--line); border-radius:12px; padding:11px 14px; font-size:15px; outline:none;
  }
  .text-input:focus{border-color:var(--mint);}
  .modal-word-row{display:flex; justify-content:center;}
  .unit-select-label{font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px;}
  .modal-buttons{display:flex; gap:10px; margin-top:4px;}
  .modal-buttons button{flex:1;}

  /* ---------- PRACTICE MODE ---------- */
  .practice-overlay{
    display:none; position:fixed; inset:0; background:var(--paper); z-index:60;
    flex-direction:column; padding:clamp(14px,3vw,26px);
  }
  .practice-overlay.active{display:flex;}
  .practice-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
  .practice-progress{font-weight:700; color:var(--ink-soft);}
  .practice-card{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    text-align:center;
  }
  .practice-image{
    width:min(60vw,260px); aspect-ratio:1/1; border-radius:20px; background:var(--paper-deep);
    display:flex; align-items:center; justify-content:center; font-size:60px; overflow:hidden; box-shadow:var(--shadow);
  }
  .practice-image img{width:100%; height:100%; object-fit:cover;}
  .practice-word{font-size:clamp(28px,7vw,44px); font-weight:800; color:var(--mint-deep);}
  .practice-meaning{display:flex; flex-direction:column; gap:6px; align-items:center;}
  .practice-phonetic{font-family:'JetBrains Mono',monospace; color:var(--sky-deep);}
  .practice-def{max-width:420px; font-size:14px; color:var(--ink-soft);}
  .practice-controls{display:flex; gap:14px; justify-content:center; padding:20px 0;}
  .know-btn{
    border:none; border-radius:999px; padding:14px 26px; font-weight:800; font-size:16px; color:#fff;
    box-shadow:var(--shadow-sm);
  }
  .know-btn:active{transform:translateY(3px);}
  .know-btn.unknown{background:var(--coral);}
  .know-btn.known{background:var(--mint);}
  .summary-box{text-align:center;}
  .summary-box h2{font-size:26px; color:var(--mint-deep); margin-bottom:10px;}
  .summary-stats{display:flex; gap:20px; justify-content:center; margin:16px 0;}
  .summary-stat{background:#fff; border-radius:14px; padding:14px 22px; box-shadow:var(--shadow-sm);}
  .summary-stat .num{font-size:28px; font-weight:800;}
  .summary-buttons{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="topbar-row1">
      <h1>📘 英語字卡辭典</h1>
      <button class="mute-btn" id="btnMute">🔊</button>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="flashcards">📇 我的字卡</button>
      <button class="tab-btn" data-tab="dictionary">📖 查字典</button>
      <button class="tab-btn" data-tab="roots">🌳 字根字首字尾</button>
      <button class="tab-btn" data-tab="chinese">🀄 國語辭典</button>
    </nav>
  </div>

  <main>

    <!-- ============ 字卡 ============ -->
    <section id="tab-flashcards" class="tab-panel active">
      <div class="panel-toolbar">
        <button id="btnAddCard" class="primary-btn">＋ 新增字卡</button>
        <button id="btnPractice" class="secondary-btn">🎯 開始練習</button>
        <div class="mode-toggle" id="modeToggle">
          <button class="mode-btn active" data-mode="picture">🖼️ 圖卡模式</button>
          <button class="mode-btn" data-mode="text">🔤 純文字模式</button>
        </div>
        <button id="btnExportCards" class="ghost-btn">💾 匯出備份</button>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- */
/* 共用：靜音 / 語音                                                  */
/* ---------------------------------------------------------------- */
let muted = false;

function updateMuteIcon(){
  document.getElementById('btnMute').textContent = muted ? '🔇' : '🔊';
}
document.getElementById('btnMute').addEventListener('click', ()=>{ muted=!muted; updateMuteIcon(); });

function primeSpeech(){
  if(!('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance('\u00A0');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
['pointerdown','touchstart','click'].forEach(evt=>{
  document.addEventListener(evt, function unlock(){ primeSpeech(); }, {once:true});
});

function speak(text, lang){
  if(muted || !text) return;
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    u.rate = 0.88;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function speakWithAudio(word, audioUrl){
  // 改用手機內建語音，速度快很多；線上發音檔案常常要等網路下載，會延遲好幾秒
  speak(word, 'en-US');
}

/* UI 按鍵音效（跟著右上角靜音鍵一起控制） */
let clickAudioCtx = null;
function playClick(){
  if(muted) return;
  try{
    if(!clickAudioCtx) clickAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(clickAudioCtx.state==='suspended') clickAudioCtx.resume();
    const ctx = clickAudioCtx;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, t0);
    osc.frequency.exponentialRampToValueAtTime(600, t0+0.08);
    gain.gain.setValueAtTime(0.12, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.09);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0); osc.stop(t0+0.1);
  }catch(e){}
}
document.body.addEventListener('click', (e)=>{
  if(e.target.closest('button')) playClick();
}, true);

/* ---------------------------------------------------------------- */
/* Tab 切換                                                          */
/* ---------------------------------------------------------------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});
function switchTab(name){
  document.querySelector(`.tab-btn[data-tab="${name}"]`).click();
}

/* ---------------------------------------------------------------- */
/* 字卡狀態與渲染                                                     */
/* ---------------------------------------------------------------- */
let flashcards = [];
let idCounter = 0;
let editingCardId = null;
let viewMode = 'picture'; // 'picture'（圖卡，翻面看答案）｜ 'text'（純文字，一行式精簡列表）
let flippedCards = new Set(); // 目前翻到背面（顯示答案）的圖卡 id

/* 單元（可以自己新增，例如「數字」「L1 open your book」），用來把字卡分組 */
let units = [{id:'u0', name:'未分類'}];
let currentUnitId = 'u0';
let unitIdCounter = 1;

const POS_ABBR = {
  noun:'n.', verb:'v.', adjective:'adj.', adverb:'adv.', pronoun:'pron.',
  preposition:'prep.', conjunction:'conj.', interjection:'interj.', determiner:'det.',
  exclamation:'interj.', numeral:'num.', article:'art.'
};
function posAbbr(pos){ return POS_ABBR[(pos||'').toLowerCase()] || (pos||''); }

function renderUnitBar(){
  const bar = document.getElementById('unitBar');
  bar.innerHTML = '';
  units.forEach(u=>{
    const btn = document.createElement('button');
    btn.className = 'unit-chip' + (u.id===currentUnitId ? ' active' : '');
    btn.textContent = u.name;
    btn.addEventListener('click', ()=>{ currentUnitId = u.id; renderCardGrid(); renderUnitBar(); });
    bar.appendChild(btn);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'unit-add-btn';
  addBtn.textContent = '＋ 新增單元';
  addBtn.addEventListener('click', ()=>{
    const name = prompt('請輸入單元名稱，例如「數字」或「L1 open your book」：');
    if(name && name.trim()){
      const u = {id:'u'+(unitIdCounter++), name:name.trim()};
      units.push(u);
      currentUnitId = u.id;
      renderUnitBar();
      renderCardGrid();
    }
  });
  bar.appendChild(addBtn);
}
renderUnitBar();

document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    viewMode = btn.dataset.mode;
    flippedCards.clear();
    renderCardGrid();
  });
});

function cardFaceHTML(card, showAnswer){
  if(viewMode === 'text' || showAnswer){
    return `
      <div class="card-answer">
        <div class="card-word-big">${escapeHtml(card.word)}</div>
        ${card.phonetic ? `<div class="card-phonetic mono">${escapeHtml(card.phonetic)}</div>` : ''}
        ${card.zh ? `<div class="card-zh">${escapeHtml(card.zh)}</div>` : ''}
        ${viewMode==='picture' ? `<div class="flip-back-hint">👆 點一下看圖片</div>` : ''}
      </div>
    `;
  }
  return `
    <div class="card-photo" data-id="${card.id}">
      ${card.image ? `<img src="${card.image}" style="object-position:${card.posX||50}% ${card.posY||50}%">` : '📷'}
      <div class="flip-hint">👆 點一下看答案</div>
    </div>
  `;
}

function renderCardGrid(){
  const unitCards = flashcards.filter(c => (c.unitId||'u0') === currentUnitId);
  document.getElementById('cardEmptyHint').style.display = flashcards.length ? 'none' : 'block';
  const learning = unitCards.filter(c=>!c.mastered);
  const mastered = unitCards.filter(c=>c.mastered);
  document.getElementById('learningCount').textContent = learning.length;
  document.getElementById('masteredCount').textContent = mastered.length;
  renderCardsInto('cardGridLearning', learning);
  renderCardsInto('cardGridMastered', mastered);
}

function renderCardsInto(gridId, list){
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';

  if(viewMode === 'text'){
    list.forEach(card=>{
      const el = document.createElement('div');
      el.className = 'compact-row' + (card.mastered ? ' mastered' : '');
      el.dataset.id = card.id;
      el.innerHTML = `
        <label class="card-master-check">
          <input type="checkbox" data-id="${card.id}" ${card.mastered?'checked':''}>
        </label>
        <span class="compact-word">${escapeHtml(card.word)}</span>
        ${card.pos ? `<span class="compact-pos">(${escapeHtml(card.pos)})</span>` : ''}
        <span class="compact-zh">${escapeHtml(card.zh||'')}</span>
        <button class="compact-speak" data-id="${card.id}">🔊</button>
        <button class="card-edit" data-id="${card.id}">✏️</button>
        <button class="card-remove" data-id="${card.id}">✕</button>
      `;
      grid.appendChild(el);
    });
    grid.querySelectorAll('.compact-speak').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const card = flashcards.find(c=>c.id===btn.dataset.id);
        if(card) speak(card.word, 'en-US');
      });
    });
  } else {
    list.forEach(card=>{
      const showAnswer = flippedCards.has(card.id);
      const el = document.createElement('div');
      el.className = 'flash-card' + (card.mastered ? ' mastered' : '');
      el.dataset.id = card.id;
      el.innerHTML = `
        <div class="card-top-row">
          <label class="card-master-check">
            <input type="checkbox" data-id="${card.id}" ${card.mastered?'checked':''}> 已背熟
          </label>
          <div style="display:flex; gap:12px; align-items:center;">
            <button class="card-edit" data-id="${card.id}">✏️</button>
            <button class="card-speak" data-id="${card.id}">🔊</button>
            <span class="icon-divider"></span>
            <button class="card-remove" data-id="${card.id}">✕</button>
          </div>
        </div>
        ${cardFaceHTML(card, showAnswer)}
      `;
      grid.appendChild(el);
      const photoEl = el.querySelector('.card-photo');
      if(photoEl) enableDrag(photoEl, flashcards);
    });
    grid.querySelectorAll('.card-speak').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const card = flashcards.find(c=>c.id===btn.dataset.id);
        if(card) speak(card.word, 'en-US');
      });
    });
  }

  grid.querySelectorAll('.card-edit').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openAddModal(btn.dataset.id);
    });
  });
  grid.querySelectorAll('.card-remove').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      flashcards = flashcards.filter(c=>c.id!==btn.dataset.id);
      flippedCards.delete(btn.dataset.id);
      renderCardGrid();
    });
  });
  grid.querySelectorAll('.card-master-check').forEach(label=>{
    label.addEventListener('click', (e)=> e.stopPropagation());
  });
  grid.querySelectorAll('.card-master-check input').forEach(input=>{
    input.addEventListener('change', ()=>{
      playClick();
      const card = flashcards.find(c=>c.id===input.dataset.id);
      if(card) card.mastered = input.checked;
      renderCardGrid();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 讓照片可以在框內拖曳調整位置 */
function enableDrag(circle, dataList){
  const img = circle.querySelector('img');
  if(!img) return;
  let dragging=false, startX=0, startY=0, startPosX=50, startPosY=50;
  const findItem = ()=> dataList.find(c=>c.id===circle.dataset.id);
  const onDown = (ev)=>{
    const item = findItem(); if(!item) return;
    dragging = true; circle.dataset.dragged='0';
    const pt = ev.touches? ev.touches[0] : ev;
    startX=pt.clientX; startY=pt.clientY;
    startPosX = item.posX||50; startPosY = item.posY||50;
    // 這裡故意不 preventDefault：如果一開始就擋掉，手機上單純「點一下」(沒有拖曳移動) 的 click 事件
    // 會被吃掉，導致翻卡功能失效。要等確定使用者真的在拖曳移動時才擋掉（見 onMove）。
  };
  const onMove = (ev)=>{
    if(!dragging) return;
    const item = findItem(); if(!item) return;
    const pt = ev.touches? ev.touches[0] : ev;
    const dx = pt.clientX-startX, dy = pt.clientY-startY;
    if(Math.abs(dx)>3||Math.abs(dy)>3){
      circle.dataset.dragged='1';
      if(ev.cancelable) ev.preventDefault(); // 確定是拖曳才擋掉預設行為（避免頁面跟著滾動）
    }
    const rect = circle.getBoundingClientRect();
    const newX = Math.min(100, Math.max(0, startPosX-(dx/rect.width)*100));
    const newY = Math.min(100, Math.max(0, startPosY-(dy/rect.height)*100));
    item.posX=newX; item.posY=newY;
    img.style.objectPosition = `${newX}% ${newY}%`;
  };
  const onUp = ()=>{ dragging=false; };
  circle.addEventListener('mousedown', onDown);
  circle.addEventListener('touchstart', onDown, {passive:true});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
}

/* ---------------------------------------------------------------- */
/* 新增 / 編輯字卡 Modal                                              */
/* ---------------------------------------------------------------- */
let modalPhotoData = null;
let modalPosX = 50, modalPosY = 50;

function openAddModal(cardId){
  editingCardId = cardId || null;
  const modal = document.getElementById('addCardModal');
  const titleEl = document.getElementById('modalTitle');
  const wordInput = document.getElementById('modalWordInput');
  const zhInput = document.getElementById('modalZhInput');
  const posInput = document.getElementById('modalPosInput');
  const unitSelect = document.getElementById('modalUnitSelect');
  const photoCircle = document.getElementById('modalPhotoCircle');

  unitSelect.innerHTML = units.map(u=>`<option value="${u.id}">${escapeHtml(u.name)}</option>`).join('');

  if(editingCardId){
    const card = flashcards.find(c=>c.id===editingCardId);
    titleEl.textContent = '編輯字卡';
    wordInput.value = card.word || '';
    zhInput.value = card.zh || '';
    posInput.value = card.pos || '';
    unitSelect.value = card.unitId || currentUnitId;
    document.getElementById('modalUnitRow').style.display = 'block';
    modalPhotoData = card.image || null;
    modalPosX = card.posX||50; modalPosY = card.posY||50;
    photoCircle.innerHTML = modalPhotoData ? `<img src="${modalPhotoData}" style="object-position:${modalPosX}% ${modalPosY}%">` : '📷';
  } else {
    titleEl.textContent = '新增字卡';
    wordInput.value = ''; zhInput.value = ''; posInput.value = '';
    unitSelect.value = currentUnitId;
    document.getElementById('modalUnitRow').style.display = 'none'; // 新增時直接用目前選中的單元，不用每次都選一次
    modalPhotoData = null; modalPosX=50; modalPosY=50;
    photoCircle.innerHTML = '📷';
  }
  modal.classList.add('active');
  enableDrag(photoCircle, [{id:'modal', get posX(){return modalPosX;}, set posX(v){modalPosX=v;}, get posY(){return modalPosY;}, set posY(v){modalPosY=v;}}]);
  photoCircle.dataset.id = 'modal';
}

document.getElementById('btnAddCard').addEventListener('click', ()=> openAddModal(null));
document.getElementById('modalCancelBtn').addEventListener('click', ()=>{
  document.getElementById('addCardModal').classList.remove('active');
});
document.getElementById('modalUploadBtn').addEventListener('click', ()=>{
  document.getElementById('modalPhotoInput').click();
});
document.getElementById('modalPhotoInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    modalPhotoData = ev.target.result;
    modalPosX=50; modalPosY=50;
    document.getElementById('modalPhotoCircle').innerHTML = `<img src="${modalPhotoData}" style="object-position:50% 50%">`;
  };
  reader.readAsDataURL(file);
});
document.getElementById('modalSpeakBtn').addEventListener('click', ()=>{
  const word = document.getElementById('modalWordInput').value.trim();
  if(word) speak(word, 'en-US');
});

document.getElementById('modalSaveBtn').addEventListener('click', async ()=>{
  const word = document.getElementById('modalWordInput').value.trim();
  const zh = document.getElementById('modalZhInput').value.trim();
  const posManual = document.getElementById('modalPosInput').value.trim();
  const unitId = document.getElementById('modalUnitSelect').value;
  if(!word){ alert('請輸入英文單字'); return; }

  let card;
  if(editingCardId){
    card = flashcards.find(c=>c.id===editingCardId);
  } else {
    card = {id:'c'+(idCounter++), word:'', zh:'', pos:'', image:null, phonetic:'', definition:'', audioUrl:'', posX:50, posY:50, mastered:false, unitId: currentUnitId};
    flashcards.push(card);
  }
  card.word = word;
  card.zh = zh;
  card.pos = posManual;
  card.unitId = unitId;
  card.image = modalPhotoData;
  card.posX = modalPosX;
  card.posY = modalPosY;

  document.getElementById('addCardModal').classList.remove('active');
  renderCardGrid();
  speak(word, 'en-US');

  // 背景嘗試查字典 API，自動補上音標和簡短字義（不影響操作，找不到就略過；詞性若使用者已手動填寫則不覆蓋）
  try{
    const data = await fetchDictionary(word);
    if(data){
      const entry = data[0];
      card.phonetic = entry.phonetic || (entry.phonetics.find(p=>p.text)||{}).text || '';
      card.audioUrl = (entry.phonetics.find(p=>p.audio)||{}).audio || '';
      card.definition = entry.meanings?.[0]?.definitions?.[0]?.definition || '';
      if(!posManual) card.pos = posAbbr(entry.meanings?.[0]?.partOfSpeech);
      renderCardGrid();
    }
  }catch(e){ /* 查不到就算了，不影響字卡本身 */ }
});

/* ---------------------------------------------------------------- */
/* 匯出 / 匯入 字卡備份                                               */
/* ---------------------------------------------------------------- */
document.getElementById('btnExportCards').addEventListener('click', ()=>{
  try{
    const json = JSON.stringify({exportedAt:new Date().toISOString(), flashcards, rootNotes, units}, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `英語字卡備份_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){ alert('匯出失敗，請再試一次。'); }
});
document.getElementById('btnImportCards').addEventListener('click', ()=>{
  document.getElementById('importCardsFile').click();
});
document.getElementById('importCardsFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      const imported = Array.isArray(data.flashcards) ? data.flashcards : (Array.isArray(data)?data:null);
      if(!imported) throw new Error('格式錯誤');
      flashcards = imported;
      flashcards.forEach(c=>{
        if(typeof c.mastered !== 'boolean') c.mastered = false;
        if(!c.unitId) c.unitId = 'u0';
        if(!c.pos) c.pos = '';
      });
      if(data.rootNotes && typeof data.rootNotes === 'object') rootNotes = data.rootNotes;
      if(Array.isArray(data.units) && data.units.length) units = data.units;
      currentUnitId = units[0].id;
      let maxId = 0;
      flashcards.forEach(c=>{ const m=/c(\d+)/.exec(c.id||''); if(m) maxId=Math.max(maxId,parseInt(m[1],10)); });
      idCounter = maxId+1;
      let maxUnitId = 0;
      units.forEach(u=>{ const m=/u(\d+)/.exec(u.id||''); if(m) maxUnitId=Math.max(maxUnitId,parseInt(m[1],10)); });
      unitIdCounter = maxUnitId+1;
      renderUnitBar();
      renderCardGrid();
      renderRoots();
    }catch(err){ alert('匯入失敗，請確認是這個工具匯出的備份檔。'); }
    e.target.value = '';
  };
  reader.readAsText(file);
});

const dictCache = {};
let dictHistory = []; // {text, dir}

/* 所有網路查詢都用這個包一層逾時保護，避免網路不好時畫面一直卡著 */
async function fetchWithTimeout(url, ms=8000){
  const controller = new AbortController();
  const timer = setTimeout(()=> controller.abort(), ms);
  try{
    return await fetch(url, {signal: controller.signal});
  } finally {
    clearTimeout(timer);
  }
}

/* 中英翻譯（MyMemory，免費、不需金鑰） */
const translateCache = {};
async function translateText(text, langpair){
  text = (text||'').trim();
  if(!text) return '';
  const key = langpair+'::'+text;
  if(translateCache[key] !== undefined) return translateCache[key];
  try{
    const res = await fetchWithTimeout(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`, 6000);
    if(!res.ok) return '';
    const data = await res.json();
    const t = data?.responseData?.translatedText || '';
    // MyMemory 找不到時常回傳英文原句或錯誤字樣，簡單過濾一下
    const clean = /MYMEMORY WARNING|INVALID/i.test(t) ? '' : t;
    translateCache[key] = clean;
    return clean;
  }catch(e){ return ''; }
}

const POS_ZH = {
  noun:'名詞', verb:'動詞', adjective:'形容詞', adverb:'副詞', pronoun:'代名詞',
  preposition:'介系詞', conjunction:'連接詞', interjection:'感嘆詞', determiner:'限定詞',
  exclamation:'感嘆詞', numeral:'數詞', article:'冠詞'
};
function posZh(pos){ return POS_ZH[(pos||'').toLowerCase()] || pos || ''; }

/* 把例句中的英文單字包成可以點擊查意思的元素，標點符號與空白維持原樣 */
function makeClickableSentence(sentence){
  return sentence.split(/([A-Za-z]+(?:'[A-Za-z]+)?)/g).map(part=>{
    if(/^[A-Za-z]+(?:'[A-Za-z]+)?$/.test(part)){
      return `<span class="click-word" data-word="${escapeHtml(part)}">${escapeHtml(part)}</span>`;
    }
    return escapeHtml(part);
  }).join('');
}

const CURATED_WORDS = {

    phonetic: '/ˈfʌb.ɚ/',
    phonetics: [],
    meanings: [{
      partOfSpeech: 'noun',

        example: "Everyone at the table was on their phones — total phubbers, all of them."
      }]
    }]
  }],

    phonetics: [],
    meanings: [{

        example: "Phubbing can make the people you're with feel unimportant."
      }]

};

async function fetchDictionary(word){
  word = word.trim().toLowerCase();
  if(!word) return null;
  if(dictCache[word]) return dictCache[word];
  const url = `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`;
  let lastErr = null;
  for(let attempt=0; attempt<2; attempt++){
    try{
      const res = await fetchWithTimeout(url);
      if(res.status === 404) throw new Error('NOT_FOUND');
      if(!res.ok) throw new Error('NETWORK');
      const data = await res.json();
      dictCache[word] = data;
      return data;
    }catch(err){
      lastErr = err;
      if(err.message === 'NOT_FOUND') break; // 找不到這個字就不用重試
      await new Promise(r=>setTimeout(r, 500)); // 網路問題稍等一下再試一次
    }
  }
  throw lastErr || new Error('NETWORK');
}

/* 用 Openverse（開放版權圖庫，已過濾成人內容）找一張相關的圖片，找不到就靜靜跳過 */
async function fetchWordImage(word){
  try{
    const res = await fetchWithTimeout(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(word)}&page_size=3&mature=false`, 6000);
    if(!res.ok) return null;
    const data = await res.json();
    const hit = (data.results||[]).find(r=> r.thumbnail || r.url);
    if(!hit) return null;
    return { thumb: hit.thumbnail || hit.url, source: hit.source || hit.provider || '', link: hit.foreign_landing_url || hit.url };
  }catch(e){ return null; }
}

let dictSearching = false;

  if(dictSearching) return; // 避免連續按太多次同時送出好幾個查詢

  if(!raw) return;
  dictSearching = true;

  try{
    if(dictDirection === 'zh-en'){
      document.getElementById('dictResult').innerHTML = `<div class="dict-placeholder">🔎 翻譯中...</div>`;
      const en = await translateText(raw, 'zh-TW|en');
      if(!en){
        document.getElementById('dictResult').innerHTML = `<div class="dict-notfound">😕 目前無法翻譯<br>請確認網路連線後再試一次。</div>`;

async function lookupWord(word, knownZh){
  word = word.trim();
  if(!word) return;
  document.getElementById('dictResult').innerHTML = `<div class="dict-placeholder">🔎 查詢中...</div>`;
  try{
    const data = await fetchDictionary(word);
    renderDictResult(data, knownZh);
    addHistory(word.toLowerCase(), 'en-zh');
  }catch(e){
    if(e.message === 'NOT_FOUND'){
      const curated = CURATED_WORDS[word.trim().toLowerCase()];
      if(curated){
        renderDictResult(curated, knownZh);
        addHistory(word.toLowerCase(), 'en-zh');
      } else {
        renderDictNotFound(word, false);
      }
    } else {
      renderDictNotFound(word, true);
    }
  }
}

function renderDictResult(data, knownZh){
  const entry = data[0];
  const phoneticText = entry.phonetic || (entry.phonetics.find(p=>p.text)||{}).text || '';
  const audioUrl = (entry.phonetics.find(p=>p.audio)||{}).audio || '';

  // 免費字典 API 有時候會把同一個字的不同字源（homograph）拆成好幾筆分開的資料，
  // 如果只取 data[0]，可能剛好抓到比較少見的意思，而不是孩子最常用到的那個。
  // 這裡把所有筆數的詞性都合併起來，並且優先顯示「有附例句」的（通常代表資料比較完整、也是比較常用的意思）。
  const allMeanings = data.flatMap(e => e.meanings || []);
  const sortedMeanings = [...allMeanings].sort((a,b)=>{
    const aScore = (a.definitions||[]).filter(d=>d.example).length;
    const bScore = (b.definitions||[]).filter(d=>d.example).length;
    return bScore - aScore;
  });
  const meanings = sortedMeanings.slice(0,3);

  let html = `
    <div class="dict-word-row">
      <h2>${escapeHtml(entry.word)}</h2>
      <button class="icon-btn" id="dictSpeakBtn">🔊</button>
      <button class="icon-btn add-btn" id="dictAddCardBtn" title="加入我的字卡">＋</button>
    </div>
    ${phoneticText ? `<div class="phonetic-chip mono">${escapeHtml(phoneticText)}</div>` : ''}
    <div class="dict-zh-line" id="dictZhLine">${knownZh ? `🈶 中文意思：${escapeHtml(knownZh)}` : '🈶 中文意思查詢中...'}</div>
    <div class="dict-image-slot" id="dictImageSlot"></div>
  `;
  meanings.forEach((m, mi)=>{
    const defs = m.definitions||[];
    // 優先選有例句的那一則定義，這樣孩子可以直接看到怎麼使用；都沒有例句就用第一則
    const chosen = defs.find(d=>d.example) || defs[0] || {};
    html += `
      <div class="dict-pos"><span class="dict-pos-abbr">${escapeHtml(posAbbr(m.partOfSpeech))}</span> ${escapeHtml(posZh(m.partOfSpeech))}</div>
      <div class="dict-def-block">
        <div>${escapeHtml(chosen.definition||'')}</div>
        <div class="dict-def-zh" id="defZh_${mi}_0">中文翻譯中...</div>
        ${chosen.example ? `<div class="dict-example"><button class="sentence-speak-btn" data-sentence="${escapeHtml(chosen.example)}" title="唸整句">🔊</button> e.g. ${makeClickableSentence(chosen.example)}<div class="dict-def-zh" id="exZh_${mi}_0">例句翻譯中...</div></div>` : ''}
      </div>
    `;
  });

  const resultEl = document.getElementById('dictResult');
  resultEl.innerHTML = html;
  document.getElementById('dictSpeakBtn').addEventListener('click', ()=> speakWithAudio(entry.word, audioUrl));
  document.getElementById('dictAddCardBtn').addEventListener('click', ()=>{
    const imgTag = document.getElementById('dictImageSlot')?.querySelector('img');
    const zhLine = document.getElementById('dictZhLine')?.textContent.replace('🈶 中文意思：','').replace('🈶 中文意思查詢中...','').trim();
    const card = {
      id:'c'+(idCounter++), word:entry.word, zh: zhLine || knownZh || '', pos: posAbbr(meanings?.[0]?.partOfSpeech), image: imgTag ? imgTag.src : null, posX:50, posY:50,
      phonetic:phoneticText, audioUrl, mastered:false, unitId: currentUnitId,
      definition: meanings?.[0]?.definitions?.[0]?.definition || ''
    };
    flashcards.push(card);
    renderCardGrid();
    switchTab('flashcards');
  });

  // 背景載入一張相關圖片，加上詞性當作上下文，減少同形異義字配到不相關圖片的機率
  // （不過像「leave」這種抽象動作動詞，本來就很難用照片準確表達，這是圖庫搜尋本身的限制）
  const imgQuery = meanings[0]?.partOfSpeech ? `${entry.word} ${meanings[0].partOfSpeech}` : entry.word;
  fetchWordImage(imgQuery).then(img=>{
    const slot = document.getElementById('dictImageSlot');
    if(!slot || !img) return;
    slot.innerHTML = `
      <img src="${img.thumb}" alt="${escapeHtml(entry.word)}" loading="lazy">
      <div class="dict-image-credit">圖片來源：${escapeHtml(img.source||'Openverse')}（開放版權圖庫，僅供參考，如果不合適請自行上傳照片）</div>
    `;
  });

  // 背景翻譯：中文意思標題用「字典定義」翻譯
  // （試過用同義字個別翻譯，結果同義字資料庫常常包含比較少見、甚至過時的用法，
  //   單獨翻譯反而更容易翻錯，例如 move 曾經翻成「攪拌」；改回翻譯定義句，相對穩定）
  if(!knownZh){
    const primaryDef = meanings[0]?.definitions?.[0];
    const textForHeadline = primaryDef?.definition || entry.word;
    translateText(textForHeadline, 'en|zh-TW').then(zh=>{
      const el = document.getElementById('dictZhLine');
      if(!el) return;
      if(!zh){ el.textContent = '（找不到中文翻譯，請參考下方定義翻譯）'; return; }
      el.textContent = `🈶 中文意思：${zh}`;
    });
  }
  // 背景翻譯：每個詞性選出的那一則定義與例句
  meanings.forEach((m, mi)=>{
    const defs = m.definitions||[];
    const chosen = defs.find(d=>d.example) || defs[0] || {};
    if(chosen.definition){
      translateText(chosen.definition, 'en|zh-TW').then(zh=>{
        const el = document.getElementById(`defZh_${mi}_0`);
        if(el) el.textContent = zh ? `→ ${zh}` : '';
      });
    }
    if(chosen.example){
      translateText(chosen.example, 'en|zh-TW').then(zh=>{
        const el = document.getElementById(`exZh_${mi}_0`);
        if(el) el.textContent = zh ? `→ ${zh}` : '';
      });
    }
  });
}

function renderDictNotFound(word, isNetworkError){
  const msg = isNetworkError
    ? `😕 目前無法連線查詢<br>請確認網路連線後再試一次。`
    : `😕 找不到「${escapeHtml(word)}」<br>請確認拼字是否正確。`;

}

function addHistory(text, dir){
  dictHistory = dictHistory.filter(h=> !(h.text===text && h.dir===dir));
  dictHistory.unshift({text, dir});
  if(dictHistory.length>30) dictHistory.pop();
  renderHistory();
}
function renderHistory(){
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  dictHistory.forEach(h=>{
    const li = document.createElement('li');
    li.textContent = (h.dir==='zh-en' ? '🈶 ' : '🔤 ') + h.text;
    li.addEventListener('click', ()=>{
      const targetDir = h.dir === 'zh-en' ? 'zh-en' : 'en-zh';
      document.querySelector(`.dir-btn[data-dir="${targetDir}"]`).click();
      document.getElementById('dictInput').value = h.text;
      handleDictSearch();
    });
    list.appendChild(li);
  });
}
document.getElementById('btnClearHistory').addEventListener('click', ()=>{

});

let currentRootCat = 'prefix';
let rootNotes = {}; // 使用者自己補充的筆記，key 格式："分類_索引"

document.querySelectorAll('.cat-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentRootCat = btn.dataset.cat;
    renderRoots();
  });
});
document.getElementById('rootSearch').addEventListener('input', renderRoots);

function renderRoots(){
  const q = document.getElementById('rootSearch').value.trim().toLowerCase();
  const list = document.getElementById('rootList');
  list.innerHTML = '';
  ROOT_DATA[currentRootCat].forEach((item, idx)=>{
    if(q && !(item.a.toLowerCase().includes(q) || item.meaning.includes(q) || item.ex.join(' ').toLowerCase().includes(q) || (item.origin||'').includes(q))) return;
    const noteKey = `${currentRootCat}_${idx}`;
    const noteVal = rootNotes[noteKey] || '';
    const card = document.createElement('div');
    card.className = 'root-card';
    card.innerHTML = `
      <div class="root-affix">${escapeHtml(item.a)}</div>
      <div class="root-meaning">${escapeHtml(item.meaning)}</div>
      ${item.origin ? `<div class="root-origin">🧠 ${escapeHtml(item.origin)}</div>` : ''}
      <div class="root-examples">${item.ex.map(e=>`<span class="root-ex">${escapeHtml(e)}</span>`).join('')}</div>
      <textarea class="root-note" data-key="${noteKey}" placeholder="✏️ 寫下自己的記憶方法或補充筆記...">${escapeHtml(noteVal)}</textarea>
    `;
    list.appendChild(card);
  });
  list.querySelectorAll('.root-ex').forEach(span=>{
    span.addEventListener('click', ()=>{
      const word = span.textContent.trim().split(' ')[0];
      speak(word, 'en-US');
    });
  });
  list.querySelectorAll('.root-note').forEach(ta=>{
    ta.addEventListener('input', ()=>{
      rootNotes[ta.dataset.key] = ta.value;
    });
  });
}
renderRoots();

const zhDictCache = {};
let zhDictHistory = [];

async function fetchChineseDict(word){
  word = word.trim();
  if(!word) return null;
  if(zhDictCache[word]) return zhDictCache[word];
  const res = await fetchWithTimeout(`https://www.moedict.tw/uni/${encodeURIComponent(word)}`);
  if(!res.ok) throw new Error('NETWORK');
  const data = await res.json();
  if(!data || !data.heteronyms){ throw new Error('NOT_FOUND'); }
  zhDictCache[word] = data;
  return data;
}

let zhSearching = false;
async function handleZhSearch(){
  if(zhSearching) return;
  const word = document.getElementById('zhInput').value.trim();
  if(!word) return;
  zhSearching = true;
  const btn = document.getElementById('zhSearchBtn');
  btn.disabled = true; btn.style.opacity = '0.6';
  document.getElementById('zhResult').innerHTML = `<div class="dict-placeholder">🔎 查詢中...</div>`;
  try{
    const data = await fetchChineseDict(word);
    renderZhDictResult(data, word);
    addZhHistory(word);
  }catch(e){
    const msg = e.message === 'NOT_FOUND'
      ? `😕 找不到「${escapeHtml(word)}」<br>請確認字詞是否正確。`
      : `😕 目前無法連線查詢<br>請確認網路連線後再試一次。`;
    document.getElementById('zhResult').innerHTML = `<div class="dict-notfound">${msg}</div>`;
  } finally {
    zhSearching = false;
    btn.disabled = false; btn.style.opacity = '1';
  }
}

function renderZhDictResult(data, word){
  const title = data.title || word;
  let html = `
    <div class="dict-word-row">
      <h2>${escapeHtml(title)}</h2>
      <button class="icon-btn" id="zhSpeakBtn">🔊</button>
    </div>
    <div class="zh-meta-row">
      ${data.radical ? `<span class="zh-meta-chip">部首：${escapeHtml(data.radical)}</span>` : ''}
      ${data.stroke_count ? `<span class="zh-meta-chip">筆畫：${data.stroke_count}</span>` : ''}
      ${(data.non_radical_stroke_count!=null) ? `<span class="zh-meta-chip">部首外筆畫：${data.non_radical_stroke_count}</span>` : ''}
    </div>
    <div class="dict-image-slot" id="zhImageSlot"></div>
  `;
  (data.heteronyms||[]).forEach(h=>{
    html += `<div class="zh-bopomofo-row">
      ${h.bopomofo ? `<span class="phonetic-chip mono">${escapeHtml(h.bopomofo)}</span>` : ''}
      ${h.bopomofo2 ? `<span class="zh-pinyin mono">${escapeHtml(h.bopomofo2)}</span>` : ''}
    </div>`;
    html += `<ol class="dict-defs">`;
    (h.definitions||[]).slice(0,6).forEach(d=>{
      html += `<li>${d.type ? `<span class="dict-pos">${escapeHtml(d.type)}</span> ` : ''}${escapeHtml(d.def||'')}
        ${d.example && d.example.length ? `<div class="dict-example">${d.example.map(e=>escapeHtml(e)).join('、')}</div>` : ''}
      </li>`;
    });
    html += `</ol>`;
  });
  html += `
    <div class="zh-evolution-box">
      <div class="zh-evolution-title">🏛 漢字演變小知識</div>
      <div class="zh-evolution-text">漢字的書寫大約經歷了「甲骨文 → 金文 → 篆書 → 隸書 → 楷書」五個階段，字形從象形圖畫逐漸演變成現在方正的樣子。</div>
      <button class="secondary-btn small" id="zhEvolutionBtn">🔗 前往查看「${escapeHtml(title)}」的古文字寫法</button>
      <div class="zh-evolution-hint">會開啟「中華語文知識庫．漢字源流」（中華文化總會製作，專為國中小學生設計）。網站打開後，把「${escapeHtml(title)}」貼到它的搜尋欄位查詢，就能看到甲骨文、金文、篆書等六種字體對照。</div>
    </div>
  `;

  const resultEl = document.getElementById('zhResult');
  resultEl.innerHTML = html;
  document.getElementById('zhSpeakBtn').addEventListener('click', ()=> speak(title, 'zh-TW'));
  document.getElementById('zhEvolutionBtn').addEventListener('click', ()=>{
    window.open(`https://www.chinese-linguipedia.org/search_source.html`, '_blank');
  });

  // 背景載入一張相關圖片，找不到就不顯示（跟英文查詢共用同一個開放圖庫）
  fetchWordImage(title).then(img=>{
    const slot = document.getElementById('zhImageSlot');
    if(!slot || !img) return;
    slot.innerHTML = `
      <img src="${img.thumb}" alt="${escapeHtml(title)}" loading="lazy">
      <div class="dict-image-credit">圖片來源：${escapeHtml(img.source||'Openverse')}（開放版權圖庫）</div>
    `;
  });
}

function addZhHistory(word){
  zhDictHistory = zhDictHistory.filter(w=>w!==word);
  zhDictHistory.unshift(word);
  if(zhDictHistory.length>30) zhDictHistory.pop();
  renderZhHistory();
}
function renderZhHistory(){
  const list = document.getElementById('zhHistoryList');
  list.innerHTML = '';
  zhDictHistory.forEach(w=>{
    const li = document.createElement('li');
    li.textContent = w;
    li.addEventListener('click', ()=>{
      document.getElementById('zhInput').value = w;
      handleZhSearch();
    });
    list.appendChild(li);
  });
}
document.getElementById('btnClearZhHistory').addEventListener('click', ()=>{
  zhDictHistory = [];
  renderZhHistory();
});
document.getElementById('zhSearchBtn').addEventListener('click', handleZhSearch);
document.getElementById('zhInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') handleZhSearch();
});

/* ---------------------------------------------------------------- */
/* 練習模式                                                          */
/* ---------------------------------------------------------------- */
let practiceDeck = [];
let practiceIndex = 0;
let practiceStats = {know:0, unknown:0};

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

document.getElementById('btnPractice').addEventListener('click', ()=>{
  const unitCards = flashcards.filter(c => (c.unitId||'u0') === currentUnitId);
  if(!unitCards.length){ alert('這個單元還沒有字卡，請先新增再開始練習喔！'); return; }
  startPractice(unitCards);
});
document.getElementById('btnExitPractice').addEventListener('click', ()=>{
  document.getElementById('practiceScreen').classList.remove('active');
});

function startPractice(cards){
  practiceDeck = shuffle(cards);
  practiceIndex = 0;
  practiceStats = {know:0, unknown:0};
  document.getElementById('practiceScreen').classList.add('active');
  renderPracticeCard();
}

function renderPracticeCard(){
  if(practiceIndex >= practiceDeck.length){ renderPracticeSummary(); return; }
  const card = practiceDeck[practiceIndex];
  document.getElementById('practiceProgress').textContent = `${practiceIndex+1} / ${practiceDeck.length}`;

  document.getElementById('practiceCard').innerHTML = `
    <div class="practice-image">${card.image ? `<img src="${card.image}" style="object-position:${card.posX||50}% ${card.posY||50}%">` : '📷'}</div>
    <div class="practice-word">${escapeHtml(card.word)}</div>
    <div class="practice-meaning" id="practiceMeaning" style="display:none;">
      ${card.phonetic ? `<div class="practice-phonetic mono">${escapeHtml(card.phonetic)}</div>` : ''}
      ${card.zh ? `<div>${escapeHtml(card.zh)}</div>` : ''}
      ${card.definition ? `<div class="practice-def">${escapeHtml(card.definition)}</div>` : ''}
    </div>
    <button id="btnRevealMeaning" class="secondary-btn small">👀 顯示意思</button>
  `;
  speak(card.word, 'en-US');
  document.getElementById('btnRevealMeaning').addEventListener('click', ()=>{
    document.getElementById('practiceMeaning').style.display = 'flex';
  });

  document.getElementById('practiceControls').innerHTML = `
    <button id="btnUnknown" class="know-btn unknown">😅 還不熟</button>
    <button id="btnKnow" class="know-btn known">😄 我會了</button>
  `;
  document.getElementById('btnUnknown').addEventListener('click', ()=>{ practiceStats.unknown++; practiceIndex++; renderPracticeCard(); });
  document.getElementById('btnKnow').addEventListener('click', ()=>{ practiceStats.know++; card.mastered = true; renderCardGrid(); practiceIndex++; renderPracticeCard(); });
}

function renderPracticeSummary(){
  document.getElementById('practiceProgress').textContent = '完成！';
  document.getElementById('practiceControls').innerHTML = '';
  document.getElementById('practiceCard').innerHTML = `
    <div class="summary-box">
      <h2>🎉 練習完成！</h2>
      <div class="summary-stats">
        <div class="summary-stat"><div class="num" style="color:var(--mint-deep);">${practiceStats.know}</div>已經會了</div>
        <div class="summary-stat"><div class="num" style="color:var(--coral-deep);">${practiceStats.unknown}</div>還要加油</div>
      </div>
      <div class="summary-buttons">
        <button id="btnPracticeAgain" class="primary-btn">🔁 再練習一次</button>
        <button id="btnPracticeExit" class="ghost-btn">結束</button>
      </div>
    </div>
  `;
  document.getElementById('btnPracticeAgain').addEventListener('click', ()=> startPractice(flashcards));
  document.getElementById('btnPracticeExit').addEventListener('click', ()=>{
    document.getElementById('practiceScreen').classList.remove('active');
  });
}

/* 初始渲染 */
/* 翻卡片：事件委派綁在容器上（容器本身不會被替換），比每次重繪都重新綁定更穩定 */
function setupFlipDelegation(gridId){
  const grid = document.getElementById(gridId);
  grid.addEventListener('click', (e)=>{
    if(viewMode !== 'picture') return;
    const face = e.target.closest('.card-photo, .card-answer');
    if(!face) return;
    if(face.dataset.dragged === '1'){ face.dataset.dragged = '0'; return; }
    const cardEl = face.closest('.flash-card');
    const id = cardEl?.dataset.id;
    if(!id) return;
    const card = flashcards.find(c=>c.id===id);
    if(!card) return;
    playClick();
    if(flippedCards.has(id)){ flippedCards.delete(id); }
    else { flippedCards.add(id); speak(card.word,'en-US'); }
    renderCardGrid();
  });
}
setupFlipDelegation('cardGridLearning');
setupFlipDelegation('cardGridMastered');

renderCardGrid();

})();
</script>
