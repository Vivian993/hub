<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英語字卡辭典</title>
<!-- 📌 iPhone 桌面 App 圖示：它會去抓您上傳到 GitHub 的 custom-icon.png 照片 -->
<link rel="apple-touch-icon" href="custom-icon.png">
<link rel="icon" type="image/png" href="custom-icon.png">  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6FAF8; --paper-deep:#EAF4EF;
    --ink:#1F3A3A; --ink-soft:#5B7370;
    --mint:#3FBF95; --mint-deep:#2FA382;
    --sky:#4FA8D8; --sky-deep:#3B8FBE;
    --coral:#FF8A65; --coral-deep:#F16F49;
    --sand:#FFF3E4;
    --line:#D9EDE5;
    --white:#FFFFFF;
    --shadow:0 4px 14px rgba(31,58,58,0.08);
    --shadow-sm:0 2px 8px rgba(31,58,58,0.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:'Noto Sans TC','Poppins',sans-serif;
    background:var(--paper); color:var(--ink);
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Poppins','Noto Sans TC',sans-serif; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',monospace;}

  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky; top:0; z-index:30; background:var(--white);
    box-shadow:var(--shadow-sm);
    padding: clamp(10px,2vh,16px) clamp(14px,3vw,26px);
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .topbar h1{
    font-size:clamp(18px,3.4vw,24px); font-weight:800; color:var(--mint-deep);
    display:flex; align-items:center; gap:8px; flex-shrink:0;
  }
  .tabs{display:flex; gap:6px; flex:1; overflow-x:auto; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    border:none; background:var(--paper-deep); color:var(--ink-soft); font-weight:700;
    padding:9px 16px; border-radius:999px; font-size:clamp(13px,2.6vw,15px); white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .tab-btn.active{background:var(--mint); color:#fff;}
  .mute-btn{
    border:none; background:var(--paper-deep); width:38px; height:38px; border-radius:50%;
    font-size:16px; flex-shrink:0;
  }

  main{flex:1; display:flex; flex-direction:column; min-height:0;}
  .tab-panel{display:none; flex:1; min-height:0; flex-direction:column; padding: clamp(14px,3vw,24px);}
  .tab-panel.active{display:flex;}

  .primary-btn{
    border:none; background:var(--mint); color:#fff; font-weight:700; border-radius:12px;
    padding:11px 20px; font-size:clamp(13px,2.6vw,15px); box-shadow:var(--shadow-sm);
  }
  .primary-btn:active{transform:translateY(2px);}
  .primary-btn.small{padding:8px 14px; font-size:13px;}
  .secondary-btn{
    border:2px solid var(--mint); background:#fff; color:var(--mint-deep); font-weight:700;
    border-radius:12px; padding:9px 18px; font-size:clamp(13px,2.6vw,15px);
  }
  .secondary-btn:active{transform:translateY(2px);}
  .secondary-btn.small{padding:6px 12px; font-size:13px;}
  .ghost-btn{
    border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); font-weight:600;
    border-radius:12px; padding:8px 16px; font-size:clamp(12px,2.4vw,14px);
  }
  .ghost-btn.small{padding:5px 12px; font-size:12px;}
  .icon-btn{
    border:none; background:var(--sky); color:#fff; border-radius:10px; width:36px; height:36px;
    font-size:15px; flex-shrink:0;
  }

  /* ---------- FLASHCARDS TAB ---------- */
  .panel-toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .empty-hint{color:var(--ink-soft); text-align:center; margin-top:40px; font-size:15px; display:none;}
  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:16px;
    overflow-y:auto; padding-bottom:20px; align-content:start;
  }
  .flash-card{
    background:#fff; border-radius:16px; box-shadow:var(--shadow-sm); padding:12px;
    display:flex; flex-direction:column; gap:8px; position:relative;
  }
  .card-remove{
    position:absolute; top:8px; right:8px; z-index:2; width:24px; height:24px; border-radius:50%;
    border:none; background:rgba(255,255,255,0.9); color:var(--coral-deep); font-size:13px; box-shadow:var(--shadow-sm);
  }
  .card-photo{
    width:100%; aspect-ratio:1/1; border-radius:12px; background:var(--paper-deep);
    display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:34px;
    cursor:grab; touch-action:none; color:var(--ink-soft);
  }
  .card-photo img{width:100%; height:100%; object-fit:cover; pointer-events:none;}
  .card-word{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    font-weight:800; font-size:clamp(16px,3.4vw,19px); color:var(--ink);
  }
  .card-speak{border:none; background:var(--sky); color:#fff; border-radius:8px; width:30px; height:30px; font-size:13px; flex-shrink:0;}
  .card-phonetic{
    font-size:12px; color:var(--sky-deep); background:var(--paper-deep); display:inline-block;
    padding:2px 8px; border-radius:999px; width:fit-content;
  }
  .card-zh{font-size:13px; color:var(--ink-soft);}
  .card-def{font-size:12px; color:var(--ink-soft); line-height:1.4;}

  /* ---------- DICTIONARY TAB ---------- */
  .dict-layout{display:flex; gap:20px; flex:1; min-height:0; flex-wrap:wrap;}
  .dict-main{flex:2; min-width:260px; display:flex; flex-direction:column; min-height:0;}
  .search-row{display:flex; gap:8px; margin-bottom:14px;}
  .search-row input{
    flex:1; border:2px solid var(--line); border-radius:12px; padding:11px 14px;
    font-size:clamp(14px,2.8vw,16px); outline:none; background:#fff;
  }
  .search-row input:focus{border-color:var(--mint);}
  .search-row button{
    border:none; background:var(--mint); color:#fff; border-radius:12px; padding:0 18px; font-weight:700;
    font-size:clamp(13px,2.6vw,15px);
  }
  .dict-result{flex:1; overflow-y:auto; background:#fff; border-radius:16px; padding:18px; box-shadow:var(--shadow-sm); min-height:120px;}
  .dict-placeholder{color:var(--ink-soft); text-align:center; padding:30px 10px; font-size:14px;}
  .dict-notfound{color:var(--coral-deep); text-align:center; padding:30px 10px; font-size:14px;}
  .dict-word-row{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .dict-word-row h2{font-size:clamp(24px,5vw,32px); color:var(--mint-deep);}
  .phonetic-chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--paper-deep); color:var(--sky-deep);
    border-radius:999px; padding:5px 12px; font-size:14px; margin-bottom:14px;
  }
  .dict-pos{
    display:inline-block; background:var(--sand); color:var(--coral-deep); font-weight:700; font-size:12px;
    border-radius:8px; padding:3px 10px; margin:10px 0 6px;
  }
  .dict-defs{margin:0 0 4px; padding-left:20px;}
  .dict-defs li{margin-bottom:8px; font-size:14px; line-height:1.5;}
  .dict-example{color:var(--ink-soft); font-style:italic; font-size:13px; margin-top:2px;}
  .dict-history{
    flex:1; min-width:180px; max-width:260px; background:#fff; border-radius:16px; padding:14px;
    box-shadow:var(--shadow-sm); display:flex; flex-direction:column; max-height:70vh;
  }
  .dict-history h3{font-size:15px; margin-bottom:8px; color:var(--ink-soft);}
  #historyList{list-style:none; margin:0; padding:0; overflow-y:auto; flex:1;}
  #historyList li{
    padding:8px 10px; border-radius:10px; cursor:pointer; font-size:14px; margin-bottom:4px;
    display:flex; justify-content:space-between; align-items:center;
  }
  #historyList li:hover{background:var(--paper-deep);}

  /* ---------- ROOTS TAB ---------- */
  .root-toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
  .root-cat-tabs{display:flex; gap:6px;}
  .cat-btn{
    border:none; background:var(--paper-deep); color:var(--ink-soft); font-weight:700;
    padding:8px 16px; border-radius:999px; font-size:13px;
  }
  .cat-btn.active{background:var(--coral); color:#fff;}
  #rootSearch{
    flex:1; min-width:160px; border:2px solid var(--line); border-radius:999px; padding:9px 16px;
    font-size:14px; outline:none;
  }
  #rootSearch:focus{border-color:var(--coral);}
  .root-list{
    flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:12px; align-content:start; padding-bottom:20px;
  }
  .root-card{background:#fff; border-radius:14px; padding:14px 16px; box-shadow:var(--shadow-sm);}
  .root-affix{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:17px; color:var(--coral-deep);}
  .root-meaning{font-size:13px; color:var(--ink-soft); margin:4px 0 8px;}
  .root-examples{display:flex; flex-wrap:wrap; gap:6px;}
  .root-ex{
    background:var(--paper-deep); border-radius:8px; padding:4px 9px; font-size:12px; cursor:pointer;
  }
  .root-ex:hover{background:var(--mint); color:#fff;}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(31,58,58,0.45); z-index:50;
    align-items:center; justify-content:center; padding:16px;
  }
  .modal-overlay.active{display:flex;}
  .modal-box{
    background:#fff; border-radius:20px; padding:24px; width:100%; max-width:380px;
    display:flex; flex-direction:column; gap:12px; max-height:90vh; overflow-y:auto;
  }
  .modal-box h2{font-size:19px; text-align:center; color:var(--mint-deep);}
  .modal-photo{
    width:120px; height:120px; border-radius:16px; background:var(--paper-deep); margin:0 auto;
    display:flex; align-items:center; justify-content:center; font-size:34px; cursor:grab; overflow:hidden;
    touch-action:none;
  }
  .modal-photo img{width:100%; height:100%; object-fit:cover; pointer-events:none;}
  .text-input{
    border:2px solid var(--line); border-radius:12px; padding:11px 14px; font-size:15px; outline:none;
  }
  .text-input:focus{border-color:var(--mint);}
  .modal-word-row{display:flex; justify-content:center;}
  .modal-buttons{display:flex; gap:10px; margin-top:4px;}
  .modal-buttons button{flex:1;}

  /* ---------- PRACTICE MODE ---------- */
  .practice-overlay{
    display:none; position:fixed; inset:0; background:var(--paper); z-index:60;
    flex-direction:column; padding:clamp(14px,3vw,26px);
  }
  .practice-overlay.active{display:flex;}
  .practice-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
  .practice-progress{font-weight:700; color:var(--ink-soft);}
  .practice-card{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    text-align:center;
  }
  .practice-image{
    width:min(60vw,260px); aspect-ratio:1/1; border-radius:20px; background:var(--paper-deep);
    display:flex; align-items:center; justify-content:center; font-size:60px; overflow:hidden; box-shadow:var(--shadow);
  }
  .practice-image img{width:100%; height:100%; object-fit:cover;}
  .practice-word{font-size:clamp(28px,7vw,44px); font-weight:800; color:var(--mint-deep);}
  .practice-meaning{display:flex; flex-direction:column; gap:6px; align-items:center;}
  .practice-phonetic{font-family:'JetBrains Mono',monospace; color:var(--sky-deep);}
  .practice-def{max-width:420px; font-size:14px; color:var(--ink-soft);}
  .practice-controls{display:flex; gap:14px; justify-content:center; padding:20px 0;}
  .know-btn{
    border:none; border-radius:999px; padding:14px 26px; font-weight:800; font-size:16px; color:#fff;
    box-shadow:var(--shadow-sm);
  }
  .know-btn:active{transform:translateY(3px);}
  .know-btn.unknown{background:var(--coral);}
  .know-btn.known{background:var(--mint);}
  .summary-box{text-align:center;}
  .summary-box h2{font-size:26px; color:var(--mint-deep); margin-bottom:10px;}
  .summary-stats{display:flex; gap:20px; justify-content:center; margin:16px 0;}
  .summary-stat{background:#fff; border-radius:14px; padding:14px 22px; box-shadow:var(--shadow-sm);}
  .summary-stat .num{font-size:28px; font-weight:800;}
  .summary-buttons{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <h1>📘 英語字卡辭典</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="flashcards">📇 我的字卡</button>
      <button class="tab-btn" data-tab="dictionary">📖 查字典</button>
      <button class="tab-btn" data-tab="roots">🌳 字根字首字尾</button>
    </nav>
    <button class="mute-btn" id="btnMute">🔊</button>
  </div>

  <main>

    <!-- ============ 字卡 ============ -->
    <section id="tab-flashcards" class="tab-panel active">
      <div class="panel-toolbar">
        <button id="btnAddCard" class="primary-btn">＋ 新增字卡</button>
        <button id="btnPractice" class="secondary-btn">🎯 開始練習</button>
        <button id="btnExportCards" class="ghost-btn">💾 匯出備份</button>
        <button id="btnImportCards" class="ghost-btn">📂 匯入備份</button>
        <input type="file" id="importCardsFile" accept="application/json" hidden>
      </div>
      <p class="empty-hint" id="cardEmptyHint">還沒有字卡，點上面「＋新增字卡」放上圖片和單字開始吧！</p>
      <div class="card-grid" id="cardGrid"></div>
    </section>

    <!-- ============ 查字典 ============ -->
    <section id="tab-dictionary" class="tab-panel">
      <div class="dict-layout">
        <div class="dict-main">
          <div class="search-row">
            <input type="text" id="dictInput" placeholder="輸入英文單字，例如 apple">
            <button id="dictSearchBtn">🔍 查詢</button>
          </div>
          <div id="dictResult" class="dict-result">
            <div class="dict-placeholder">輸入單字後按查詢，會顯示發音、詞性、解釋和例句喔！</div>
          </div>
        </div>
        <aside class="dict-history">
          <h3>🕘 查詢紀錄</h3>
          <ul id="historyList"></ul>
          <button id="btnClearHistory" class="ghost-btn small">清除紀錄</button>
        </aside>
      </div>
    </section>

    <!-- ============ 字根字首字尾 ============ -->
    <section id="tab-roots" class="tab-panel">
      <div class="root-toolbar">
        <div class="root-cat-tabs">
          <button class="cat-btn active" data-cat="prefix">字首 Prefix</button>
          <button class="cat-btn" data-cat="root">字根 Root</button>
          <button class="cat-btn" data-cat="suffix">字尾 Suffix</button>
        </div>
        <input type="text" id="rootSearch" placeholder="搜尋字根、字首、字尾或意思...">
      </div>
      <div class="root-list" id="rootList"></div>
    </section>

  </main>

  <!-- ============ 新增字卡 Modal ============ -->
  <div id="addCardModal" class="modal-overlay">
    <div class="modal-box">
      <h2 id="modalTitle">新增字卡</h2>
      <div class="modal-photo" id="modalPhotoCircle">📷</div>
      <input type="file" id="modalPhotoInput" accept="image/*" hidden>
      <button id="modalUploadBtn" class="secondary-btn small">上傳圖片</button>
      <input type="text" id="modalWordInput" placeholder="輸入英文單字" class="text-input">
      <div class="modal-word-row">
        <button id="modalSpeakBtn" class="secondary-btn small">🔊 試聽發音</button>
      </div>
      <input type="text" id="modalZhInput" placeholder="中文意思（選填）" class="text-input">
      <div class="modal-buttons">
        <button id="modalSaveBtn" class="primary-btn">儲存字卡</button>
        <button id="modalCancelBtn" class="ghost-btn">取消</button>
      </div>
    </div>
  </div>

  <!-- ============ 練習模式 ============ -->
  <div id="practiceScreen" class="practice-overlay">
    <div class="practice-top">
      <button id="btnExitPractice" class="ghost-btn">← 結束練習</button>
      <div class="practice-progress" id="practiceProgress"></div>
    </div>
    <div class="practice-card" id="practiceCard"></div>
    <div class="practice-controls" id="practiceControls"></div>
  </div>

</div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- */
/* 共用：靜音 / 語音                                                  */
/* ---------------------------------------------------------------- */
let muted = false;

function updateMuteIcon(){
  document.getElementById('btnMute').textContent = muted ? '🔇' : '🔊';
}
document.getElementById('btnMute').addEventListener('click', ()=>{ muted=!muted; updateMuteIcon(); });

function primeSpeech(){
  if(!('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance('\u00A0');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
['pointerdown','touchstart','click'].forEach(evt=>{
  document.addEventListener(evt, function unlock(){ primeSpeech(); }, {once:true});
});

function speak(text, lang){
  if(muted || !text) return;
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    u.rate = 0.88;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function speakWithAudio(word, audioUrl){
  if(muted) return;
  if(audioUrl){
    try{
      const src = audioUrl.startsWith('http') ? audioUrl : ('https:' + audioUrl);
      const audio = new Audio(src);
      audio.play().catch(()=> speak(word,'en-US'));
      return;
    }catch(e){}
  }
  speak(word, 'en-US');
}

/* ---------------------------------------------------------------- */
/* Tab 切換                                                          */
/* ---------------------------------------------------------------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});
function switchTab(name){
  document.querySelector(`.tab-btn[data-tab="${name}"]`).click();
}

/* ---------------------------------------------------------------- */
/* 字卡狀態與渲染                                                     */
/* ---------------------------------------------------------------- */
let flashcards = [];
let idCounter = 0;
let editingCardId = null;

function renderCardGrid(){
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  document.getElementById('cardEmptyHint').style.display = flashcards.length ? 'none' : 'block';
  flashcards.forEach(card=>{
    const el = document.createElement('div');
    el.className = 'flash-card';
    el.innerHTML = `
      <button class="card-remove" data-id="${card.id}">✕</button>
      <div class="card-photo" data-id="${card.id}">${card.image ? `<img src="${card.image}" style="object-position:${card.posX||50}% ${card.posY||50}%">` : '📷'}</div>
      <div class="card-word">${escapeHtml(card.word)}<button class="card-speak" data-id="${card.id}">🔊</button></div>
      ${card.phonetic ? `<div class="card-phonetic mono">${escapeHtml(card.phonetic)}</div>` : ''}
      ${card.zh ? `<div class="card-zh">${escapeHtml(card.zh)}</div>` : ''}
      ${card.definition ? `<div class="card-def">${escapeHtml(card.definition)}</div>` : ''}
    `;
    grid.appendChild(el);
  });

  grid.querySelectorAll('.card-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      flashcards = flashcards.filter(c=>c.id!==btn.dataset.id);
      renderCardGrid();
    });
  });
  grid.querySelectorAll('.card-speak').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const card = flashcards.find(c=>c.id===btn.dataset.id);
      if(card) speak(card.word, 'en-US');
    });
  });
  grid.querySelectorAll('.card-photo').forEach(circle=>{
    circle.addEventListener('click', (e)=>{
      if(circle.dataset.dragged==='1'){ circle.dataset.dragged='0'; return; }
      openAddModal(circle.dataset.id);
    });
    enableDrag(circle, flashcards);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 讓照片可以在框內拖曳調整位置 */
function enableDrag(circle, dataList){
  const img = circle.querySelector('img');
  if(!img) return;
  let dragging=false, startX=0, startY=0, startPosX=50, startPosY=50;
  const findItem = ()=> dataList.find(c=>c.id===circle.dataset.id);
  const onDown = (ev)=>{
    const item = findItem(); if(!item) return;
    dragging = true; circle.dataset.dragged='0';
    const pt = ev.touches? ev.touches[0] : ev;
    startX=pt.clientX; startY=pt.clientY;
    startPosX = item.posX||50; startPosY = item.posY||50;
    ev.preventDefault();
  };
  const onMove = (ev)=>{
    if(!dragging) return;
    const item = findItem(); if(!item) return;
    const pt = ev.touches? ev.touches[0] : ev;
    const dx = pt.clientX-startX, dy = pt.clientY-startY;
    if(Math.abs(dx)>3||Math.abs(dy)>3) circle.dataset.dragged='1';
    const rect = circle.getBoundingClientRect();
    const newX = Math.min(100, Math.max(0, startPosX-(dx/rect.width)*100));
    const newY = Math.min(100, Math.max(0, startPosY-(dy/rect.height)*100));
    item.posX=newX; item.posY=newY;
    img.style.objectPosition = `${newX}% ${newY}%`;
  };
  const onUp = ()=>{ dragging=false; };
  circle.addEventListener('mousedown', onDown);
  circle.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
}

let modalPhotoData = null;

    photoCircle.innerHTML = modalPhotoData ? `<img src="${modalPhotoData}" style="object-position:${modalPosX}% ${modalPosY}%">` : '📷';

/* ---------------------------------------------------------------- */
/* 查字典（Free Dictionary API）                                     */
/* ---------------------------------------------------------------- */
const dictCache = {};
let dictHistory = [];

async function fetchDictionary(word){
  word = word.trim().toLowerCase();
  if(!word) return null;
  if(dictCache[word]) return dictCache[word];
  const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
  if(!res.ok) throw new Error('not found');
  const data = await res.json();
  dictCache[word] = data;
  return data;
}

async function lookupWord(word){
  word = word.trim();
  if(!word) return;
  document.getElementById('dictResult').innerHTML = `<div class="dict-placeholder">🔎 查詢中...</div>`;
  try{
    const data = await fetchDictionary(word);
    renderDictResult(data);
    addHistory(word.toLowerCase());
  }catch(e){
    renderDictNotFound(word);
  }
}

function renderDictResult(data){
  const entry = data[0];
  const phoneticText = entry.phonetic || (entry.phonetics.find(p=>p.text)||{}).text || '';
  const audioUrl = (entry.phonetics.find(p=>p.audio)||{}).audio || '';

  let html = `
    <div class="dict-word-row">
      <h2>${escapeHtml(entry.word)}</h2>
      <button class="icon-btn" id="dictSpeakBtn">🔊</button>
    </div>
    ${phoneticText ? `<div class="phonetic-chip mono">${escapeHtml(phoneticText)}</div>` : ''}
  `;
  (entry.meanings||[]).forEach(m=>{
    html += `<div class="dict-pos">${escapeHtml(m.partOfSpeech||'')}</div><ol class="dict-defs">`;
    (m.definitions||[]).slice(0,3).forEach(d=>{
      html += `<li>${escapeHtml(d.definition)}${d.example ? `<div class="dict-example">e.g. ${escapeHtml(d.example)}</div>` : ''}</li>`;
    });
    html += `</ol>`;
  });
  html += `<button id="dictAddCardBtn" class="primary-btn small">＋ 加入我的字卡</button>`;

  const resultEl = document.getElementById('dictResult');
  resultEl.innerHTML = html;
  document.getElementById('dictSpeakBtn').addEventListener('click', ()=> speakWithAudio(entry.word, audioUrl));
  document.getElementById('dictAddCardBtn').addEventListener('click', ()=>{
    const card = {
      id:'c'+(idCounter++), word:entry.word, zh:'', image:null,
      phonetic:phoneticText, audioUrl, posX:50, posY:50,
      definition: entry.meanings?.[0]?.definitions?.[0]?.definition || ''
    };
    flashcards.push(card);
    renderCardGrid();
    switchTab('flashcards');
  });
}

function renderDictNotFound(word){
  document.getElementById('dictResult').innerHTML = `<div class="dict-notfound">😕 找不到「${escapeHtml(word)}」<br>請確認拼字是否正確，或檢查網路連線。</div>`;
}

function addHistory(word){
  dictHistory = dictHistory.filter(w=>w!==word);
  dictHistory.unshift(word);
  if(dictHistory.length>30) dictHistory.pop();
  renderHistory();
}
function renderHistory(){
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  dictHistory.forEach(w=>{
    const li = document.createElement('li');
    li.textContent = w;
    li.addEventListener('click', ()=>{
      document.getElementById('dictInput').value = w;
      lookupWord(w);
    });
    list.appendChild(li);
  });
}
document.getElementById('btnClearHistory').addEventListener('click', ()=>{
  dictHistory = [];
  renderHistory();
});

document.getElementById('dictSearchBtn').addEventListener('click', ()=>{
  lookupWord(document.getElementById('dictInput').value);
});
document.getElementById('dictInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') lookupWord(document.getElementById('dictInput').value);
});

/* ---------------------------------------------------------------- */
/* 練習模式                                                          */
/* ---------------------------------------------------------------- */
let practiceDeck = [];
let practiceIndex = 0;
let practiceStats = {know:0, unknown:0};

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

document.getElementById('btnPractice').addEventListener('click', ()=>{
  if(!flashcards.length){ alert('請先新增至少一張字卡再開始練習喔！'); return; }
  startPractice(flashcards);
});
document.getElementById('btnExitPractice').addEventListener('click', ()=>{
  document.getElementById('practiceScreen').classList.remove('active');
});

function startPractice(cards){
  practiceDeck = shuffle(cards);
  practiceIndex = 0;
  practiceStats = {know:0, unknown:0};
  document.getElementById('practiceScreen').classList.add('active');
  renderPracticeCard();
}

function renderPracticeCard(){
  if(practiceIndex >= practiceDeck.length){ renderPracticeSummary(); return; }
  const card = practiceDeck[practiceIndex];
  document.getElementById('practiceProgress').textContent = `${practiceIndex+1} / ${practiceDeck.length}`;

  document.getElementById('practiceCard').innerHTML = `
    <div class="practice-image">${card.image ? `<img src="${card.image}" style="object-position:${card.posX||50}% ${card.posY||50}%">` : '📷'}</div>
    <div class="practice-word">${escapeHtml(card.word)}</div>
    <div class="practice-meaning" id="practiceMeaning" style="display:none;">
      ${card.phonetic ? `<div class="practice-phonetic mono">${escapeHtml(card.phonetic)}</div>` : ''}
      ${card.zh ? `<div>${escapeHtml(card.zh)}</div>` : ''}
      ${card.definition ? `<div class="practice-def">${escapeHtml(card.definition)}</div>` : ''}
    </div>
    <button id="btnRevealMeaning" class="secondary-btn small">👀 顯示意思</button>
  `;
  speak(card.word, 'en-US');
  document.getElementById('btnRevealMeaning').addEventListener('click', ()=>{
    document.getElementById('practiceMeaning').style.display = 'flex';
  });

  document.getElementById('practiceControls').innerHTML = `
    <button id="btnUnknown" class="know-btn unknown">😅 還不熟</button>
    <button id="btnKnow" class="know-btn known">😄 我會了</button>
  `;
  document.getElementById('btnUnknown').addEventListener('click', ()=>{ practiceStats.unknown++; practiceIndex++; renderPracticeCard(); });
  document.getElementById('btnKnow').addEventListener('click', ()=>{ practiceStats.know++; practiceIndex++; renderPracticeCard(); });
}

function renderPracticeSummary(){
  document.getElementById('practiceProgress').textContent = '完成！';
  document.getElementById('practiceControls').innerHTML = '';
  document.getElementById('practiceCard').innerHTML = `
    <div class="summary-box">
      <h2>🎉 練習完成！</h2>
      <div class="summary-stats">
        <div class="summary-stat"><div class="num" style="color:var(--mint-deep);">${practiceStats.know}</div>已經會了</div>
        <div class="summary-stat"><div class="num" style="color:var(--coral-deep);">${practiceStats.unknown}</div>還要加油</div>
      </div>
      <div class="summary-buttons">
        <button id="btnPracticeAgain" class="primary-btn">🔁 再練習一次</button>
        <button id="btnPracticeExit" class="ghost-btn">結束</button>
      </div>
    </div>
  `;
  document.getElementById('btnPracticeAgain').addEventListener('click', ()=> startPractice(flashcards));
  document.getElementById('btnPracticeExit').addEventListener('click', ()=>{
    document.getElementById('practiceScreen').classList.remove('active');
  });
}
