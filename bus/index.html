<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6f8f7a">
  <meta name="description" content="小朋友專用的簡單公車查詢小幫手">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>我的公車小幫手</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">每日搭車小幫手</div>
      <h1>🚌 我的公車小幫手</h1>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="家長設定">⚙️</button>
  </header>

  <main>
    <section class="hero card">
      <div id="dateText" class="muted"></div>
      <h2 id="greeting">今天要去哪裡？</h2>
      <div class="hero-actions">
        <button class="big-action school" id="schoolBtn">🏫<span>我要去學校</span></button>
        <button class="big-action home" id="homeBtn">🏠<span>我要回家</span></button>
      </div>
    </section>

    <section class="card next-card">
      <div class="section-title">
        <h2>⭐ 建議搭乘</h2>
        <span id="statusBadge" class="badge ok">示範資料</span>
      </div>
      <div id="nextRide" class="next-ride">
        <div class="route-number">—</div>
        <div>
          <div class="ride-time">—</div>
          <div class="ride-detail">請選擇「去學校」或「回家」</div>
        </div>
      </div>
      <div class="ride-meta">
        <div>📍 上車 <strong id="boardStop">—</strong></div>
        <div>➡️ 方向 <strong id="direction">—</strong></div>
        <div>🏫/🏠 下車 <strong id="alightStop">—</strong></div>
      </div>
      <button id="rideBtn" class="primary full">我要搭這班</button>
    </section>

    <section class="grid2">
      <button class="menu-card" id="nearbyBtn"><span>📍</span><b>附近站牌</b><small>找現在附近的站</small></button>
      <button class="menu-card" id="todayBtn"><span>📅</span><b>今天班次</b><small>查看完整時間</small></button>
      <button class="menu-card" id="favoritesBtn"><span>❤️</span><b>我的常用站牌</b><small>收藏的站牌</small></button>
      <button class="menu-card" id="routesBtn"><span>⭐</span><b>我的常用路線</b><small>去學校／回家</small></button>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>📍 我的位置</h2>
        <span id="locationStatus" class="muted">尚未定位</span>
      </div>
      <button id="locateBtn" class="secondary full">取得目前位置</button>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav active" data-target="home">🏠<span>首頁</span></button>
    <button class="nav" data-target="nearby">📍<span>附近</span></button>
    <button class="nav" data-target="favorites">❤️<span>我的</span></button>
  </nav>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-head"><h2 id="modalTitle">—</h2><button id="closeModal" class="icon-btn">✕</button></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
