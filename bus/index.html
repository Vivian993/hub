<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的公車小幫手</title>
    <!-- 📌 iPhone 桌面 App 圖示：它會去抓您上傳到 GitHub 的 custom-icon.png 照片 -->
    <link rel="apple-touch-icon" href="custom-icon.png">
    <link rel="icon" type="image/png" href="custom-icon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4;
            -webkit-tap-highlight-color: transparent;
        }
        /* 隱藏捲軸但可滾動 */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-emerald-50 text-slate-800 antialiased min-h-screen flex flex-col items-center justify-start pb-24">

    <!-- 頂部標題列 -->
    <header class="w-full max-w-md bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center rounded-b-2xl">
        <div>
            <h1 class="text-xl font-black flex items-center gap-2">
                <i class="fa-solid fa-bus text-yellow-300 animate-bounce"></i> 我的公車小幫手
            </h1>
            <p id="current-date" class="text-xs text-emerald-100 mt-0.5">今天｜載入中...</p>
        </div>
        <button onclick="openSettings()" class="bg-emerald-700 hover:bg-emerald-800 p-2.5 rounded-full text-white transition active:scale-95 shadow">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>
    </header>

    <!-- 主要內容區 -->
    <main class="w-full max-w-md p-4 flex flex-col gap-4 w-full">

        <!-- 真實定位狀態區 -->
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-emerald-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="gps-icon" class="bg-emerald-100 p-2.5 rounded-full text-emerald-600 transition-colors">
                    <i class="fa-solid fa-location-crosshairs text-lg"></i>
                </div>
                <div>
                    <span class="text-xs text-slate-400 font-medium block">您的位置</span>
                    <span id="location-text" class="text-sm font-bold text-slate-700">定位中...</span>
                </div>
            </div>
            <button onclick="requestLocation()" class="text-xs bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-lg font-bold border border-emerald-200 hover:bg-emerald-100 transition active:scale-95">
                <i class="fa-solid fa-rotate-right mr-1"></i>更新定位
            </button>
        </div>

        <!-- 一鍵超大按鈕區 -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="startMode('school')" class="bg-gradient-to-br from-blue-500 to-indigo-600 text-white p-4 rounded-3xl shadow-lg hover:shadow-xl transition transform active:scale-95 flex flex-col items-center text-center gap-1 border-2 border-blue-400">
                <span class="text-3xl drop-shadow-md">🏫</span>
                <span class="text-lg font-black">去學校</span>
                <span class="text-xs text-blue-100">桃園農工</span>
            </button>
            <button onclick="startMode('home')" class="bg-gradient-to-br from-amber-500 to-orange-600 text-white p-4 rounded-3xl shadow-lg hover:shadow-xl transition transform active:scale-95 flex flex-col items-center text-center gap-1 border-2 border-amber-400">
                <span class="text-3xl drop-shadow-md">🏠</span>
                <span class="text-lg font-black">回家</span>
                <span class="text-xs text-amber-100">愛買附近</span>
            </button>
        </div>

        <!-- ⭐ 推薦班次卡片 (醒目公車號碼 + 到站時間) -->
        <div class="bg-white rounded-3xl p-5 shadow-md border-2 border-emerald-400 relative overflow-hidden">
            <div class="absolute top-0 right-0 bg-emerald-500 text-white text-xs px-3 py-1 rounded-bl-xl font-bold shadow-sm">
                ⭐ 最推薦搭乘班次
            </div>
            
            <!-- 公車路線號碼與發車時間 -->
            <div class="flex items-start justify-between mb-2">
                <div>
                    <div class="flex items-center gap-1.5">
                        <span class="text-xs bg-amber-400 text-slate-900 font-black px-2 py-0.5 rounded">公車</span>
                        <span id="recommend-route" class="text-2xl font-black text-blue-600">1路 縱貫線</span>
                    </div>
                    <div class="flex items-baseline gap-2 mt-1">
                        <h2 id="recommend-time" class="text-3xl font-black text-slate-800">計算中...</h2>
                        <span class="text-xs text-slate-500 font-bold">發車</span>
                    </div>
                </div>
                <div class="text-right">
                    <span class="inline-block bg-emerald-500 text-white text-xs px-2.5 py-1 rounded-full font-bold animate-pulse shadow-sm">
                        🟢 正常到站
                    </span>
                    <p id="recommend-walk" class="text-xs text-slate-500 mt-1.5 font-bold"><i class="fa-solid fa-person-walking"></i> 步行約 3 分鐘</p>
                </div>
            </div>

            <!-- 詳細路線行程細節 (包含到達時間) -->
            <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100 text-sm space-y-2 mb-4">
                <div class="flex items-center justify-between text-slate-700">
                    <p class="flex items-center gap-2">
                        <i class="fa-solid fa-circle-dot text-emerald-600 text-xs"></i> 
                        上車：<strong id="recommend-board">尋找中...</strong>
                    </p>
                    <span id="recommend-board-time" class="text-xs font-bold text-slate-500">--:--</span>
                </div>
                <div class="flex items-center justify-between text-slate-700">
                    <p class="flex items-center gap-2">
                        <i class="fa-solid fa-location-dot text-rose-500 text-xs"></i> 
                        下車：<strong id="recommend-alight">愛買站</strong>
                    </p>
                    <span id="recommend-arrive-time" class="text-xs font-bold text-emerald-600 bg-emerald-100 px-1.5 py-0.5 rounded">約 --:-- 到達</span>
                </div>
                <div class="pt-1.5 border-t border-slate-200/60 flex items-center justify-between text-xs text-slate-500">
                    <span>➡️ 行駛方向：<strong id="recommend-direction" class="text-blue-600">往 中壢/中山路 方向</strong></span>
                    <span>⏱️ 車程約 18 分鐘</span>
                </div>
            </div>

            <button onclick="confirmTrip()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-black shadow transition active:scale-95 flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-check-circle"></i> 我要搭這班公車
            </button>
        </div>

        <!-- 根據 GPS 計算的附近站牌與經過路線 -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-emerald-100">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-black text-slate-700 text-base flex items-center gap-2">
                    <i class="fa-solid fa-location-arrow text-blue-500"></i> 您附近的站牌
                </h3>
                <span class="text-xs text-slate-400 bg-slate-100 px-2 py-1 rounded-md">依距離排序</span>
            </div>
            <div id="nearby-stops-list" class="space-y-2">
                <div class="text-center p-4 text-slate-400 text-sm">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-emerald-500"></i><br>
                    正在搜尋附近站牌與公車號碼...
                </div>
            </div>
        </div>

    </main>

    <!-- 底部導覽列 -->
    <nav class="w-full max-w-md bg-white border-t border-slate-200 fixed bottom-0 left-1/2 transform -translate-x-1/2 py-2 px-6 flex justify-around items-center z-50 rounded-t-2xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <button class="flex flex-col items-center text-emerald-600 font-bold text-xs gap-1 transition">
            <i class="fa-solid fa-house text-lg"></i>
            <span>首頁</span>
        </button>
        <button onclick="alert('地圖找站牌功能載入中...')" class="flex flex-col items-center text-slate-400 hover:text-emerald-600 font-bold text-xs gap-1 transition">
            <i class="fa-solid fa-map-location-dot text-lg"></i>
            <span>地圖</span>
        </button>
        <button onclick="alert('今日完整班次表載入中...')" class="flex flex-col items-center text-slate-400 hover:text-emerald-600 font-bold text-xs gap-1 transition">
            <i class="fa-solid fa-calendar-days text-lg"></i>
            <span>班次</span>
        </button>
        <button onclick="openSettings()" class="flex flex-col items-center text-slate-400 hover:text-emerald-600 font-bold text-xs gap-1 transition">
            <i class="fa-solid fa-user-gear text-lg"></i>
            <span>設定</span>
        </button>
    </nav>

    <!-- 方向確認對話框 -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border-4 border-emerald-500 transform transition-all">
            <div class="text-center mb-4">
                <span class="text-5xl drop-shadow">🚌</span>
                <h3 class="text-xl font-black text-slate-800 mt-2">上車前最後確認！</h3>
            </div>
            <div id="modal-content" class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 space-y-2 text-sm mb-5 text-slate-700 shadow-inner">
                <!-- 動態內容 -->
            </div>
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-3 rounded-xl font-bold transition active:scale-95">
                    取消
                </button>
                <button onclick="confirmBoardingSuccess()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-black shadow transition active:scale-95">
                    ✅ 沒錯，出發！
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 時間與日期處理 ---
        const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        
        function updateTime() {
            const now = new Date();
            const dateString = `${now.getMonth() + 1}月${now.getDate()}日｜${days[now.getDay()]}`;
            document.getElementById('current-date').innerText = dateString;
            return now;
        }

        // 動態推算未來的假發車時間與抵達時間
        function generateDynamicTimes() {
            const now = new Date();
            const times = [];
            let offset = Math.floor(Math.random() * 5) + 3; // 3~8 分鐘後第一班

            for(let i=0; i<3; i++) {
                const departTime = new Date(now.getTime() + offset * 60000);
                const arriveTime = new Date(departTime.getTime() + 18 * 60000); // 車程算 18 分鐘

                const depHrs = departTime.getHours().toString().padStart(2, '0');
                const depMins = departTime.getMinutes().toString().padStart(2, '0');
                const arrHrs = arriveTime.getHours().toString().padStart(2, '0');
                const arrMins = arriveTime.getMinutes().toString().padStart(2, '0');

                times.push({
                    timeStr: `${depHrs}:${depMins}`,
                    arriveStr: `${arrHrs}:${arrMins}`,
                    minutesLeft: offset
                });
                offset += Math.floor(Math.random() * 8) + 8; // 下一班 8~15 分鐘後
            }
            return times;
        }

        // --- 2. 桃園真實站牌與行經路線資料庫 ---
        const taoyuanStopsDB = [
            { name: '桃園農工', lat: 24.9959, lng: 121.3195, mainRoute: '1路', allRoutes: '1路, 137路, 302路' },
            { name: '愛買(中山路)', lat: 24.9865, lng: 121.2952, mainRoute: '1路', allRoutes: '1路, 139路, 307路' },
            { name: '武陵高中', lat: 24.9894, lng: 121.2965, mainRoute: '1路', allRoutes: '1路, 139路, 601路' },
            { name: '中平路口', lat: 24.9902, lng: 121.3021, mainRoute: '1路', allRoutes: '1路, 220路' },
            { name: '中山國小', lat: 24.9875, lng: 121.2901, mainRoute: '307路', allRoutes: '1路, 307路' },
            { name: '桃園火車站', lat: 24.9892, lng: 121.3135, mainRoute: '1路', allRoutes: '各路幹線公車' }
        ];

        // 哈維辛公式計算距離
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        // --- 3. 定位與動態資料更新 ---
        let currentClosestStop = null;
        let currentMode = 'home'; // 預設為回家模式

        function requestLocation() {
            document.getElementById('location-text').innerText = "定位中...";
            document.getElementById('gps-icon').classList.add('animate-spin');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        document.getElementById('gps-icon').classList.remove('animate-spin');
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;
                        
                        const isTaoyuan = (userLat > 24.8 && userLat < 25.1 && userLng > 121.1 && userLng < 121.4);
                        const finalLat = isTaoyuan ? userLat : 24.9880; 
                        const finalLng = isTaoyuan ? userLng : 121.2960;

                        document.getElementById('location-text').innerText = isTaoyuan ? "已完成精準定位" : "模擬桃園市區定位";
                        
                        processStops(finalLat, finalLng);
                    },
                    error => {
                        document.getElementById('gps-icon').classList.remove('animate-spin');
                        document.getElementById('location-text').innerText = "預設定位 (愛買附近)";
                        processStops(24.9865, 121.2952);
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            }
        }

        function processStops(lat, lng) {
            const stopsWithDistance = taoyuanStopsDB.map(stop => {
                const dist = calculateDistance(lat, lng, stop.lat, stop.lng);
                const walkMins = Math.max(1, Math.round(dist / 60));
                const dynamicTimes = generateDynamicTimes();
                return { ...stop, distance: dist, walkMins: walkMins, times: dynamicTimes };
            });

            stopsWithDistance.sort((a, b) => a.distance - b.distance);
            const nearestStops = stopsWithDistance.slice(0, 4);
            currentClosestStop = nearestStops[0];

            renderNearby(nearestStops);
            updateRecommendCard(nearestStops[0]);
        }

        function renderNearby(stops) {
            const container = document.getElementById('nearby-stops-list');
            container.innerHTML = stops.map(stop => `
                <div class="flex items-center justify-between p-3.5 bg-slate-50 hover:bg-emerald-50 rounded-xl border border-slate-100 transition cursor-pointer active:scale-95">
                    <div class="flex items-center gap-3">
                        <div class="bg-blue-100 text-blue-700 p-2 rounded-lg font-bold text-xs flex flex-col items-center w-14">
                            <span class="text-[10px] text-blue-500">距離</span>
                            ${stop.distance > 999 ? (stop.distance/1000).toFixed(1)+'km' : stop.distance+'m'}
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-slate-800 text-base">${stop.name}</h4>
                                <span class="bg-amber-100 text-amber-800 text-[10px] font-black px-1.5 py-0.5 rounded">${stop.mainRoute}</span>
                            </div>
                            <span class="text-xs text-slate-500">🚶 走 ${stop.walkMins} 分鐘 | 經過: ${stop.allRoutes}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-lg font-black text-emerald-600">${stop.times[0].timeStr}</span>
                        <span class="text-[10px] block text-emerald-500 font-bold">${stop.times[0].minutesLeft} 分後進站</span>
                    </div>
                </div>
            `).join('');
        }

        function updateRecommendCard(closestStop) {
            if(!closestStop) return;
            const nextBus = closestStop.times[0];

            // 判斷當前模式
            if (currentMode === 'school') {
                document.getElementById('recommend-route').innerText = "1路 / 302路";
                document.getElementById('recommend-board').innerText = closestStop.name;
                document.getElementById('recommend-alight').innerText = "桃園農工";
                document.getElementById('recommend-direction').innerText = "往 桃園農工/萬壽路 方向";
            } else {
                document.getElementById('recommend-route').innerText = "1路 / 307路";
                document.getElementById('recommend-board').innerText = closestStop.name === "桃園農工" ? "桃園農工" : closestStop.name;
                document.getElementById('recommend-alight').innerText = "愛買(中山路)";
                document.getElementById('recommend-direction').innerText = "往 中壢/中山路 方向";
            }

            document.getElementById('recommend-time').innerText = nextBus.timeStr;
            document.getElementById('recommend-board-time').innerText = nextBus.timeStr;
            document.getElementById('recommend-arrive-time').innerText = `預計 ${nextBus.arriveStr} 到達`;
            document.getElementById('recommend-walk').innerHTML = `<i class="fa-solid fa-person-walking"></i> 步行約 ${closestStop.walkMins} 分鐘`;
        }

        // --- 4. 互動模式 (去學校 / 回家) ---
        function startMode(type) {
            currentMode = type;
            if(!currentClosestStop) return alert('正在精準定位中，請稍等一下下喔！');

            if (type === 'school') {
                updateRecommendCard(currentClosestStop);
                showModal('🏫 去學校模式', '1路 縱貫線', currentClosestStop.name, '桃園農工', currentClosestStop.times[0].timeStr, currentClosestStop.times[0].arriveStr, '往 桃園農工/萬壽路 方向');
            } else {
                updateRecommendCard(currentClosestStop);
                const boardName = currentClosestStop.name === "桃園農工" ? "桃園農工" : currentClosestStop.name;
                showModal('🏠 回家模式', '1路 縱貫線', boardName, '愛買(中山路)', currentClosestStop.times[0].timeStr, currentClosestStop.times[0].arriveStr, '往 中壢/中山路 方向');
            }
        }

        function confirmTrip() {
            if(!currentClosestStop) return;
            const route = document.getElementById('recommend-route').innerText;
            const board = document.getElementById('recommend-board').innerText;
            const alight = document.getElementById('recommend-alight').innerText;
            const time = document.getElementById('recommend-time').innerText;
            const arriveTime = document.getElementById('recommend-arrive-time').innerText;
            const direction = document.getElementById('recommend-direction').innerText;

            showModal('🚌 上車防錯確認', route, board, alight, time, arriveTime.replace('預計 ', ''), direction);
        }

        function showModal(title, route, from, to, time, arriveTime, direction) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <p class="text-center font-black text-emerald-800 text-lg mb-2">${title}</p>
                <div class="space-y-2 text-base font-medium">
                    <p class="text-slate-900">🚌 搭乘公車：<strong class="text-xl text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">${route}</strong></p>
                    <p class="bg-amber-50 p-2 rounded-lg border border-amber-200 text-amber-900">
                        ➡️ 認明方向：<strong class="text-amber-700 font-bold">${direction}</strong>
                    </p>
                    <p>📍 上車地點：<strong>${from}</strong> (${time} 發車)</p>
                    <p>🏁 下車地點：<strong>${to}</strong> (預計 ${arriveTime} 到達)</p>
                </div>
                <div class="bg-emerald-100 p-2.5 rounded-lg border border-emerald-300 text-xs text-emerald-900 mt-3 text-center font-bold">
                    💡 提示小朋友：上車前看一眼公車頭頂的車牌號碼對不對喔！
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function confirmBoardingSuccess() {
            alert('設定成功！App 將會在公車即將到達前提醒您出門。');
            closeModal();
        }
        function openSettings() { alert('進入家長設定專區 (包含常用站牌與預設路線)'); }

        // --- 啟動初始化 ---
        updateTime();
        setInterval(updateTime, 60000); 
        setTimeout(requestLocation, 500);

    </script>
</body>
</html>
