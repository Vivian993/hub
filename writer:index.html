<style>
  :root{
    --pink:#FF6FA0; --pink-deep:#C43D72;
    --teal:#3A8F8F; --teal-deep:#26696B;
    --gold:#F3A93C; --cream:#FFF8E9; --ink:#4A3620; --ink-soft:#7A6650; --paper:#FFFDF7; --line:#E9D9B8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream); font-family:'Noto Sans TC',sans-serif; color:var(--ink); -webkit-tap-highlight-color:transparent;}
  .shell{max-width:620px;margin:0 auto;min-height:100vh; position:relative;
    background:
      radial-gradient(circle at 10% 8%, rgba(255,111,160,.10) 0%, transparent 40%),
      radial-gradient(circle at 90% 14%, rgba(58,143,143,.12) 0%, transparent 35%),
      var(--cream);}

  #selector{padding:34px 22px 40px;}
  #selector header{text-align:center; margin-bottom:26px;}
  .gate{font-size:14px; letter-spacing:3px; color:var(--pink-deep); font-weight:700;}
  #selector h1{font-family:'ZCOOL KuaiLe',cursive; font-size:36px; margin:8px 0 6px; color:#C6862A;}
  #selector header p{margin:0; font-size:15px; color:var(--ink-soft);}

  .mode-card{background:var(--paper); border-radius:26px; padding:26px 22px; margin-bottom:20px;
    border:2px solid var(--line); box-shadow:0 6px 0 #EBDDBB, 0 8px 20px rgba(180,140,60,.10); cursor:pointer; display:flex; gap:18px; align-items:center;}
  .mode-card .icon{font-size:56px; flex:0 0 auto;}
  .mode-card .txt h2{margin:0 0 4px; font-size:22px;}
  .mode-card .txt p{margin:0 0 8px; font-size:14px; color:var(--ink-soft); line-height:1.6;}
  .mode-card .go{display:inline-block; font-size:13px; font-weight:700; padding:6px 14px; border-radius:14px;}
  .card-young{}
  .card-young .txt h2{color:var(--pink-deep); font-family:'ZCOOL KuaiLe',cursive;}
  .card-young .go{background:#FFD9E6; color:var(--pink-deep);}
  .card-teen .txt h2{color:var(--teal-deep); font-family:'Noto Serif TC',serif;}
  .card-teen .go{background:#E1F0F0; color:var(--teal-deep);}

  .hint{font-size:13px; color:var(--ink-soft); background:#FBEED0; padding:12px 16px; border-radius:14px; margin-top:6px; line-height:1.7;}

  #frameWrap{position:fixed; inset:0; display:none; z-index:5;}
  #frameWrap.open{display:block;}
  #appFrame{width:100%; height:100%; border:none; display:block;}
  #switchBtn{position:fixed; top:14px; left:14px; z-index:9999; background:rgba(74,54,32,.82); color:#fff;
    border:none; border-radius:20px; padding:9px 15px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:5px; box-shadow:0 3px 10px rgba(0,0,0,.2);}
  #switchBtn:active{transform:translateY(1px);}
</style>
</head>
<body>
<div class="shell">
  <div id="selector">
    <header>
      <div class="gate">WRITING WONDERLAND</div>
      <h1>寫作樂園</h1>
      <p>先選一個適合的版本，馬上開始寫作冒險</p>
    </header>

    <div class="mode-card card-young" id="pickYoung">
      <div class="icon">🏰</div>
      <div class="txt">
        <h2>低年級版｜寫作魔法樂園</h2>
        <p>拼圖式填空造句，一站一站完成一篇作文。適合國小低、中年級，字大好操作。</p>
        <span class="go">進入樂園 ➜</span>
      </div>
    </div>

    <div class="mode-card card-teen" id="pickTeen">
      <div class="icon">🧭</div>
      <div class="txt">
        <h2>高年級版｜寫作探險家</h2>
        <p>引導鷹架＋自由寫作雙模式，含議論文、讀書心得等進階主題與高年級詞彙寶庫。</p>
        <span class="go">開始探險 ➜</span>
      </div>
    </div>

    <div class="hint">💡 兩個版本各自獨立運作、各自存檔，選錯了也沒關係，隨時可以按左上角「切換版本」回到這頁重新選擇。</div>
  </div>

  <div id="frameWrap">
    <button id="switchBtn">⬅️ 切換版本</button>
    <iframe id="appFrame"></iframe>
  </div>
</div>

function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

const frameWrap = document.getElementById("frameWrap");
const appFrame = document.getElementById("appFrame");
const selector = document.getElementById("selector");

function openApp(which){
  const html = which === "young" ? b64ToUtf8(YOUNG_HTML_B64) : b64ToUtf8(TEEN_HTML_B64);
  appFrame.srcdoc = html;
  frameWrap.classList.add("open");
  selector.style.display = "none";
}

document.getElementById("pickYoung").onclick = ()=> openApp("young");
document.getElementById("pickTeen").onclick = ()=> openApp("teen");
document.getElementById("switchBtn").onclick = ()=>{
  frameWrap.classList.remove("open");
  appFrame.srcdoc = "about:blank";
  selector.style.display = "block";
};
</script>
</body>
</html>
